# Auslieferung nach GitHub Pages.
#
# Der Ablauf hat ZWEI Stufen, und das ist der Punkt: erst die Torkette,
# dann erst der Versand. Was rot ist, geht nicht auf das iPad der Kinder.
# Ein Bau ohne Tore davor waere kein Auslieferungsablauf, sondern eine
# Rutsche.
name: Auslieferung

on:
  push:
    branches: [main]
  # Von Hand ausloesbar, ohne etwas zu aendern - fuer den Fall, dass
  # Pages neu eingerichtet wurde und einmal frisch gebaut werden muss.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tore:
    name: Torkette
    runs-on: ubuntu-latest
    # Die Adresse des Gleichlaufdienstes (Q29/Q30).
    #
    # Sie steht als Variable im Repository (Settings → Secrets and
    # variables → Actions → Variables, Name `SMARTKIDS_GLEICHLAUF`) und
    # NICHT im Code: dann laesst sie sich setzen, ohne etwas einzuchecken,
    # und ein Fork bekommt sie nicht mit.
    #
    # Sie ist kein Geheimnis, deshalb `vars` und nicht `secrets`: die
    # Adresse steht ohnehin in jeder gebauten Datei. Was geheim bleibt,
    # ist der Familienschluessel, und der kommt nie hierher.
    #
    # Ist die Variable nicht gesetzt, ist sie leer - und dann ist der
    # Gleichlauf aus. Das ist die Voreinstellung und bleibt es, bis
    # jemand einen Dienst aufsetzt.
    env:
      SMARTKIDS_GLEICHLAUF: ${{ vars.SMARTKIDS_GLEICHLAUF }}
    steps:
      # Ein flacher Klon reicht.
      #
      # Hier stand `fetch-depth: 0` mit der Begruendung, `rhythmus` zaehle
      # Runden am Code und brauche dafuer die Historie. Es zaehlt seit dem
      # Umbau in TAGEN, und ein Datum steht in der Standdatei — Historie
      # braucht davon nichts.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Playwright braucht seinen eigenen Chromium. --with-deps holt die
      # Systembibliotheken dazu; ohne sie startet er auf dem Runner nicht.
      #
      # WELCHEN Chromium er holt, entscheidet die Playwright-Fassung in
      # `package.json` - und die steht dort auf den Punkt genau (1.56.1,
      # Bau 1194, Chromium 141.0.7390.37), weil genau der auch am
      # Arbeitsplatz liegt. Mit `^1.56.1` war es zehn Hauptversionen
      # daneben: hier 141, hier gruen; dort 151, dort rot. Nachgeprueft
      # wird das bei jedem Browserstart (`tor/chromium.mjs`), damit ein
      # `npm update` es nicht wieder still auseinanderzieht - Regel 16,
      # der Runner und dieser Rechner fahren denselben Browser.
      - run: npx playwright install --with-deps chromium
      # `tor:runner` ist die volle Kette OHNE das Tor `ansicht`. Das ist
      # kein stiller Verzicht: das Tor meldet den Verzicht im Protokoll
      # samt Grund. Bildpunktvergleiche gelten nur bei gleicher
      # Zeichenumgebung. Der Chromium-Bau ist seit Q18b auf beiden Seiten
      # derselbe; die Schriften sind es nicht.
      #
      # Und das ist seit Q21 GEMESSEN statt vermutet (Ablauf
      # `Bildmessung`, von Hand anzustossen): von 37 Aufnahmen sind auf
      # dem Runner 35 rot, zwischen 0,23 % und 4,02 % - das Fuenfzigfache
      # des erlaubten Bandes von 0,08 %. Gruen sind genau die beiden OHNE
      # Text (`mg-farbstreifen`, `karte-deutschland`), und die auf den
      # Bildpunkt genau: derselbe Chromium zeichnet dasselbe, sobald kein
      # Buchstabe im Bild ist.
      #
      # Damit ist beides belegt - dass Regel 16 haelt, und dass `ansicht`
      # hier trotzdem nicht laufen kann.
      - name: Alle Tore (ohne ansicht — siehe Protokoll)
        run: npm run tor:runner
      # Bei Rot bleibt sichtbar, WAS sich geaendert hat - sonst steht da
      # nur eine Prozentzahl und niemand kann sie beurteilen.
      - name: Abweichungen sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abweichungen
          path: tor/abweichungen/
          if-no-files-found: ignore
      # Die Vorschau wird MITGENOMMEN, nicht weggeräumt.
      #
      # Pages kennt eine Seite je Verzeichnis. Stellte nur der eine Ablauf
      # zusammen, löschte jede Auslieferung die Vorschau, während jemand
      # sie gerade ansieht - und jeder Versand der Vorschau das
      # ausgelieferte Spiel. Deshalb stellen BEIDE beide Hälften zusammen,
      # mit demselben Werkzeug und beide vom Standardzweig aus.
      - name: Seite zusammenstellen (Spiel + Vorschau, falls es eine gibt)
        run: node tools/seite-zusammenstellen.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: seite

  ausliefern:
    name: Nach Pages
    needs: tore
    runs-on: ubuntu-latest
    # Die Schlange gehoert an den VERSAND, nicht an den ganzen Ablauf.
    #
    # Solange sie am Ablauf hing, lagen Torkette und Vorschau-Versand in
    # derselben Gruppe - und ein Versand, der waehrend einer laufenden
    # Kette eintraf, hat sie abgebrochen. Genau das ist am 29.08. passiert:
    # die Auslieferung von 96d21d5 steht als "cancelled" im Protokoll,
    # ohne dass irgendetwas an ihr falsch war.
    #
    # cancel-in-progress bleibt false: eine begonnene Auslieferung wird zu
    # Ende gefuehrt, sonst steht am Ende eine halbe Seite im Netz.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
