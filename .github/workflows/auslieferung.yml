# Auslieferung nach GitHub Pages.
#
# Der Ablauf hat ZWEI Stufen, und das ist der Punkt: erst die Torkette,
# dann erst der Versand. Was rot ist, geht nicht auf das iPad der Kinder.
# Ein Bau ohne Tore davor waere kein Auslieferungsablauf, sondern eine
# Rutsche.
name: Auslieferung

on:
  push:
    branches: [main]
  # Von Hand ausloesbar, ohne etwas zu aendern - fuer den Fall, dass
  # Pages neu eingerichtet wurde und einmal frisch gebaut werden muss.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Zwei Auslieferungen gleichzeitig wuerden sich gegenseitig ueberschreiben.
# cancel-in-progress steht bewusst auf false: eine begonnene Auslieferung
# wird zu Ende gefuehrt, sonst steht am Ende eine halbe Seite im Netz.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tore:
    name: Torkette
    runs-on: ubuntu-latest
    steps:
      # Die ganze Historie, nicht nur der letzte Commit.
      #
      # `rhythmus` zaehlt, wieviele Runden seit dem letzten vollen
      # Probenlauf ins Verzeichnis gegangen sind. In einem flachen Klon gibt
      # es den festgehaltenen Commit nicht, und das Tor kann nichts zaehlen.
      # Es meldet das dann laut und faellt durch - richtig so, aber
      # vermeidbar: der Baum hat ein paar Dutzend Commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Playwright braucht seinen eigenen Chromium. --with-deps holt die
      # Systembibliotheken dazu; ohne sie startet er auf dem Runner nicht.
      - run: npx playwright install --with-deps chromium
      # `tor:runner` ist die volle Kette OHNE das Tor `ansicht`. Das ist
      # kein stiller Verzicht: das Tor meldet den Verzicht im Protokoll
      # samt Grund. Bildpunktvergleiche gelten nur bei gleicher
      # Zeichenumgebung, und der Runner hat einen anderen Chromium-Bau
      # und andere Ersatzschriften. `ansicht` gehoert an den Arbeitsplatz.
      - name: Alle Tore (ohne ansicht — siehe Protokoll)
        run: npm run tor:runner
      # Bei Rot bleibt sichtbar, WAS sich geaendert hat - sonst steht da
      # nur eine Prozentzahl und niemand kann sie beurteilen.
      - name: Abweichungen sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abweichungen
          path: tor/abweichungen/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  ausliefern:
    name: Nach Pages
    needs: tore
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
