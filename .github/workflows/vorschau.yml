# Vorschau — die PRÜFUNG.
#
# Damit man etwas ansehen kann, bevor es durch die volle Kette geht. Dieser
# Ablauf prüft nur; versandt wird von `vorschau-versand.yml` aus, und zwar
# vom Standardzweig aus. Warum getrennt, steht dort.
#
# Er fährt NUR die Tore ohne Browser — inhalt (mit topologie, beruehrung,
# marken, schrift, symbol, doku), spielprobe, schreiben, vergleich,
# gleichlauf, budget, anker.
# Zusammen
# unter drei Sekunden, und kein `playwright install` (das allein sind 39 s).
# Was fehlt, fehlt ausdrücklich:
#
#     rhythmus     ob die Gegenproben nicht veraltet sind
#     passt        läuft nicht über den Rand
#     lesbarkeit   Kontrast
#     ziehen       Nachsicht beim Ziehen
#     ansicht      Bildvergleich
#     pwa/offline  startet ohne Netz
#     smoke        spielt die App wirklich durch
#
# Eine Vorschau kann also auf dem Gerät kaputt sein. Deshalb steht unten
# links das Wort „Vorschau" im Bild, und deshalb liegt sie unter /vorschau/
# und nicht dort, wo die Kinder spielen.
#
# Diese Liste wird VERGLICHEN, nicht geglaubt: das Tor `doku` legt sie neben
# die Kette in package.json und schlägt an, wenn ein Tor dazukommt, das hier
# weder gefahren noch genannt ist. Beim ersten Lauf fehlte `rhythmus`.
name: Vorschau

on:
  push:
    branches: [vorschau]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: Schnelle Tore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Die schnellen Tore
        run: |
          node tor/inhalt.mjs
          node tor/regeln.mjs
          node tor/doppelt.mjs
          node tor/spielprobe.mjs
          node tor/schreiben.mjs
          node tor/vergleich.mjs
          node tor/gleichlauf.mjs
          node prototyp/bauen.mjs
          node tor/budget.mjs
          node tor/anker.mjs
