# Die Gegenproben — NACHTS, nicht in der Runde.
#
# Sie prüfen die TORE, nicht die App: jede baut einen Fehler ein und sieht
# nach, ob das zuständige Tor rot wird und dabei das Richtige sagt. Das ist
# wertvoll und dauert zwanzig Minuten — und beides zusammen heißt: es
# gehört nicht auf die Uhr desjenigen, der gerade etwas ändert.
#
# Vorher lief `rhythmus` vorn in der Torkette und verlangte, dass kein
# Nachweis älter als drei RUNDEN AM CODE ist. Das hat in einer einzigen
# Sitzung dreimal einen vollen Lauf ausgelöst, mitten in der Arbeit — und
# war obendrein die falsche Größe: eine Arbeitssitzung macht zwanzig
# Commits, das Tor stand danach auf 47 Runden Rückstand, obwohl jede Probe
# am selben Tag bezeugt worden war. Es zählt jetzt in TAGEN, und der
# Runner hier hält sie frisch.
#
# Jetzt bezahlt sie der Runner. Schlägt etwas an, steht es hier im
# Protokoll und der Stand wird zurückgeschrieben — die Runde am nächsten
# Morgen fängt mit frischen Nachweisen an.
name: Gegenproben

on:
  schedule:
    - cron: '0 2 * * *'      # 03:00 bzw. 04:00 deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proben:
    name: Alle Gegenproben
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Volle Historie: der Lauf schreibt den Stand zurück und braucht
      # dafür einen Zweig, auf den er pushen kann. (`rhythmus` braucht sie
      # nicht mehr — es zählt seit dem Umbau in Tagen.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `ansicht` ist hier abgeschaltet - dasselbe wie in der Auslieferung
      # (`npm run tor:runner`) und aus demselben Grund: die Vorbilder
      # entstehen auf dem Arbeitsrechner, dieser Runner rastert anders
      # (Regel 16). Ohne diese Zeile fand jede der zwoelf `ansicht`-Proben
      # das Tor VOR ihrem Eingriff schon rot und meldete „beweist nichts" -
      # zwoelf von einundzwanzig Befunden waren gar keine, und dieser Lauf
      # war fuenfmal von fuenf rot. `proben` laesst sie jetzt ausdruecklich
      # aus, nennt sie beim Namen und gibt ihnen KEINEN Nachweis: sie
      # altern weiter, bis `rhythmus` sie auf dem Arbeitsrechner faellig
      # macht.
      - name: Alle Gegenproben
        id: proben
        continue-on-error: true
        env:
          SMARTKIDS_OHNE_ANSICHT: '1'
        run: npm run proben
      # Der Stand wird zurückgeschrieben, AUCH wenn eine Probe nicht
      # angeschlagen hat: was angeschlagen hat, hat angeschlagen. Die
      # Nachweise gehen nicht verloren, weil eine andere Probe scheitert.
      - name: Stand zurückschreiben
        run: |
          set -euo pipefail
          if git diff --quiet tor/proben-stand.json; then
            echo "  Kein neuer Nachweis."
            exit 0
          fi
          git config user.name  "Gegenproben"
          git config user.email "noreply@github.com"
          git add tor/proben-stand.json
          git commit -m "Probenstand (nächtlicher Lauf)"
          # Erst holen, dann schieben (QS10).
          #
          # Der Lauf dauert eine halbe Stunde. Wer in dieser Zeit auf `main`
          # pusht, liess den Nachweis von 276 Gegenproben verfallen: `git
          # push` wurde abgelehnt, der Auftrag rot, und der Stand landete
          # nie im Verzeichnis. Genau so passiert am 04.09.
          #
          # `--rebase` ist hier gefahrlos, weil dieser Auftrag GENAU EINE
          # Datei anfasst und niemand sonst sie schreibt. Bei einem
          # Zusammenstoss gilt der frischere Nachweis - der eigene.
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && exit 0
            echo "  Push $i fehlgeschlagen, neuer Versuch."
            sleep 5
          done
          echo "::error::Der Probenstand liess sich nicht schieben."
          exit 1
      - name: Was nicht angeschlagen hat
        if: steps.proben.outcome != 'success'
        run: |
          echo "::warning::Nicht jede Gegenprobe hat angeschlagen — siehe Protokoll oben."
          exit 1
