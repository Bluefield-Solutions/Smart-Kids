<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Kids">

<meta name="description" content="Erdkunde für Fiona und Lea: Kontinente, Länder, Bundesländer, Landeshauptstädte.">
<title>Smart Kids</title>
__KOPF__
<style>
/* === Marken. Hier steht KEINE Kopie mehr. ==============================
   Bis eben stand src/marken/marken.css hier ein zweites Mal, von Hand
   gepflegt - und die beiden waren laengst auseinander: die App fuehrte
   --tinte2, das System --tinte-2; die App --tiefe, das System
   --tiefe-farbe. Vier Marken (--app-gut, --app-warn, --app-linie,
   --f-mono) benutzte die App, ohne dass sie IRGENDWO definiert waren -
   deshalb hat sich kein Fortschrittsbalken je gefuellt und "Richtig -
   Thueringen!" stand nie in Gruen.

   Der Bau setzt die Datei jetzt hier ein. Was zweimal dasteht, veraltet
   einmal (Regel 6). */
__MARKEN__
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(168deg,var(--grund) 0%,var(--grund-2) 100%);
  background-attachment:fixed;
  color:var(--tinte);font-family:var(--f-ui);line-height:1.3;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;
}
/* Der sichere Bereich gehoert an die BUEHNE, nicht an den Rumpf.
   Das Polster stand auf `body` - und hatte keinerlei Wirkung: `#buehne` ist
   `position:absolute`, `body` ist nicht positioniert, also bezieht sich
   `inset:0` auf das FENSTER und nicht auf das Polster. Nachgemessen: mit 44
   Punkten Polster am Rumpf blieb der Schliessen-Knopf exakt dort, wo er
   vorher war, 12 Punkte von der Ecke. Auf dem iPhone sitzt dort die Uhr,
   rechts daneben der Akku - der Knopf war nicht schlecht gebaut, er war
   unter der Statusleiste begraben und nahm den Finger nicht an. */
#buehne{position:absolute;display:flex;flex-direction:column;
  top:var(--sicher-oben); right:var(--sicher-rechts);
  bottom:var(--sicher-unten); left:var(--sicher-links)}
.schirm{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--d-schirm) var(--k-standard)}
.schirm.da{opacity:1;pointer-events:auto}
/* Ein Bildschirm, der geht, darf nichts mehr annehmen - AUCH NICHT ueber
   ein Kind, das sich `pointer-events` selbst setzt.
   Genau das ist passiert: die unsichtbaren Trefferkreise (`pointer-events:
   all`, damit man kleine Gebiete ueberhaupt treffen kann) hoben das `none`
   ihres ausgeblendeten Bildschirms auf und blieben die 340 ms der
   Ueberblendung aktiv. Wer in dieser Zeit ein Etikett losliess, traf einen
   Kreis der VORIGEN Aufgabe - die Antwort war richtig und wurde als falsch
   gewertet. Reproduzierbar bei Fiona, Ebene 4, direkt nach den
   Bundeslaendern. */
.schirm:not(.da) *{pointer-events:none!important}

/* Der Übergang von Aufgabe zu Aufgabe.
   Zwei Bildschirme, die gleichzeitig ineinander blenden, ergeben zwischen
   zwei Aufgaben derselben Ebene ein Blinzeln: die Karte ist identisch,
   also sieht man nur, wie sie kurz dunkler wird. Was sich wirklich
   ändert, sind Frage und Antworten - und die KOMMEN jetzt herein, leicht
   von unten und nacheinander. Der gehende Bildschirm geht dafür schneller
   (halbe Dauer), damit sich die beiden weniger überlagern.
   Bewegt wird nur `opacity` und `transform`: beides kostet kein neues
   Layout, und die Antwortliste steht auch währenddessen schon an ihrem
   endgültigen Platz. */
.schirm{transition-duration:calc(var(--d-schirm) / 2)}
/* Das Neue wartet einen Takt.
   Ohne den Versatz überlagern sich beide Bildschirme halbdurchsichtig:
   auf dem Bild aus der Mitte des Übergangs standen die alte Lobzeile und
   die neue Frage übereinander, und hinter der neuen Karte lag die alte
   mit ihrem grün gefärbten Treffer. Ein Doppelbild ist nicht besser als
   ein Blinzeln. Der gehende Bildschirm braucht `--d-schirm / 2`; genau so
   lange wartet das Neue. */
.schirm.da{transition-duration:var(--d-schirm);
  transition-delay:calc(var(--d-schirm) / 2)}
@keyframes herein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.schirm.da .frage,
.schirm.da .karte,
.schirm.da .etikett,
.schirm.da .eingabe{animation:herein var(--d-schirm) var(--k-standard) both;
  animation-delay:calc(var(--d-schirm) / 2)}
.schirm.da .etikett{animation-delay:calc(var(--d-schirm) / 2
  + var(--rang, 0) * var(--d-staffel))}

/* Drei Felder, festes Raster: die Mitte ist damit WIRKLICH mittig, egal
   wie breit links und rechts sind. `space-between` verteilte nur den
   Zwischenraum - "Fiona" sass bei 844 Punkten Breite auf 366 statt 422.
   Und nichts bricht mehr um: im Hochformat rutschten "Forscherbuch" und
   "Eltern" unter "Zurueck", der Kopf war 112 Punkte hoch und schief. */
/* Das Fortschrittsband.
   Statt „3/8" - eine Zahl, die ein Kind erst lesen und dann verrechnen
   muss - steht dort eine Reihe Punkte: was war, was gerade dran ist, was
   kommt. Und sie sagen zusaetzlich, WIE es lief: glatt beim ersten
   Versuch, geschafft mit Hilfe, oder gezeigt. Das ist derselbe
   Fortschritt, nur ohne Lesen. */
.band{display:flex;gap:var(--r2);align-items:center}
.band i{width:12px;height:12px;border-radius:50%;background:var(--linie-2);
  transition:background var(--d-zustand) var(--k-standard),
             transform var(--d-zustand) var(--k-standard)}
.band i.glatt{background:var(--gut)}
.band i.geschafft{background:var(--treffer);opacity:.75}
.band i.gezeigt{background:var(--warn)}
/* Im Test danebengelegen (B2).
   Dieselbe Farbe wie „vorgemacht bekommen" - und das ist kein Versehen:
   die beiden koennen im selben Band nie zusammen vorkommen. Im Test wird
   nichts vorgemacht, in der Uebung gibt es kein Daneben ohne Aufloesung.
   Zwei Farben fuer zwei Dinge, die sich nie begegnen, waeren eine
   Unterscheidung, die niemand je sieht. */
.band i.daneben{background:var(--warn)}
/* Der Pokal auf der Kachel (B2) - in derselben Zeile wie der
   Aufkleberstand, weil beide dasselbe sagen: was du hier hast. */
.kachel .pokal{display:inline-flex;line-height:0;margin-left:var(--r1)}
.kachel .pokal svg{width:22px;height:22px}
.band i.weiter{background:var(--linie)}
.band i.jetzt{background:var(--ziel);transform:scale(1.5)}
@media (max-width:420px){ .band i{width:9px;height:9px} .band{gap:var(--r1)} }

.kopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:var(--r3);padding:var(--r3) var(--r4);flex:none;min-height:68px}
.kopf-links{justify-self:start;display:flex;gap:var(--r2);min-width:0}
.kopf-mitte{justify-self:center;display:flex;align-items:center;gap:var(--r2);min-width:0}
.kopf-rechts{justify-self:end;display:flex;gap:var(--r2);min-width:0}
.marke{font-family:var(--f-ui);font-size:var(--s0);font-weight:700;color:var(--tinte-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Der Zaehler ist eine Zahl, kein Satz: gross, mit Ziffern gleicher Breite. */
.zaehler{font-family:var(--f-ui);font-size:var(--s1);font-weight:800;color:var(--tinte);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.zaehler i{font-style:normal;color:var(--tinte-2);margin:0 .1em;font-weight:600}
/* Zeichenknoepfe: rund, genau 44 Punkte - die Untergrenze fuer einen Daumen. */
.knopf.rund{width:44px;height:44px;padding:0;justify-content:center;flex:none}
@media (max-width:520px){ .knopf .wort{display:none} .knopf{padding:var(--r2)} }
/* --- Die drei Knopfklassen ------------------------------------------
   Vorher war JEDER Knopf dieselbe weisse Pille: die Antwort, die
   Ebenenkachel, "Zurueck", "Eltern". Deshalb wirkte nichts gestaltet - es
   gab keine Rangfolge. Jetzt drei Gewichte:

     .knopf    LEISE      Werkzeug am Rand. Kein Fuellton, keine Tiefe.
     .kachel   MITTEL     Etwas zum Aussuchen. Papier mit Kante.
     .etikett  LAUT       Die Antwort. Der wichtigste Knopf der App.

   Die Tiefe ist bei allen dieselbe Mechanik: helle Linie oben INNEN,
   dunklere Kante unten. Beim Druecken faehrt der Knopf um genau die
   Kantenhoehe nach unten - dann sieht es aus, als gaebe er nach. */
.knopf{font-family:var(--f-ui);font-size:var(--s0);font-weight:700;color:var(--tinte-2);
  background:transparent;border:var(--strich) solid var(--knopf-rand);border-radius:var(--rund-voll);
  padding:var(--r2) var(--r4);min-height:44px;display:flex;align-items:center;gap:var(--r2);
  cursor:pointer;transition:background var(--d-tipp) var(--k-standard),
    border-color var(--d-tipp) var(--k-standard),color var(--d-tipp) var(--k-standard)}
.knopf:active{background:var(--papier);border-color:var(--tinte-3);color:var(--tinte)}
@media (hover:hover){.knopf:hover{background:var(--papier);border-color:var(--tinte-3);color:var(--tinte)}}
/* Genau EIN lauter Knopf je Bildschirm - dieselbe Tiefe wie am Etikett.
   Auf dem Endbildschirm standen drei gleich leise Knoepfe nebeneinander:
   "Noch einmal", "Forscherbuch", "Etwas anderes". Was als naechstes
   passieren soll, war daran nicht zu sehen - und wer nicht liest, sieht
   nur drei graue Kapseln. */
.knopf.haupt{color:var(--auf-flaeche);background:var(--primaer);
  border-color:var(--primaer-rand);
  box-shadow:0 var(--kante) 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  padding:var(--r3) var(--r8);min-height:56px;font-size:var(--s1)}
.knopf.haupt:active{transform:translateY(3px);background:var(--primaer);
  color:var(--auf-flaeche);border-color:var(--primaer-rand);
  box-shadow:0 0 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.knopf.haupt:hover{background:var(--primaer);
  color:var(--auf-flaeche);border-color:var(--primaer-kante)}}
/* Der eine Knopf, der etwas WEGNIMMT (R1).
   Kein voller Warnton als Fläche - das wäre ein Alarm, und der Knopf ist
   keiner: er steht neben zwei harmlosen und soll nur nicht mit ihnen
   verwechselt werden. Also die Schrift und der Rand in `--warn`, die
   Fläche hell. */
/* Die SCHRIFT ist dunkler als der Rand. `--warn` pur auf `--warn-h` kam
   auf 2,92:1 - das Tor `lesbarkeit` hat den Knopf gemeldet, sowie es ihn
   das erste Mal zu sehen bekam. Der Rand darf den vollen Warnton tragen,
   er ist keine Schrift. */
.knopf.warnend{color:color-mix(in oklab, var(--warn) 72%, var(--tinte));
  border-color:var(--warn);background:var(--warn-h)}
.knopf.warnend:active{transform:translateY(3px);
  color:color-mix(in oklab, var(--warn) 72%, var(--tinte));
  border-color:var(--warn);background:var(--warn-h)}
@media (hover:hover){.knopf.warnend:hover{
  color:color-mix(in oklab, var(--warn) 72%, var(--tinte));
  border-color:var(--warn);background:var(--warn-h)}}
/* Der Vorlauf (R3).

   Er borgt sich das Gitter des Forscherbuchs, aber nicht dessen Groesse:
   dort stehen die paar Stuecke, die schon gesammelt sind, hier ALLE
   sechzehn eines Bundeslandes auf einmal. Bei 148 Punkten je Karte
   scrollte das auf dem kleinsten Geraet (iPhone SE quer, 667 x 375) - und
   `passt` sagt zu Recht, dass ein Kind nicht in einer Liste scrollt, von
   der es nicht weiss, dass sie weitergeht.

   Also kleiner, aber nicht beliebig klein: 84 Punkte ist die Breite, bei
   der 16 Stuecke auf dem kleinsten Geraet in drei Reihen stehen. */
/* `safe center`, nicht `center`.
   Zentriert man den Inhalt eines Behaelters, der ueberlaeuft, wird er an
   BEIDEN Enden abgeschnitten - und nach oben kann man nicht scrollen. Der
   Stadtstaaten-Satz stand bei den Hauptstaedten halb ueber dem oberen
   Rand. `safe` faellt in dem Fall auf `flex-start` zurueck. */
.rollen.vorlauf{display:flex;flex-direction:column;gap:var(--r3);
  align-items:center;justify-content:safe center;
  /* Die Hoechstmasse EINER Beispielkarte - ungefaehr quadratisch, die Form
     eines Aufklebers. Das Gitter rechnet daraus seine eigenen
     Hoechstmasse; gedeckelt wird also das Gitter, nicht die Karte. Der
     Versuch, die Karte selbst zu deckeln, hat sie zum Einsturz gebracht:
     mit `max-height` und `align-self:center` bemisst sich ein
     Gitterkind an seinem Inhalt, und der Inhalt darf hier auf null
     schrumpfen (`flex:1 1 0`). Uebrig blieben sechs flache Striche mit
     uebereinanderliegender Schrift. */
  --kleber-breit:180px;--kleber-hoch:168px;
  /* Fuer Gitter mit mehr als acht Spalten - siehe `.kleber.viel`. */
  --kleber-breit-eng:120px;
  /* Die Untergrenze einer engen Spalte - EINMAL, weil die Regel darueber
     zweimal dasteht (im Grundsatz und im kurzen Querformat). Genau das
     ist schiefgegangen: gepflegt wurde die obere, gegolten hat auf dem
     Zielgeraet die untere. */
  --kleber-eng-min:56px}
.rollen.vorlauf .mitte-satz{text-align:center;max-width:52ch}
/* Wieviele Karten NEBENEINANDER, und wie hoch sie werden.
 *
 * Vorher stand hier eine feste kleinste Spaltenbreite und `auto-fill`. Das
 * ist fuer sechzehn Bundeslaender richtig - sie fuellen die Breite in zwei
 * Reihen - und fuer die sechs Beispielaufgaben einer Rechenebene falsch,
 * gleich doppelt: `auto-fill` legt acht Spuren an, sechs davon werden
 * belegt, und die Reihe stand LINKS mit einem Loch von vierhundert Punkten
 * rechts. Darueber und darunter noch einmal je ein Drittel des Bandes leer.
 * Es sah nicht nach Auswahl aus, sondern nach vergessenem Inhalt.
 *
 * Jetzt kommen beide Zahlen aus der Zahl der Karten:
 *   `--spalten`  setzt der Bildschirm, abgeleitet aus `stuecke.length`
 *                (zwei Reihen, hoechstens acht nebeneinander)
 *   die Hoehe    teilt sich das Gitter selbst: `1fr` je Reihe, und das
 *                Gitter nimmt sich den Rest des Bandes
 *
 * `max(88px, …)` ist die Notbremse fuer schmale Fenster: passen die
 * gewuenschten Spalten nicht, legt `auto-fit` weniger an, statt
 * ueberzulaufen. Was am Ende wirklich passt, sagt `passt`, nicht diese
 * Rechnung. */
.rollen.vorlauf .kleber{
  grid-template-columns:repeat(auto-fit,minmax(max(88px,
    calc(100% / var(--spalten,8) - var(--r2))),1fr));
  /* `minmax(min-content,1fr)` und nicht `1fr`.
     Die Spaltenzahl ist ein WUNSCH - auf einem schmalen Geraet legt
     `auto-fit` weniger an, und dann gibt es mehr Reihen als `--reihen`
     sagt. Mit nacktem `1fr` teilen sich diese Reihen trotzdem die Hoehe
     fuer zwei: auf dem iPhone SE quer standen die dreizehn
     Hauptstadtkarten in drei gequetschten Reihen, und der Name lag zwei
     Punkte ausserhalb seiner Karte - `passt` hat es gemeldet. Mit
     `min-content` als Untergrenze wird eine Reihe nie kleiner als ihr
     Inhalt; uebrige Hoehe teilen sie sich weiterhin. */
  grid-auto-rows:minmax(min-content,1fr);justify-content:center;
  gap:var(--r2);width:100%;flex:1 1 auto;min-height:0;
  max-width:min(900px, calc(var(--spalten,8) * var(--kleber-breit)));
  max-height:calc(var(--reihen,2) * var(--kleber-hoch)
                + (var(--reihen,2) - 1) * var(--r2))}
/* Mehr als acht in einer Reihe: dann muss das Mindestmass kleiner werden.
 *
 * Die 88 Punkte oben sind fuer sechzehn Bundeslaender gemessen - acht in
 * einer Reihe. Beim Abc sind es sechsundzwanzig Karten; sie SOLLEN in drei
 * Reihen zu neun stehen, aber `auto-fit` legte weiter nur sieben Spalten
 * an, weil 88 Punkte nicht neunmal in die Breite passen. Ergebnis waren
 * wieder vier Reihen, und die letzte lag im Streifen des iPhone.
 * Gemessen auf 844 x 390 MIT Leiste: nutzbar bleiben 756 Punkte, neun
 * Karten brauchen also hoechstens 76. Die 72 sind die naechste runde Zahl
 * darunter - und ein Wort wie „Xylofon" traegt sie noch. */
/* Die Untergrenze darf den WUNSCH nicht aufheben (S3).
 *
 * Hier standen 72px. Gemessen auf dem Zielgeraet: das Gitter ist dort rund
 * 644 Punkte breit, `calc(100% / 9 - 4)` ergibt 68 - und `max(72px, 68px)`
 * nimmt die 72. Neun Spalten zu 72 brauchen aber 680 Punkte. `auto-fit`
 * legte deshalb ACHT an, die 26 Karten fielen in VIER Reihen statt drei,
 * und jede Karte war 77 x 42 statt 88 x 62 - unter der 44-Punkt-Grenze,
 * ausgerechnet bei den Karten, die Fiona antippt, um „A wie Affe" zu
 * hoeren.
 *
 * Die Untergrenze ist ein Notnagel fuer sehr schmale Geraete, kein
 * Sollwert. Sie gehoert deshalb UNTER den gerechneten Wert, sonst
 * ueberstimmt der Notnagel die Rechnung. 56 Punkte greifen erst unterhalb
 * von rund 540 Punkten Gitterbreite - dort ist ohnehin nichts mehr in
 * neun Spalten unterzubringen.
 *
 * Das Muster ist dasselbe wie bei Regel 2: eine absolute Grenze neben
 * einer gerechneten macht die Rechnung still bedeutungslos. Und es fiel
 * nicht auf, weil `passt` zu kleine Flaechen nur als HINWEIS fuehrte. */
.rollen.vorlauf .kleber.viel{
  grid-template-columns:repeat(auto-fit,minmax(max(var(--kleber-eng-min),
    calc(100% / var(--spalten,9) - var(--r2))),1fr));
  max-width:min(900px, calc(var(--spalten,9) * var(--kleber-breit-eng)))}
/* Der Umriss nimmt sich den Platz, der uebrig ist.
 *
 * Die Zeilenhoehe des Gitters richtet sich nach der HOECHSTEN Karte -
 * „Mecklenburg-Vorpommern" braucht zwei Zeilen, also sind alle so hoch.
 * Bei fester Bildhoehe stand unter „Sachsen" ein Drittel leere Flaeche,
 * und der Umriss war oben ein Fleck. Jetzt waechst er in den Rest hinein,
 * und der Inhalt sitzt mittig statt oben. */
/* Mittig, aber mit FESTER Bildhoehe.
 *
 * Die Zeilenhoehe des Gitters richtet sich nach der hoechsten Karte -
 * „Mecklenburg-Vorpommern" braucht zwei Zeilen, also sind alle so hoch,
 * und unter „Sachsen" stand ein Drittel leere Flaeche.
 *
 * Der Versuch, den Umriss mit `flex:1` in diesen Rest wachsen zu lassen,
 * war der falsche Schluss: dann wachsen die KARTEN, und die zweite Reihe
 * fiel unten heraus. Das Loch war nie zu wenig Bild, sondern schlecht
 * verteilter Platz - und dagegen hilft Zentrieren, nicht Wachsen. */
/* Die Karte fuellt ihre Zeile, der Umriss fuellt die Karte.
 *
 * `min-height:0` an beiden: ohne das ist ein Flex-Kind mindestens so hoch
 * wie sein Inhalt, und die zweite Reihe faellt unten heraus - genau der
 * Fehlschlag, an dem der erste Versuch mit `flex:1` gescheitert ist. Der
 * Unterschied ist, dass die Hoehe jetzt vom GITTER kommt (`1fr` je Reihe)
 * und nicht vom Inhalt: sie kann das Band nicht ueberschreiten. */
/* `min-height:0`, aber KEIN `overflow:hidden`.
   Der Umriss darf mit der Zeile wachsen, dafuer ist `min-height:0` da.
   Beschnitten werden darf hier aber nichts: „Sachsen-Anhalt" ist zwei
   Punkte breiter als seine Karte und stand mit `overflow:hidden` als
   „Sachsen-Anhal" da - auf einem Bildschirm, der genau diese Namen
   beibringen soll. Der Name darf ueber den Rand ragen; abgeschnitten
   lernt ihn niemand. */
.rollen.vorlauf .aufkleber{padding:var(--r1);justify-content:center;
  min-height:0}
.rollen.vorlauf .aufkleber svg{flex:1 1 0;min-height:22px;height:auto}
.rollen.vorlauf .aufkleber .rechenkleber{font-size:var(--s1);flex:1 1 0;min-height:0}
/* Der Name wird hier UMGEBROCHEN, nicht abgeschnitten.
   Im Forscherbuch sind drei Punkte in Ordnung: dort steht, was man schon
   kennt. Hier soll das Kind den Namen LERNEN, und „Sachsen…" neben einem
   echten „Sachsen" ist schlimmer als kein Name. */
.rollen.vorlauf .aufkleber span{white-space:normal;overflow:visible;
  text-overflow:clip;hyphens:auto;overflow-wrap:break-word;line-height:1.1}
/* `break-word` und nicht `anywhere`.
   `anywhere` trennt, sobald es eng wird, und schrieb „Brandenbur / g" -
   ein einzelner Buchstabe auf einer Zeile. Auf einem Bildschirm, der
   Namen BEIBRINGEN soll, ist das schlimmer als eng. `break-word` trennt
   erst, wenn das Wort allein nicht auf eine Zeile passt, und nimmt
   vorher jede Fuge - „Mecklenburg-" vor „Vorpommern".
   Damit diese Fuge ueberhaupt in die Karte passt, ist die zweite Zeile
   kleiner und die Karte im Querformat etwas breiter. */
.rollen.vorlauf .aufkleber .dazu{font-size:calc(var(--s-klein) * 0.86)}
/* Das Bundesland unter der Hauptstadt: die ZUORDNUNG ist der Lernstoff
   dieser Ebene, nicht der Stadtname allein. */
.aufkleber .dazu{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);text-align:center;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.vorlauffuss{padding:var(--r3) var(--r4) var(--r4)}
/* Die zwei kleinen Knoepfe unter einer Kachel. Nebeneinander, damit sie
   die naechste Reihe nicht nach unten schieben. */
.kachelknoepfe{display:flex;gap:var(--r2);justify-content:center;flex-wrap:wrap}
/* Leer heisst weg. „anschauen" sitzt seit P16 als Auge IN der Kachel;
   uebrig bleiben „von vorne" und „Test", und die gibt es meistens nicht.
   Eine leere Zeile kostete auf dem kurzen Querformat 26 Punkte je Reihe. */
.kachelknoepfe:empty{display:none}
/* Das Auge in der Ecke der Kachel: volle 44 Punkte, ohne der Kachel viel
   zu nehmen (die misst 229 x 56). Es liegt DARUEBER, nicht darin - ein
   Knopf im Knopf waere kein gueltiges Markup. */
.kachelpaar{position:relative}
.kachelpaar .schau{position:absolute;top:var(--r0);right:var(--r0);z-index:2}
.sterne{display:flex;gap:var(--r1)}
.fortschritt{font-family:var(--f-ui);font-size:var(--s0);font-weight:600;color:var(--tinte-2);
  font-variant-numeric:tabular-nums}

/* `safe center` statt `center`, aus demselben Grund wie bei .seite: bei
   Ueberlauf schiebt zentrierter Inhalt nach OBEN UND UNTEN gleichzeitig
   hinaus. Auf dem iPhone hochkant lag die Ueberschrift deshalb ueber
   "Zurueck" und "Eltern" - beide sichtbar, beide nicht zu treffen. Die
   Regel stand seit v109 bei .seite und war hier nie nachgezogen: was
   zweimal dasteht, veraltet einmal. */
.mitte{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;
  gap:var(--r4);padding:var(--r4);min-height:0}
.titel{font-family:var(--f-ui);font-size:var(--s3);font-weight:800;letter-spacing:-.02em;text-align:center}
.unter{font-family:var(--f-ui);font-size:var(--s0);color:var(--tinte-2);text-align:center;max-width:34ch}
/* Der Baustempel ist kein Erklaertext. Er trug bis R2 die Klasse
   `.unter` und stand damit GROESSER da als „6 Jahre · sprechen und
   ziehen" - auf dem ersten Bildschirm, den die Kinder sehen. */
.bauzeile{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte-3);
  text-align:center;margin-top:var(--r6)}

/* Raster statt umbrechender Reihe. Als Reihe stapelten sich die fuenf
   Ebenen auf dem iPhone hochkant untereinander - 734 Punkte in einem
   Kasten von 724, die letzte Ebene war nicht erreichbar. `auto-fit` legt
   so viele Spalten an, wie hineinpassen: zwei auf dem Telefon hochkant,
   fuenf auf dem Telefon quer. */
/* Die Untergrenze der Spalte ist die BREITE DES LAENGSTEN NAMENS, nicht
   eine runde Zahl. Bei 140 Punkten passten fuenf Ebenen nebeneinander -
   und "Bundeslaender" brach als "Bundeslaend/e/r" um, mit einem einzelnen
   r in der zweiten Zeile. Bei 240 waehlt das Raster lieber drei Spalten
   und zwei Reihen; dann steht jeder Name auf einer Zeile.
   `auto-fit` rechnet das je Bildschirm selbst aus - auf dem Telefon
   hochkant wird daraus eine Spalte. */
.wahl{display:grid;gap:var(--r4);justify-content:center;width:100%;max-width:1100px;
  grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
/* Kurze Namen brauchen keine 240 Punkte. Die drei Stadtstaaten heissen
   "Berlin", "Hamburg", "Bremen" - mit dem grossen Mass rutschten sie in
   zwei Reihen und schoben den "Verstanden"-Knopf aus dem Bild. Ein Mass
   fuer alle waere hier das Bequeme, nicht das Richtige. */
.wahl.eng{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
/* ---- Die Kachelsprache (R2, Fassung „B · Bild" auf Weiss) -------------
   Auf weissem Grund traegt nicht mehr die Flaeche, sondern der RAND: 26 %
   Fuellung aus dem eigenen Ton, 52 % Rand daraus. Und jede Kachel zeigt
   IHREN Umriss als Wasserzeichen - ein Kind, das noch nicht liest,
   erkennt Afrika am Bild und nicht am Wort.
   Der Umriss sitzt rechts und wird nach links ausgeblendet; ohne diese
   Maske lief er im Entwurf mitten durch das Wort „Bundeslaender". */
.kachel.bunt,.kachel.welt,.kachel.wer{
  background:color-mix(in oklab, var(--ton) 26%, var(--papier));
  border:var(--strich) solid color-mix(in oklab, var(--ton) 52%, var(--papier))}
/* Das Wasserzeichen liegt GANZ in der Kachel. Bei 150 % Hoehe lief es
   oben und unten heraus: Afrika war ein Fleck, Deutschland ein Schmier -
   erkennbar war keins von beiden. Die Hoehe steht hier und nur hier, je
   Kachelart einmal; am Aufruf steht keine Zahl mehr. */
.kachel .silhouette{position:absolute;right:0;top:50%;translate:0 -50%;
  height:86%;max-width:52%;opacity:.34;pointer-events:none;color:var(--ton)}
.kachel.welt .silhouette{height:80%;max-width:76%}
.kachel .silhouette path{fill:currentColor}
/* Die Rechenzeichen werden gezogen, nicht gefuellt. */
.kachel .silhouette.gezeichnet path{fill:none}
.kachel .silhouette.gezeichnet{opacity:.26;max-width:44%}
.kachel.welt .silhouette.gezeichnet{max-width:56%}
.kachel.bunt,.kachel.welt,.kachel.wer{position:relative;overflow:hidden}
/* Der Inhalt liegt UEBER dem Wasserzeichen — aber das Wasserzeichen ist
   selbst ein Kind und darf nicht mitgenommen werden. Ohne `:not()` hat
   diese Zeile es aus der absoluten Lage geholt (hoehere Spezifitaet als
   `.kachel .silhouette`), es wurde zum Flex-Element in seiner
   Eigengroesse, und die Kacheln wuchsen auf das Vierfache. */
.kachel.bunt>*:not(.silhouette),.kachel.welt>*:not(.silhouette),
.kachel.wer>*:not(.silhouette,.streu){position:relative}
/* ---- Der Streu auf den Profilkacheln (G12) ---------------------------
   `.streu` muss in `:not()` stehen, genau wie `.silhouette` darueber -
   diese Zeile hat drei Klassen und schlaegt `.kachel .streu` mit zweien.
   Anders als beim Wasserzeichen waechst die Kachel dann NICHT: die
   Motive liegen selbst absolut, also faellt der Streukasten auf 0 x 0
   zusammen und nimmt sie mit. Gemessen: die grosse Muschel sass 24
   Punkte ueber dem oberen Rand der Kachel.

   Die Deckung: 0,58. Bei 0,42 war der Streu blass - Leuchtgelb leuchtete
   nicht mehr, und danach war ausdruecklich gefragt.

   Hier stand: „und kein Tor sieht das". Falsch. `lesbarkeit` sucht sehr
   wohl nach absolut liegenden GESCHWISTERN hinter dem Text - es tut das
   seit R2 wegen des Wasserzeichens. Es hat den Streu gefunden und sechs
   Texte rot gemeldet; sein Modell passte nur nicht (siehe dort). Der
   Kontrast ist jetzt gemessen und gruen, nicht behauptet. */
.kachel .streu{position:absolute;inset:0;pointer-events:none;opacity:.58;
  overflow:hidden;border-radius:inherit}
.kachel .streu i{position:absolute;line-height:0;display:block;
  transform:translate(-50%,-50%) rotate(var(--dreh,0deg))}
.kachel .streu i>svg{width:100%;height:100%;display:block;overflow:visible}
.kachel .streu .k{width:26px;height:26px}
.kachel .streu .m{width:38px;height:38px}
.kachel .streu .g{width:78px;height:78px}
/* Der Verlauf fuer die Augen wird abgelegt, nicht gezeigt. `display:none`
   ginge nicht: ein Verlauf in einem ausgeblendeten SVG wird in Safari
   nicht aufgeloest, und die Augen waeren schwarz. */
.streu-defs{position:absolute;width:0;height:0}
/* Auf dem Telefon quer ist die Kachel rund 190 x 125 Punkte gross. Die
   grosse Muschel mit 78 Punkten waere dort mehr als die halbe Hoehe -
   sie ueberdeckte den Namen, statt hinter ihm zu liegen. */
@media (max-height:440px){
  .kachel .streu .k{width:21px;height:21px}
  .kachel .streu .m{width:29px;height:29px}
  .kachel .streu .g{width:58px;height:58px}
}
/* Die Fachwelten (D4). Zwei grosse Karten statt neun Kacheln: das Kind
   waehlt erst das Fach. Sie duerfen breiter sein als eine Ebenenkachel -
   es sind zwei, und sie sollen unverwechselbar sein. */
.wahl.weltwahl{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));
  max-width:760px}
/* Seit der dritten Welt (N2a) sind es bei Fiona DREI Karten, bei Lea und
   den Eltern zwei. Mit 260 Punkten Mindestbreite passten drei nicht mehr
   nebeneinander: die dritte rutschte in eine zweite Reihe und stand halb
   unter dem Bildrand - gesehen auf der Aufnahme, nicht gemessen.
   Ab drei Karten wird die Mindestbreite deshalb kleiner und die Kachel
   flacher. `:has()` statt eines Merkmals im Markup: die Zahl der Karten
   ist eine Eigenschaft dieses Bildschirms, keine Auskunft, die das
   Programm mitschicken muesste. */
.wahl.weltwahl:has(> :nth-child(3)){
  grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));max-width:1000px}
.wahl.weltwahl:has(> :nth-child(3)) .kachel.welt{min-height:180px}
/* Eine Welt ist keine Zeile.
   Der erste Entwurf gab den beiden Karten dieselbe Hoehe wie einer
   Ebenenkachel - auf dem Zielgeraet standen dann zwei breite Balken unter
   einer halbleeren Flaeche. `passt` war gruen; gesehen hat es erst der
   Blick auf die Aufnahme (Regel 4). Sie bekommen deshalb eine Mindesthoehe
   und ein grosses Bild: der Umriss ist das einzige, was ein Kind, das
   nicht liest, auf diesem Bildschirm unterscheiden kann. Das kleine
   Eckzeichen stand daneben und sagte dasselbe noch einmal, nur kleiner -
   es ist mit R2 weggefallen. */
.kachel.welt{gap:var(--r2);align-items:flex-start;justify-content:flex-end;
  min-height:210px}
.kachel.welt .name{font-size:var(--s3)}
/* `min-width:0` ist hier kein Schoenheitsfehler, sondern noetig: ein
   Rasterfeld ist von sich aus mindestens so breit wie sein laengstes Wort,
   und "Landeshauptstaedte" sprengte damit die Spalte - auf vier von sechs
   Groessen stand die Kachel bis zu 36 Punkte ausserhalb des Fensters.
   Die Untergrenze kommt jetzt von der Spalte (minmax), nicht vom Wort;
   `hyphens:auto` trennt es sauber, statt es abzuschneiden.
   `max-width` haelt die Kacheln auf grossen Schirmen beisammen - ohne das
   werden aus zwei Profilen zwei 550 Punkte breite Balken. */
.kachel{background:var(--papier);border:var(--strich) solid var(--knopf-rand);
  border-radius:var(--rund-flaeche);
  box-shadow:0 var(--kante) 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  padding:var(--r6) var(--r8);
  min-width:0;width:100%;max-width:280px;justify-self:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:var(--r2);
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard),
    border-color var(--d-tipp) var(--k-standard)}
.kachel:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.kachel:hover{border-color:var(--primaer-rand);
  box-shadow:0 var(--kante) 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht),0 0 0 var(--ring) var(--akzent-h)}}
/* Ohne `min-width:0` ist ein Flex-Kind mindestens so breit wie sein
   laengstes Wort - "Landeshauptstaedte" stand dann quer ueber den Rand
   der eigenen Kachel hinaus. Die Kachel selbst sass richtig, ihr Inhalt
   nicht: das Tor `passt` mass Kaesten und hat es durchgelassen. Es misst
   jetzt auch, ob der Text in seinen Knopf passt. */
.kachel>*{min-width:0;max-width:100%}
.kachel .name{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;
  color:var(--auf-flaeche);hyphens:auto;overflow-wrap:break-word;text-align:center;
  line-height:1.15}
.kachel .rolle{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte-2)}
/* Auf einer Kachel MIT Streu ist der Grund nicht mehr ruhig, und die
   kleine Zeile stand mit 4,46:1 knapp unter der Grenze - gemessen, nicht
   geschaetzt. Repariert wird die Ursache, nicht das Symptom: nicht der
   Streu wird blasser (die Leuchtfarben waren ausdruecklich gewuenscht),
   sondern der Text auf dem unruhigen Grund dunkler. `:has()` fragt die
   Kachel selbst - das Programm muss nichts mitschicken. */
.kachel:has(.streu) .rolle{color:var(--tinte)}
/* Statt "0 von 4": drei Sterne und die Zahl der Aufkleber.
   Fiona liest keine Zahlen - aber sie sieht, ob ein Stern voll ist. */
.kachel .kachelfuss{display:flex;flex-direction:column;align-items:stretch;
  gap:var(--r1);width:100%}
.kachel .stand{display:flex;align-items:center;gap:var(--r3);min-height:22px}
.klebermarke{display:inline-flex;align-items:center;gap:var(--r1);font-family:var(--f-ui);
  font-size:var(--s-klein);font-weight:700;color:var(--tinte-2)}
/* Der leere Aufkleber muss noch zu SEHEN sein - mit --stern-aus war er auf
   der Kachel praktisch unsichtbar, und damit stand da eine nackte Null. */
/* Auf einer Kachel steht die Zahl auf dem Wasserzeichen, nicht auf der
   nackten Fuellung - `--tinte-2` reichte dort nicht mehr. */
.kachel .klebermarke{color:var(--tinte)}
.klebermarke svg{stroke:var(--tinte-3);fill:none}
.klebermarke:not([data-leer]) svg{stroke:var(--tinte);
  fill:color-mix(in oklab, var(--stern-an) 80%, var(--papier))}
/* Die Null steht in --tinte-2 wie jede andere Zahl auch. Mit --tinte-3
   kam sie auf 3,8:1 gegen die bunten Kacheln - das Tor `lesbarkeit` hat
   sie sechzehnmal gemeldet, in Tag und Abend. Der Unterschied zwischen
   „schon welche" und „noch keine" steckt im Zeichen, nicht in der
   Lesbarkeit der Zahl. */
/* Jede Ebene traegt ihre eigene Farbe. Acht weisse Karten nebeneinander
   sehen aus wie eine Tabelle; acht farbige sehen aus wie ein Spiel.
   Der Ton kommt als `--ton` aus dem Markup und wird hier nur GEMISCHT -
   damit steht kein Farbwert ausserhalb von marken.css.

   Gemischt wird in **oklab**, nicht in oklch. In oklch hat Weiss den
   Farbton 0 (Rot), und der wird mitgemischt: aus 26 % Gruen in Weiss wurde
   ein Pfirsichton. Alle acht Kacheln sahen rosa aus, waehrend die
   Ueberzeile daneben ihre richtige Farbe trug. oklab hat keinen
   Farbtonkanal und mischt deshalb das, was man meint. */
.kachel.bunt{padding:var(--r4) var(--r6);
  background:color-mix(in oklab, var(--ton) 26%, var(--papier));
  border-color:color-mix(in oklab, var(--ton) 55%, var(--papier));
  box-shadow:0 var(--kante) 0 color-mix(in oklab, var(--ton) 62%, var(--tinte-3)),
             inset 0 var(--strich) 0 var(--knopf-licht);
  align-items:flex-start;text-align:left;gap:var(--r1)}
.kachel.bunt:active{box-shadow:0 0 0 color-mix(in oklab, var(--ton) 62%, var(--tinte-3)),
             inset 0 var(--strich) 0 var(--knopf-licht)}
.kachel .ueber{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in oklab, var(--ton) 28%, var(--tinte))}
.kachel.bunt .name{text-align:left;line-height:1.1;font-size:var(--s1)}
.kachel.bunt .balken{background:color-mix(in oklab, var(--ton) 45%, var(--papier))}
.kachel.bunt .balken i{background:color-mix(in oklab, var(--ton) 75%, var(--tinte))}
/* ---- Abzeichen (D2) --------------------------------------------------
   Ein Abzeichen ist ein SATZ mit einem Bild davor, keine Kachel mit einer
   Zahl. Deshalb liegt der Text neben dem Zeichen und nicht darunter: er
   ist die Belohnung, das Bild ist nur die Marke dafuer.
   Die Mindestbreite ist grosszuegig - „Du kennst alle Nachbarn von
   Deutschland" braucht Platz, und zwei Zeilen sind besser als ein
   Abschneiden. */
/* Flex statt Raster: bei EINEM Abzeichen zog `auto-fit` den einen Kasten
   ueber die ganze Breite - ein Satz von vier Woertern in einem Band von
   1600 Punkten. Gesehen auf der Aufnahme, nicht gemessen. */
.abzeichen{display:flex;flex-wrap:wrap;gap:var(--r3);width:100%}
.abz{flex:1 1 300px;max-width:520px}
.abz{display:flex;align-items:center;gap:var(--r3);text-align:left;
  padding:var(--r3);border-radius:var(--rund-karte);min-height:56px;
  background:var(--papier);border:var(--strich) solid var(--linie);
  font-family:var(--f-lesen);font-size:var(--s0);color:var(--tinte);
  cursor:pointer}
.abz svg{flex:0 0 auto}
.abz .was{line-height:1.15}
/* Das offene traegt die Farbe des Hinweises, nicht die des Fehlers: es ist
   der naechste Schritt, keine Mahnung. */
.abz.offen{background:var(--nochmal-h);border-color:var(--achtung);color:var(--tinte-2)}
.abz.offen small{display:block;font-family:var(--f-ui);font-size:var(--s-klein);
  color:var(--tinte-2)}
.abz.da{background:var(--gut-h);border-color:var(--gut)}
/* Auf dem Endbildschirm, wenn eines DAZUGEKOMMEN ist. Eine Zeile, mittig,
   in derselben Sprache wie der Rest des Bildschirms. */
.abzneu{display:flex;align-items:center;justify-content:center;gap:var(--r3);
  margin:var(--r3) 0;padding:var(--r2) var(--r4);border-radius:var(--rund-voll);
  background:var(--gut-h);border:var(--strich) solid var(--gut);
  font-family:var(--f-lesen);font-size:var(--s0);color:var(--tinte);
  max-width:100%}
/* Auf dem Telefon quer ist der Bildschirm 390 Punkte hoch, und das
   Forscherbuch war vorher randvoll. Die Abzeichenzeile hat die untere
   Aufkleberreihe 19 Punkte ueber den Rand geschoben - `passt` hat es
   gemeldet, nicht das Auge.
   Zurueckgeholt wird das an drei Stellen: kleineres Zeichen (28 statt
   34), knappere Polsterung, und die Mindesthoehe geht auf 44 - das ist
   die Fingergrenze und damit die Untergrenze, nicht eine Zahl, die man
   weiter druecken darf. */
@media (max-height:440px){
  .abzeichen{gap:var(--r2)}
  .abz{flex:1 1 260px;padding:var(--r1) var(--r2);gap:var(--r2);
    font-size:var(--s-klein);min-height:44px}
  .abz svg{width:28px;height:28px}
  /* Die Zahl rutscht in die ZEILE, statt eine eigene zu bekommen. Das
     spart die eine Zeile, die auf dem kuerzesten Bildschirm (mit Leiste
     sind es 340 Punkte) noch fehlte - gemessen: 5 Punkte, eine Zeile sind
     15. Auf dem grossen Bildschirm bleibt sie darunter, dort ist Platz. */
  .abz.offen small{display:inline;font-size:calc(var(--s-klein) * 0.9)}
  .abzneu{font-size:var(--s-klein);margin:var(--r1) 0;padding:var(--r1) var(--r3)}
  .abzneu svg{width:30px;height:30px}
  /* Und die Ueberschrift faellt weg. Auf 390 Punkten Hoehe ist sie der
     teuerste Posten des Blocks (30 Punkte samt Abstand) und der
     entbehrlichste: die Abzeichen sagen selbst, was sie sind - „Du kennst
     die drei Stadtstaaten" braucht kein Wort darueber. Fiona liest sie
     ohnehin nicht. */
  .abzkopf{display:none}
}
.kachel .umriss{width:96px;height:96px}
.kachel .kreis{width:64px;height:64px;border-radius:var(--rund-voll);display:flex;
  align-items:center;justify-content:center;font-family:var(--f-lesen);font-size:var(--s2);
  font-weight:700;color:var(--auf-flaeche)}

/* --- Spielfeld --- */
.feld{flex:1;display:flex;gap:var(--r4);padding:0 var(--r4) var(--r4);min-height:0;
  align-items:center;justify-content:center}
@media (orientation:portrait){.feld{flex-direction:column}}
/* Die Karte nimmt genau den Platz, den sie BRAUCHT - nicht den, den ein
   `flex:1` ihr zuteilt.
   Gemessen vorher: der Kasten war auf dem iPhone quer 420 Punkte breit,
   gezeichnet wurden 213. Deutschland ist hochformatig (Verhaeltnis 0,74),
   die Weltkarte querformatig (1,67) - ein Kasten fuer beide verschenkt
   immer bei einer von beiden. `--karte-ar` kommt aus der viewBox der
   gerade gezeigten Karte, wird also je Ebene richtig gesetzt.
   Der frei werdende Platz geht an die Antworten und an den Rand, statt
   als Loch neben der Karte zu stehen. */
/* Breite und Hoehe setzt `kartenGroesse()` in spiel.js - siehe dort, warum
   es in CSS nicht geht. Hier stehen nur die Grenzen, damit vor der ersten
   Messung nichts ueberlaeuft. */
.karte{flex:0 0 auto;min-width:0;min-height:0;max-width:100%;max-height:100%;
  aspect-ratio:var(--karte-ar,1);
  display:flex;align-items:center;justify-content:center;touch-action:none}
.karte svg{width:100%;height:100%;overflow:visible}
/* NUR die Gebiete und ihre Trefferkreise nehmen den Finger an. Alles
   andere in der Karte ist Schmuck.
   Ohne diese Regel lag der pulsierende Ring um das gesuchte Gebiet
   (`fill:none`, aber ein bis zu 9 Punkte breiter Strich) UEBER der Flaeche
   und fing den Zug ab: `elementFromPoint` lieferte `path.zielpuls`, das ist
   weder ein Gebiet noch ein Kreis, und `bewerte()` lief gar nicht erst an.
   Die richtige Antwort wurde nicht als falsch gewertet - es passierte
   ueberhaupt nichts. Kein Protokolleintrag, kein Hinweis, keine Bewegung.
   Ausgerechnet die Hervorhebung, die zeigen soll, wohin man ziehen muss,
   hat das Ziel bewacht. */
.karte svg *{pointer-events:none}
.karte svg path.geb,
.karte svg #treffer circle{pointer-events:all}
.karte path.geb{transition:fill var(--d-zustand) var(--k-standard)}
.karte path.ziel{fill:var(--ziel)}
/* Alles ausser dem gesuchten Gebiet tritt zurueck. Bei sieben gleich hellen
   Pastellflaechen ist sonst nicht zu erkennen, welche gemeint ist. */
/* Die Nachbarn treten zurueck - aber nur so weit, dass die Karte noch
   nach Karte aussieht. Bei 0,42 Deckkraft und 0,35 Saettigung war die
   ganze neue Farbigkeit wieder weg; das Ziel traegt seine Auffaelligkeit
   inzwischen selbst (kraeftiges Blau, dunkler Rand, Puls, Zeiger). */
.karte path.geb.ruhig{opacity:.78;filter:saturate(.72)}
/* Was schon sass, bleibt in voller Farbe stehen. Die Karte fuellt sich,
   waehrend gespielt wird - das ist der Fortschritt, den ein Kind sieht,
   ohne eine Zahl lesen zu muessen. */
.karte path.geb.gesessen{opacity:1;filter:none}
/* Was gerade unter dem Finger liegt, leuchtet auf.
   Die Nachsicht beim Ziehen (60 Bildpunkte Umkreis) darf keine Zauberei
   sein: das Kind muss VOR dem Loslassen sehen, was gelten wird. Ohne diese
   Anzeige waere die Nachsicht nur ein Wuerfel, den niemand sieht. Der
   Rahmen liegt aussen an (`paint-order`), damit er die Flaeche nicht
   verkleinert, und er wird NICHT mitskaliert - sonst ist er auf der
   Weltkarte ein Haar und auf Bremen ein Balken. */
.karte path.geb.drueber{fill:var(--drueber);opacity:1;filter:none;
  stroke:var(--drueber-rand);stroke-width:var(--strich-stark);
  vector-effect:non-scaling-stroke;paint-order:stroke fill}
.karte .haken{pointer-events:none;animation:haken-auf var(--d-belohnung) var(--k-standard)}
/* Der Name am Ort. Erscheint erst NACH der richtigen Antwort - vorher waere
   er die Antwort. */
.karte #fahne{pointer-events:none;animation:fahne-auf var(--d-belohnung) var(--k-standard) both}
@keyframes fahne-auf{0%{opacity:0}40%{opacity:0}100%{opacity:1}}
.karte .fahnentext{font-family:var(--f-lesen);font-weight:700;fill:var(--papier)}
.karte .fahnenrand{fill:var(--tinte);stroke:var(--papier);
  stroke-width:var(--strich-stark);vector-effect:non-scaling-stroke;paint-order:stroke fill}
.karte .fahnenlinie{stroke:var(--tinte);stroke-width:var(--strich-kueste);
  vector-effect:non-scaling-stroke;stroke-linecap:round}
.karte .fahnenpunkt{fill:var(--tinte);stroke:var(--papier);
  stroke-width:var(--strich);vector-effect:non-scaling-stroke}
/* Die Nadel: ein Gebiet, das kleiner ist als eine Fingerkuppe, bekommt
   seine Trefferflaeche NEBEN der Karte, mit einem Faden dorthin. Das
   Konzept sagt es seit K3, Kapitel 5.4: „mindestens 44 x 44 Punkte, bei
   Bedarf mit einer duennen Leitlinie zum echten Gebiet." */
/* Faden, Fuss und Kopf sind BILD, nicht Bedienung: `pointer-events:none`.
   Ohne das schluckt der Faden genau den Tipp, fuer den er da ist - er
   beginnt am Anker, liegt dort ueber dem kleinen Trefferkreis, und ein
   Klick auf das Gebiet traf dann weder Kreis noch Flaeche. */
/* Duenn und halb durchsichtig, nicht so kraeftig wie eine Kueste: sieben
   Faeden treffen sich auf der Nordamerikakarte in Mittelamerika, und
   genau dort steht auch die gesuchte Flaeche. Mit 3 px in voller Deckung
   (der ersten Fassung) lag ueber der Landenge ein Gitter. */
.karte .nadelfaden{stroke:var(--tinte);stroke-width:var(--strich);
  vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.55;
  pointer-events:none}
.karte .nadelfuss{fill:var(--tinte);pointer-events:none}
.karte .nadelkopf{stroke:var(--tinte);stroke-width:var(--strich);
  vector-effect:non-scaling-stroke;pointer-events:none}
/* Der Faden des GESUCHTEN Gebiets: er fuehrt vom Zeiger zu der Flaeche,
   auf die man ablegt. Er traegt dieselbe Farbe wie der Zielrand und sagt
   damit nichts, was der nicht schon sagt. */
.karte .nadelfaden.nadelziel{stroke:var(--akzent);opacity:1;
  stroke-width:var(--strich-stark)}
.karte .nadelfuss.nadelziel{fill:var(--akzent)}
.karte .nadelkopf.nadelziel{stroke:var(--akzent);stroke-width:var(--strich-stark)}
@keyframes haken-auf{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
.karte path.treffer{fill:var(--treffer);opacity:1;filter:none}
.karte .zielrand{opacity:.9}
.karte .zielpuls{animation:pulsrand var(--d-puls) ease-in-out infinite}
@keyframes pulsrand{
  0%,100%{stroke-width:3;stroke-opacity:.95}
  50%    {stroke-width:9;stroke-opacity:.15}
}
.karte .zeiger{animation:huepfen var(--d-puls) ease-in-out infinite;pointer-events:none}
@keyframes huepfen{0%,100%{translate:0 0}50%{translate:0 -6px}}
.seite{flex:none;display:flex;flex-direction:column;gap:var(--r2);min-height:0;
  /* "safe center" statt "center": laeuft der Inhalt ueber, rutscht er sonst
     ueber die OBERE Kante hinaus - im Querformat lag das erste Etikett dann
     unter der Kopfleiste, und der Finger traf die Leiste statt das Etikett. */
  justify-content:center;justify-content:safe center}
@media (orientation:landscape){.seite{width:min(38vw,300px)}}
/* Im kurzen Querformat steht das Mikrofon NEBEN der Liste statt darunter.
   Es kostete 68 der 210 Punkte, die den Antworten ueberhaupt blieben -
   deshalb war die vierte abgeschnitten. Die Breite dafuer kommt aus der
   Karte, die dort 44 % ihrer Flaeche ungenutzt liess.

   Seit A4 sind es 38vw statt 46. Gemessen auf 844 x 390, Fionas
   Weltkarte:

       46vw / 392px   Karte 444 x 241
       42vw / 356px   Karte 478 x 259
       38vw / 320px   Karte 512 x 278   <- hier
       34vw / 286px   Karte 539 x 280

   Bei 38vw ist die Karte 278 hoch und damit an ihrer HOEHENgrenze
   angekommen - weitere Breite macht sie nicht mehr groesser, sie liesse
   nur wieder Luft an den Seiten. Genau deshalb steht hier 38 und nicht 34.

   Und deshalb ein BODEN von 307 Punkten. `min(38vw,320px)` allein hat
   `passt` sofort rot gemacht: auf dem iPhone SE quer (667 breit) sind
   38vw nur 253 Punkte, und „Mecklenburg-Vorpommern" stand dann 10 Punkte
   ueber seinen eigenen Knopf hinaus, „Suedamerika" zwei. 307 ist genau
   das, was die Spalte dort vorher hatte - das kleinste Geraet behaelt
   also seine Breite, und nur das groessere gibt etwas an die Karte ab.
   Nicht geschaetzt: 46vw von 667 sind 307.

   Was dieser Schritt NICHT tut: den Laenderkarten helfen. Nordamerika
   bleibt bei jeder Spaltenbreite 352 x 280, weil es schon an der Hoehe
   haengt - und deshalb bleiben dort auch die sieben Nadeln und der Faden
   von 154 Punkten. Die Vermutung, eine schmalere Spalte wuerde die Nadeln
   erledigen, hat die Messung widerlegt. */
@media (orientation:landscape) and (max-height:440px){
  .seite{width:clamp(307px,38vw,320px);flex-direction:row;align-items:stretch;gap:var(--r2)}
  .wahlliste{flex:1;min-width:0}
  .werkzeug{flex:none;flex-direction:column;justify-content:center;padding-top:0}
}
@media (orientation:portrait){.seite{width:100%;flex:0 0 auto;max-height:56vh;overflow:auto}
  /* Sonst wird aus "Berlin" ein 784 Punkte breiter Balken mit einem Wort
     in der Mitte. Gleich breite Antworten sind richtig - beliebig breite
     nicht. */
  .wahlliste{max-width:560px;width:100%;margin-inline:auto}}

.frage{font-family:var(--f-ui);font-size:var(--s1);font-weight:700;text-align:center;
  padding:0 var(--r4) var(--r2)}
.etikett{position:relative;font-family:var(--f-lesen);font-size:var(--s1);font-weight:700;
  color:var(--auf-flaeche);background:var(--primaer);
  border:var(--strich) solid var(--primaer-rand);border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);min-height:56px;display:flex;align-items:center;justify-content:center;
  text-align:center;hyphens:auto;overflow-wrap:break-word;
  box-shadow:0 var(--kante) 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  cursor:grab;touch-action:none;
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard),
             background var(--d-zustand) var(--k-standard),
             border-color var(--d-zustand) var(--k-standard),
             opacity var(--d-zustand) var(--k-standard)}
.etikett:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.etikett:hover{box-shadow:0 var(--kante) 0 var(--primaer-kante),
  inset 0 var(--strich) 0 var(--knopf-licht),0 0 0 var(--ring) var(--akzent-h)}}
/* Beim Ziehen haengt das Etikett am Finger: hoehere Kante, kein Uebergang. */
/* `pointer-events:none` ist hier die halbe Reparatur: das Etikett haengt
   am Finger und stand damit bei JEDEM Treffertest im Weg. Solange es
   anfassbar war, konnte waehrend des Zuges nichts unter dem Finger
   gefunden werden - also gab es auch nichts aufzuleuchten. */
/* Am Finger ist es ein SCHILD, keine Kachel: einzeilig, enger gesetzt,
   kleinere Schrift. Es haengt unter dem Finger, und darueber muss die
   Karte zu sehen bleiben - sonst zieht das Kind blind. */
.etikett.zieht{transform:none;box-shadow:0 var(--kante-hoch) 0 var(--primaer-kante),
  inset 0 var(--strich) 0 var(--knopf-licht);z-index:50;cursor:grabbing;
  transition:none;pointer-events:none;
  white-space:nowrap;font-size:var(--s0);padding:var(--r3) var(--r5);
  min-height:0;width:auto;justify-content:center}
.etikett.weg{visibility:hidden;pointer-events:none}
/* Falsch: das Etikett faehrt zurueck und WACKELT. Vorher passierte am
   Etikett gar nichts - es kam nur ein Satz darunter, und das Kind sah
   nicht, dass seine Antwort abgelehnt worden war. */
.etikett.falsch{background:var(--warn-h);border-color:var(--warn);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@keyframes wackeln{
  0%,100%{translate:0}
  15%{translate:-7px} 35%{translate:6px} 55%{translate:-4px} 75%{translate:2px}
}
@media (prefers-reduced-motion:reduce){.etikett.falsch{animation:none}}

/* --- Rechnen: die Aufgabe ohne Karte ---------------------------------
   Die Rechnung steht in der Kinderschrift und so gross, wie der Platz es
   hergibt - sie IST der Bildschirm, nicht seine Ueberschrift. Die vier
   Zahlen darunter tragen dieselbe Tiefe wie ein Antwort-Etikett auf der
   Karte: es ist derselbe Griff, nur ohne Ort. */
.rechenfeld{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:safe center;gap:var(--r6);padding:0 var(--r4) var(--r4);min-height:0}
.rechnung{font-family:var(--f-lesen);font-weight:700;font-size:var(--s5);
  line-height:1;color:var(--tinte);display:flex;align-items:center;gap:var(--r3);
  font-variant-numeric:tabular-nums}
.luecke{display:inline-flex;align-items:center;justify-content:center;
  min-width:1.4em;padding:0 var(--r2);border-radius:var(--rund-karte);
  border:var(--strich-stark) dashed var(--primaer-rand);color:var(--tinte-3)}
.luecke.gefuellt{border-style:solid;border-color:var(--gut);
  background:var(--gut-h);color:var(--tinte)}
.zahlen{display:flex;gap:var(--r4);flex-wrap:wrap;justify-content:center}
.zahl{font-family:var(--f-lesen);font-size:var(--s3);font-weight:700;
  color:var(--auf-flaeche);background:var(--primaer);
  border:var(--strich) solid var(--primaer-rand);border-radius:var(--rund-karte);
  min-width:88px;min-height:72px;padding:var(--r3) var(--r4);cursor:pointer;
  font-variant-numeric:tabular-nums;
  box-shadow:0 var(--kante) 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  transition:transform var(--d-tipp) var(--k-standard),
             box-shadow var(--d-tipp) var(--k-standard),
             background var(--d-zustand) var(--k-standard)}
.zahl:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
.zahl[disabled]{opacity:.45;cursor:default}
.zahl.stimmt{background:var(--gut-h);border-color:var(--gut);opacity:1}
.zahl.falsch{background:var(--warn-h);border-color:var(--warn);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@media (prefers-reduced-motion:reduce){.zahl.falsch{animation:none}}
/* Wer das Ergebnis SCHREIBT, braucht kein Feld über die ganze Zeile: die
   Antwort ist höchstens dreistellig. Ein breites Feld lädt zu einem Satz
   ein, und die Zahl steht dann verloren darin — deshalb hier `width:auto`
   gegen das `width:100%` des allgemeinen Eingabefelds. */
.tippfeld{display:flex;gap:var(--r4);align-items:stretch;justify-content:center;flex-wrap:wrap}
.tippfeld .eingabe{width:auto;min-width:150px;min-height:72px;font-size:var(--s3);
  font-variant-numeric:tabular-nums}
.tippfeld .knopf{min-height:72px}
/* Dasselbe Wackeln wie bei der falschen Zahl. Eine geschriebene Antwort,
   die nur mit einem Satz abgelehnt wird, sieht aus, als sei sie gar nicht
   angekommen. */
.eingabe.falsch{border-color:var(--warn);background:var(--warn-h);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@media (prefers-reduced-motion:reduce){.eingabe.falsch{animation:none}}
/* Der Regler im Elternbereich. Er ist erst dann einer, wenn man ihn mit
   dem Daumen trifft: 44 Punkte hoch, dieselbe Grenze wie bei den
   Trefferflächen auf der Karte. */
.reihe.regler{gap:var(--r4);align-items:center}
.reihe.regler input[type=range]{flex:1;min-width:160px;max-width:280px;height:44px;
  accent-color:var(--akzent);cursor:pointer}
/* Der Aufkleber einer Rechenaufgabe: die Aufgabe selbst, dort wo bei einer
   Karte der Umriss steht. Kein neues Bild, und wiedererkennbar. */
.rechenkleber{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
  font-family:var(--f-lesen);font-weight:700;font-size:var(--s1);
  color:var(--auf-flaeche);background:color-mix(in oklab, var(--ton) 34%, var(--papier));
  border-radius:var(--rund-klein);font-variant-numeric:tabular-nums}
.aufkleber:not(.da) .rechenkleber{background:var(--linie);color:var(--tinte-3)}
/* ---- Schreiben (N2a) --------------------------------------------------
   Die Schreibflaeche ist QUADRATISCH, und das ist keine Geschmacksfrage:
   der Kasten der Vorlage ist 100 x 100, und der Finger wird ueber
   `getBoundingClientRect` in ihn umgerechnet. Bei einem nicht
   quadratischen Feld muesste dort `preserveAspectRatio` nachgerechnet
   werden - und der Finger laege systematisch daneben, ohne dass man es
   dem Bild ansieht.
   `touch-action:none` ist ebenso Pflicht: sonst scrollt das Telefon die
   Seite, waehrend das Kind schreibt. */
.schreibraum{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--r2)}
.schreibfeld{flex:1;display:flex;align-items:center;justify-content:center;
  min-height:0;padding:0 var(--r4) var(--r2)}
/* Der Rahmen ist ein DIV, nicht das SVG.
   `aspect-ratio` auf einem SVG mit viewBox tut in Chromium nicht, was man
   denkt: gemessen kamen 820 x 180 Punkte heraus statt eines Quadrats - ein
   SVG ohne eigene Breite faellt auf 100 % zurueck, und das Verhaeltnis
   kommt nicht mehr zum Zug. Ein gewoehnlicher Kasten haelt es zuverlaessig,
   und das SVG fuellt ihn. */
/* Ein oder ZWEI Blaetter nebeneinander (N4): die Zahl 14 wird als 1 und 4
   geschrieben, jede Ziffer in ihr eigenes Feld. Damit ist „beide Ziffern,
   richtige Reihenfolge" ein Aufbau und keine Pruefung.
   Die Kaesten teilen sich die Breite und behalten ihr Quadrat; wird es
   eng, gibt die Hoehe nach - `max-height` statt `height`, sonst haelt das
   Verhaeltnis die Breite fest und zwei Kaesten laufen aus dem Bild. */
.blaetter{display:flex;height:100%;gap:var(--r3);justify-content:center;
  align-items:center;min-width:0;width:100%}
.feldkasten{aspect-ratio:1;max-height:100%;max-width:100%;flex:0 1 auto;min-width:0;
  height:100%;touch-action:none;
  background:var(--papier);border:var(--strich) solid var(--linie);
  border-radius:var(--rund-karte);overflow:hidden}
/* `.schreibblatt` und nicht `.feld`.
   Der erste Entwurf hiess `.feld` - und so heisst der Kartenbereich des
   Spielbildschirms auch. `.feld{display:block}` hat dessen `display:flex`
   ueberschrieben: die Antwortliste stand danach UNTER der Karte statt
   neben ihr und lief auf allen vier Querformaten aus dem Bild. Gefunden
   von `passt`, mit 59 Meldungen auf einmal - und keine davon nannte den
   Schreibschirm, weil der Schaden woanders lag. */
.schreibblatt{display:block;width:100%;height:100%;touch-action:none;
  cursor:crosshair;overscroll-behavior:none}
/* Ober- und Grundlinie wie im Schreibheft - sie sagen, wie hoch der
   Buchstabe wird, bevor der erste Strich da ist. */
.schreibblatt .linien line{stroke:var(--linie);stroke-width:.8;stroke-dasharray:2 3}
.vorlage path,.gemalt path,.zug{fill:none;stroke-width:9;
  stroke-linecap:round;stroke-linejoin:round}
.vorlage .spaeter{stroke:var(--linie);opacity:.55}
.vorlage .schon{stroke:var(--linie);opacity:.35}
.vorlage .dran{stroke:var(--linie-2)}
.gemalt path,.zug{stroke:var(--primaer-kante)}
/* Der Punkt, an dem der naechste Zug anfaengt. Ohne ihn faengt ein Kind
   unten an und bekommt gesagt, die Richtung stimme nicht - ohne je
   erfahren zu haben, welche gemeint war. */
.anfang{fill:var(--gut)}
/* `hidden` muss hidden BEDEUTEN.
   Gefunden beim Bau des Schreibschirms, aber aelter: die Regel des
   Browsers fuer `[hidden]` ist eine Vorgabe, und JEDE eigene Regel mit
   `display` schlaegt sie. `.zahlen{display:flex}` tat genau das - Lea
   bekam beim Rechnen die vier Antwortknoepfe UND das Tippfeld zu sehen,
   obwohl das Feld ordentlich `hidden` gesetzt war.
   Kein Tor konnte das sehen: `passt` misst Ueberlauf, der Rauchtest tippt
   ins Eingabefeld und kommt damit durch, und die einzige Aufnahme eines
   Rechenbildschirms ist Fionas - sie hat gar kein Tippfeld.
   Deshalb hier, einmal und mit Nachdruck, fuer alles. */
[hidden]{display:none!important}
/* Vormachen: jeder Zug wird gemalt, einer nach dem anderen. `pathLength`
   im Markup macht die Strichlaenge unabhaengig von der echten Laenge -
   sonst liefe der lange Zug eines S genauso schnell wie der Balken eines A.
   Dauer und Versatz kommen aus dem Programm (VORMACHEN_JE_ZUG), damit die
   Wartezeit danach und die Malzeit nicht getrennt veralten. */
.vorlage .malt{stroke:var(--primaer-kante);stroke-dasharray:100;stroke-dashoffset:100;
  animation-name:malen;animation-timing-function:var(--k-standard);
  animation-fill-mode:forwards}
@keyframes malen{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .vorlage .malt{animation-name:none;stroke-dashoffset:0}}
/* Der Buchstabe als Aufkleber und im Vorlauf - dieselben Zuege. */
.zeichenbild{display:block}
/* Der Elternvergleich (N1): wer in einer Zeile vorn liegt, wird markiert -
   sonst muesste man zwei Zahlen im Kopf vergleichen, und genau das soll
   die Tabelle einem abnehmen. Die Zeit steht klein darunter; sie
   entscheidet nichts und darf deshalb nicht gleich laut sein. */
#duell .fuehrt{font-weight:700;color:var(--gut)}
#duell .summe td{border-top:var(--strich-stark) solid var(--linie);font-weight:700}
#duell .dazu{display:block;font-family:var(--f-ui);font-size:var(--s-klein);
  font-weight:400;color:var(--tinte-3)}
/* Im kurzen Querformat steht das Werkzeug NEBEN dem Feld statt darunter -
   dieselbe Bewegung wie beim Mikrofon neben der Antwortliste. Gemessen:
   darunter blieben dem Feld 180 Punkte Hoehe, daneben sind es 270. */
@media (orientation:landscape) and (max-height:440px){
  /* Feld und Werkzeug stehen als PAAR in der Mitte, nicht das Feld links
     und die Knoepfe rechts am Rand. Mit `1fr` fuer die Feldspalte lagen
     zwischen beiden bis zu 200 Punkte Leere - der Bildschirm sah aus, als
     fehle etwas. Beide Spalten nehmen sich jetzt, was sie brauchen, und
     das Ganze wird zentriert. */
  .schreibraum{display:grid;grid-template-columns:auto auto;
    grid-template-rows:auto minmax(0,1fr);justify-content:center;
    column-gap:var(--r6);
    grid-template-areas:"frage frage" "feld werkzeug";align-items:center}
  .schreibraum .frage{grid-area:frage}
  /* Unten bleibt mehr Luft als die uebliche kleine: auf dem iPhone quer
     liegen dort Wischstreifen und sicherer Bereich, und ein Feld, das
     `touch-action:none` traegt, faengt genau die Geste ab, mit der man
     die App verlaesst. Gemessen: 9 Punkte Abstand waren zu wenig. */
  .schreibraum .schreibfeld{grid-area:feld;min-height:0;height:100%;
    padding-bottom:var(--r5)}
  .schreibraum .werkzeug{grid-area:werkzeug;flex-direction:column;
    justify-content:center;padding-top:0;padding-right:var(--r4)}
}
.wahlliste{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  gap:var(--r3);justify-content:center;justify-content:safe center;padding:var(--r1)}
/* „Noch einmal hoeren" - derselbe runde Knopf wie das Auge in der Kachel,
   aber in der Betonfarbe: er ist eine HILFE und keine Antwort, und er
   soll neben dem blauen Mikrofon nicht wie ein zweiter Weg aussehen. */
.werkzeug .nochhoeren{color:var(--akzent)}
.werkzeug{flex:none;display:flex;gap:var(--r3);align-items:center;justify-content:center;
  padding-top:var(--r2)}
/* Der leise Ausweg. Er soll erreichbar sein, aber nicht einladen: kein
   Fuellton, kein Rand, nur Text - und trotzdem 44 Punkte hoch, damit ein
   Daumen ihn trifft. */
/* Kachel und ihr „von vorne" gehoeren zusammen - das Raster sieht das Paar
   als EIN Feld, sonst rutscht der kleine Knopf in die naechste Spalte. */
.kachelpaar{display:flex;flex-direction:column;align-items:stretch;gap:var(--r1);min-width:0}
.kachelpaar .kachel{width:100%}
/* Die gewaehlte Stimme traegt denselben Rahmen wie ein aktiver Zustand
   sonst auch - kein neues Zeichen, nur der bekannte Ring. */
.stimmen{flex-wrap:wrap;gap:var(--r2)}
.knopf.gewaehlt{border-color:var(--akzent);
  box-shadow:0 0 0 var(--ring) var(--akzent-h),0 var(--kante-flach) 0 var(--linie-2)}
.leise.mini{min-height:32px;font-size:var(--s-klein);padding:var(--r1) var(--r2);
  align-self:center}
.leise{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);background:none;border:none;cursor:pointer;
  min-height:44px;padding:0 var(--r3);border-radius:var(--rund-voll);
  text-decoration:underline;text-underline-offset:3px;
  transition:color var(--d-tipp) var(--k-standard),background var(--d-tipp) var(--k-standard)}
.leise:active{color:var(--tinte);background:var(--akzent-h)}
@media (hover:hover){.leise:hover{color:var(--tinte)}}
.frage .richtigText{color:var(--gut)}
/* Das Lob traegt die Zeile, der Name die Sache. Ein Kind liest das erste
   Wort und weiss Bescheid, bevor es den Satz zu Ende gelesen hat. */
.frage .jubel{display:block;font-size:var(--s2);font-weight:800;line-height:1.1}
/* Der Aufkleber bekommt einen eigenen Augenblick - er ist das einzige,
   was ueber diese Aufgabe hinaus bleibt. */
.frage .neuerkleber{display:inline-block;margin-top:var(--r2);
  font-family:var(--f-lesen);font-size:var(--s0);font-weight:800;
  color:var(--auf-flaeche);background:var(--f2);
  border-radius:var(--rund-flaeche);padding:var(--r1) var(--r4);
  animation:kleber-auf var(--d-belohnung) var(--k-standard) both}
@keyframes kleber-auf{from{opacity:0;transform:scale(.4) rotate(-8deg)}
  to{opacity:1;transform:none}}
.frage .fastText{color:var(--warn)}
.frage .loesung{color:var(--akzent)}
/* Der Nebenbei-Hinweis steht UNTER dem Haken, kleiner und leiser. */
.frage .nebenbei{display:block;font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);margin-top:var(--r1)}
.eingabe{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;background:var(--papier);
  border:var(--strich-stark) solid var(--akzent);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  min-height:64px;width:100%;color:var(--auf-flaeche);text-align:center}
.eingabe:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 var(--ring) var(--akzent-h)}
.hinweis{font-family:var(--f-ui);font-size:var(--s0);line-height:1.4;border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);background:var(--gut-h);color:var(--auf-flaeche)}
.hinweis.nochmal{background:var(--nochmal-h)}
.reihe{display:flex;gap:var(--r2);align-items:center;justify-content:center;flex-wrap:wrap}
.mikro{width:76px;height:76px;border-radius:var(--rund-voll);background:var(--akzent);border:none;
  display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;position:relative}
/* Der Ring atmet NUR, waehrend wirklich zugehoert wird (F13).
   Vorher lief er immer. Die App sah damit aus, als hoerte sie zu, waehrend
   sie es nicht tat - und als hoerte sie weiter zu, nachdem sie aufgehoert
   hatte. Ein Zustand, den man sieht und der nicht stimmt, ist schlimmer
   als keiner: der Nutzer wartet auf etwas, das nicht kommt. */
.mikro::after{content:"";position:absolute;inset:-8px;border-radius:var(--rund-voll);
  border:var(--strich-kueste) solid var(--akzent);opacity:.18}
.mikro.hoert::after{opacity:.3;animation:atmen var(--d-atmen) ease-in-out infinite}
/* Die beiden Knoepfe der Rueckfrage (F15).
   Sie stehen unter der Sprachzeile und muessen mit dem Daumen zu treffen
   sein wie alles andere - deshalb dieselbe Mindesthoehe wie ein Knopf und
   nicht die Groesse eines Textlinks. `flex-wrap`, weil die Werkzeugspalte
   im schmalen Querformat keine zwei Knoepfe nebeneinander fasst. */
.nachfrage{display:flex;gap:var(--r2);flex-wrap:wrap;justify-content:center;margin-top:var(--r2)}
.nachfrage button{min-height:44px;min-width:64px}
/* Und waehrend des Zuhoerens ist der Knopf ein anderer: er sagt jetzt
   „fertig", nicht mehr „sprich". */
.mikro.hoert{background:var(--gut)}
@media (prefers-reduced-motion:reduce){.mikro.hoert::after{animation:none;opacity:.45}}
@keyframes atmen{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.1}}
.tonaus{background:var(--tinte-3)}
.tonaus::after{display:none}

.gross{font-family:var(--f-ui);font-size:var(--s5);font-weight:800;letter-spacing:-.03em}
.bandhinweis{position:absolute;left:0;right:0;bottom:0;background:var(--tinte);color:var(--papier);
  font-family:var(--f-ui);font-size:var(--s-klein);padding:var(--r2) var(--r4);text-align:center}
/* --- M3 bis M6: Fortschritt, Forscherbuch, Elternbereich --- */
.balken.breit{width:min(340px,70vw)}
.balken{position:relative;width:100%;height:8px;border-radius:var(--rund-voll);
  background:var(--linie);overflow:hidden}
/* `transform:scaleX` statt `width`: eine Animation auf einer
   Layouteigenschaft laesst den Browser bei JEDEM Bild neu umbrechen. Die
   Regel steht im Projekt seit dem Grafik-Audit; hier stand sie trotzdem,
   weil das Tor `marken` nur die Entwuerfe las und nicht die App. */
.balken i{position:absolute;inset:0;display:block;height:100%;width:100%;background:var(--gut);
  border-radius:var(--rund-voll);transform-origin:left center;
  transition:transform var(--d-zustand) var(--k-standard)}
/* Zwei Streifen, zwei Bedeutungen - der helle liegt unten und ist der
   laengere: "unterwegs" schliesst "hat einen Aufkleber" mit ein. */
.balken i.unterwegs{background:color-mix(in oklab, var(--gut) 38%, var(--papier))}
.balken i.fest{background:var(--gut)}
.balken.klein{height:6px;min-width:60px}
/* Die Zeile unter dem Balken auf dem Endbildschirm: Zeichen und Zahl gross
   genug, um sie ohne Lesen zu erfassen. */
.buchstand{display:flex;align-items:center;gap:var(--r2);font-family:var(--f-ui);
  font-size:var(--s0);font-weight:700;color:var(--tinte-2)}
.buchstand .klebermarke{font-size:var(--s1)}
.buchstand .klebermarke svg{width:26px;height:26px}
.leiser{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte-3);max-width:44ch}
.siegwahl{margin-top:var(--r6)}
.fach{font-size:var(--s-klein);color:var(--tinte-3);font-weight:600;margin-left:var(--r2)}

/* Das Wartezeichen. Drei Punkte, die der Reihe nach atmen.
   Kein Wort: es erscheint fuer ein Kind, das nicht liest. */
.warten .mitte{align-items:center;justify-content:center}
.punkte{display:flex;gap:var(--r3)}
.punkte i{width:14px;height:14px;border-radius:var(--rund-voll);background:var(--akzent);
  opacity:.25;animation:atmen var(--d-warten) ease-in-out infinite}
.punkte i:nth-child(2){animation-delay:var(--d-warten-versatz)}
.punkte i:nth-child(3){animation-delay:calc(var(--d-warten-versatz) * 2)}
@keyframes atmen{0%,70%,100%{opacity:.25;transform:scale(.85)}35%{opacity:1;transform:scale(1)}}
/* Wer Bewegung abbestellt hat, bekommt sie nicht - die Punkte stehen dann
   einfach da. Sichtbar bleiben sie trotzdem, darum geht es. */
@media (prefers-reduced-motion:reduce){ .punkte i{animation:none;opacity:.6} }

.rollen{flex:1;min-height:0;overflow:auto;padding:0 var(--r4) var(--r8);
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.rollen.eltern{max-width:760px;margin:0 auto;width:100%;text-align:left}
.rollen.eltern .unter{text-align:left;max-width:62ch}
.rollen.eltern .reihe{justify-content:flex-start}
.gruppe{font-family:var(--f-ui);font-size:var(--s1);font-weight:800;margin:var(--r6) 0 var(--r3);
  letter-spacing:-.01em}
.kleber{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--r3)}
/* Groesser, seit im Buch nur noch steht, was DA ist: es sind weniger
   Stuecke, also darf jedes mehr Platz haben. Bei 104 Punkten war ein
   Umriss ein Fleck. */
.kleber.gross{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--r4)}
.kleber.gross .aufkleber svg{height:96px}
/* Die Vorschau ist kein Vorwurf: drei Stueck, kleiner, und sichtbar
   zurueckgenommen. */
.kleber.vorschau{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.kleber.vorschau .aufkleber svg{height:72px}
/* Auf Weiss traegt der Rand, auch hier (R2).
   Die Karte hatte `background:var(--papier)` und `border:none` - auf dem
   alten hellblauen Grund war sie damit eine Karte, auf Weiss ist sie
   nichts. Zu sehen war nur noch der Schatten an ihrer Unterkante, und die
   Umrisse schwebten frei im Raum. */
.aufkleber{background:var(--papier);border:var(--strich) solid var(--linie);
  border-radius:var(--rund-karte);padding:var(--r2);
  box-shadow:0 var(--kante-flach) 0 var(--tiefe-farbe);display:flex;flex-direction:column;align-items:center;
  gap:var(--r1);cursor:pointer;opacity:.72}
/* 0,45 war auf Weiss zu wenig - und schlimmer: unter 0,5 sieht
   `lesbarkeit` einen Text gar nicht erst an. Die Vorschau war damit die
   einzige Schrift der App, die NIE gemessen wurde (Regel 1). */
.aufkleber.da{opacity:1}
.aufkleber{position:relative}
.aufkleber .siegel{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;
  background:var(--gut);border:var(--strich-stark) solid var(--papier)}
.aufkleber svg{width:100%;height:64px}
.aufkleber span{font-family:var(--f-lesen);font-size:var(--s-klein);font-weight:700;
  color:var(--auf-flaeche);text-align:center;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.pin{display:flex;gap:var(--r3);justify-content:center;align-items:center;min-height:34px}
.pin i{width:16px;height:16px;border-radius:var(--rund-voll);border:var(--strich-stark) solid var(--akzent);
  transition:background var(--d-tipp) var(--k-standard)}
.pin i.voll{background:var(--akzent)}
/* Dieselben Punkte, kleiner: im Elternbereich stehen sie in einer Zeile Text. */
.pin.klein{display:inline-flex;gap:var(--r2);min-height:0;vertical-align:middle}
.pin.klein i{width:11px;height:11px}
.ziffern{display:grid;grid-template-columns:repeat(4,64px);gap:var(--r2);justify-content:center}
.zi{justify-content:center;font-size:var(--s1);min-height:56px}
/* Der Ziffernblock im Elternbereich ist kleiner: dort tippt ein
   Erwachsener, nicht ein Kind mit dem Daumen. 44 Punkte bleiben. */
.ziffern.klein{grid-template-columns:repeat(5,48px);gap:var(--r1);justify-content:start;
  margin-top:var(--r2)}
.ziffern.klein .zi{min-height:44px;font-size:var(--s0)}

.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--r3)}
.wert{background:var(--papier);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  box-shadow:0 var(--kante-flach) 0 var(--tiefe-farbe)}
.wert b{display:block;font-size:var(--s2);font-weight:800;letter-spacing:-.02em}
.wert span{display:block;font-size:var(--s-klein);color:var(--tinte-3)}

.tab{width:100%;border-collapse:collapse;background:var(--papier);border-radius:var(--rund-karte);
  overflow:hidden;font-size:var(--s-klein)}
.tab th,.tab td{text-align:left;padding:var(--r2) var(--r3);border-bottom:var(--strich-fein) solid var(--linie)}
.tab th{font-weight:700;color:var(--tinte-3);font-size:13px}
.tab tr:last-child td{border-bottom:0}
.tab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ausgabefeld{width:100%;height:180px;font-family:var(--f-mono);font-size:12px;
  border:var(--strich) solid var(--linie);border-radius:var(--rund-klein);padding:var(--r2)}
code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--linie);
  padding:.1em .35em;border-radius:var(--rund-klein)}

@media (prefers-reduced-motion:reduce){
  /* Der `*`-Hammer steht jetzt in marken.css, wo er hingehoert.
     Ohne Bewegung muss der Rand allein tragen - also dauerhaft dick. */
  .karte .zielpuls{stroke-width:7;stroke-opacity:.55}
}
/* --- Kurze Bildschirme (ganz am Ende, siehe unten) ------------------------------------------------
   Das Zielgeraet hat quer 390 Punkte Hoehe fuer ALLES. Vorher stand hier
   eine Handvoll Einzelausnahmen; die haben je einen Bildschirm gerettet
   und die anderen sechs uebersehen. Auf dem iPhone waren zuletzt SECHZEHN
   Elemente nicht erreichbar - die vierte Antwort, die Ebene
   "Landeshauptstaedte", der "Verstanden"-Knopf ihrer Einweisung und drei
   Tasten der Eltern-PIN.

   Deshalb jetzt EIN Hebel: das ganze Raster wird enger, Schrift und
   Abstaende zusammen. Was NICHT mitschrumpft, sind die Trefferflaechen -
   44 Punkte bleiben 44 Punkte, egal wie klein der Bildschirm ist.

   Und der Block steht AM ENDE der Stilvorlage. Beim ersten Anlauf stand er
   in der Mitte, vor `.ziffern` und `.zi` - und war fuer die wirkungslos:
   eine Medienabfrage erhoeht die Spezifitaet nicht, bei gleichem Gewicht
   gewinnt die spaetere Regel. Das Tor meldete daraufhin drei Tasten der
   Eltern-PIN weiter als nicht erreichbar, obwohl die Regel dastand. */
/* Die Maske sitzt auf dem UMRISS, nicht auf der Kachel - seit der
   Umriss in die rechte Haelfte passt, braucht sie nur noch seine linke
   Kante weichzuzeichnen. Bei 58 % fraß sie das halbe Bild. */
.kachel .silhouette{-webkit-mask-image:var(--blende-umriss);
  mask-image:var(--blende-umriss)}
@media (max-height:440px), (max-width:430px){
  :root{
    --s-klein:14px; --s0:17px; --s1:20px; --s2:24px; --s3:28px; --s4:34px; --s5:40px;
    --r3:8px; --r4:12px; --r6:14px; --r8:18px; --r12:28px; --r16:36px; --r24:48px;
  }
  .kopf{padding:var(--r2) var(--r4)}
  /* Das Forscherbuch auf dem kurzen Querformat.
   *
   * Gemessen auf 844 x 390 mit ZWEI Aufklebern und zwei Vorschaukarten:
   * 358 Punkte Inhalt in 322 sichtbaren. Das Buch rollte also schon beim
   * zweiten Aufkleber, und die Vorschau unter „Als Nächstes" stand zur
   * Haelfte unter dem Rand - zwei graue Halbkarten, von denen ein Kind
   * nicht weiss, dass darunter noch etwas ist.
   *
   * Dass ein VOLLES Buch rollt, ist richtig; ein Album waechst. Dass ein
   * fast leeres rollt, ist es nicht. Die Bildhoehen sind hier fuer den
   * Schreibtisch gewaehlt (96 und 72 Punkte) und auf dem Telefon zu gross;
   * `passt` misst den Ueberlauf nicht, weil `.rollen` rollen DARF. */
  .kleber.gross .aufkleber svg{height:64px}
  .kleber.gross.vorschau .aufkleber svg{height:48px}
  /* Und die Ueberschriften der Aufklebergruppen werden kleiner.
   *
   * Gemessen am Zielgeraet mit Browserleiste (844 x 390, davon 322
   * sichtbar), Fiona mit fuenf Aufklebern: der Abzeichenstreifen kostet
   * 44 Punkte, und danach stand der Inhalt auf 340 - achtzehn zuviel.
   * Vorher waren es genau 322 in 322, das Buch hatte also KEINEN
   * Spielraum; die naechste Zeile, die irgendwer hinzufuegt, haette es
   * genauso gekippt.
   *
   * Zurueckgeholt wird es nicht am Streifen: 44 Punkte sind die
   * Fingergrenze und keine Zahl, die man weiter drueckt. Es kommt von den
   * zwei Gruppenueberschriften, die zusammen 90 Punkte fuer zwei Woerter
   * trugen (je 26 hoch, dazu 14 und 8 Punkte Rand) - auf einem
   * Bildschirm, der 322 hat. Mit `--s0` statt `--s1` und engeren
   * Raendern sind es 68, und die Fusspolsterung gibt sechs weitere her:
   * gemessen 312 in 322, also zehn Punkte Luft statt keiner. */
  .rollen.buch .gruppe{font-size:var(--s0);margin:var(--r3) 0 var(--r1)}
  .rollen.buch{padding-bottom:var(--r4)}
  .frage{padding:0 var(--r4) var(--r1)}
  .etikett{min-height:44px}
  .titel{font-size:var(--s2)}
  /* Auf dem kleinsten Geraet (iPhone SE quer, 667x375) zaehlt jeder
     Punkt: die 1,5-Punkt-Raender der neuen Knoepfe haben die fuenfte
     Ebene wieder 4 Punkte unter den Rand geschoben. Statt genau diese 4
     zurueckzuholen, ruecken hier die INNEREN Abstaende enger - das gibt
     rund 30 Punkte Luft, und die naechste Schriftaenderung kippt es nicht
     gleich wieder. */
  /* Der Balken BLEIBT jetzt auch hier stehen.
     Vorher fiel er weg, "weil er dasselbe sagt wie die Zahl darueber" -
     und weil die Zahl da war, kostete das nichts. Seit die Zahl durch
     Sterne und Aufkleber ersetzt ist, war auf dem Zielgeraet - iPhone
     quer, genau dieses Fenster - GAR KEIN Fortschritt mehr zu sehen:
     acht gleich aussehende Kacheln. Er wird schmaler statt unsichtbar. */
  /* Mit den seitlichen Aussparungen des iPhone (je 59 Punkte) bleiben von
     844 nur 726 - dort passen DREI Kacheln nebeneinander, nicht vier, also
     drei Reihen statt zwei. Bei 72 Punkten je Kachel lag die letzte Reihe
     3 Punkte im unteren Streifen. Die Polsterung gibt sie her. */
  .kachel{padding:var(--r2) var(--r4);max-width:300px;gap:var(--r1)}
  /* `.kachel.bunt` setzt die Polsterung mit ZWEI Klassen; die Zeile
     darueber hat sie nie erreicht. Sie stand seit der Einfuehrung dieses
     Fensters da und tat nichts - gemessen, nicht vermutet: die Kachel blieb
     bei 16/24 Punkten, egal was hier stand. */
  .kachel.bunt{padding:var(--r2) var(--r4)}
  /* Sterne, Aufkleber und Balken in EINE Zeile - sonst ist die Kachel um
     zwei Zeilen hoeher als vorher, und acht davon passen nicht mehr in
     390 Punkte. Das Tor `passt` hat genau das gemeldet. */
  /* Der Vorlauf (R3) im kurzen Querformat.
     Gemessen, nicht geschaetzt: `passt` meldete auf dem iPhone SE quer
     (667 x 375) elf bis achtundneunzig Punkte Ueberlauf, auf dem
     Zielgeraet achtundvierzig bei den Hauptstaedten. Die Karten werden
     deshalb hier kleiner - und nur hier. */
  .rollen.vorlauf{gap:var(--r1)}
  /* 88 statt 76 Punkte, und das ist keine Kosmetik.
     Bei 76 brach „Niedersachsen" zu „Niedersachs / en" und
     „Brandenburg" zu „Brandenbur / g" - mitten im Wort, auf einem
     Bildschirm, der genau diese Namen beibringen soll. Bei 88 nimmt der
     Umbruch die Fugen: „Rheinland- / Pfalz". Und es kostet KEINE Reihe:
     sechzehn Karten stehen auf dem Zielgeraet so wie so in zweien. Wie
     breit es sein darf, hat `passt` gesagt, nicht ich. */
  .rollen.vorlauf .kleber{gap:var(--r1);
    grid-template-columns:repeat(auto-fit,minmax(max(88px,
      calc(100% / var(--spalten,8) - var(--r1))),1fr))}
  .rollen.vorlauf .kleber.viel{
    grid-template-columns:repeat(auto-fit,minmax(max(var(--kleber-eng-min),
      calc(100% / var(--spalten,9) - var(--r1))),1fr))}
  /* Ein Vorlauf mit Zuordnung traegt zwei Namen je Karte statt einem -
     „Mecklenburg-Vorpommern" unter „Schwerin". */
  .rollen.vorlauf .kleber:has(.dazu){grid-template-columns:repeat(auto-fit,minmax(max(96px,
    calc(100% / var(--spalten,8) - var(--r1))),1fr))}
  .rollen.vorlauf .aufkleber{padding:var(--r0);gap:0;justify-content:center}
  .rollen.vorlauf .aufkleber svg{min-height:22px}
