  .rollen.vorlauf .kleber{gap:var(--r1);
    grid-template-columns:repeat(auto-fit,minmax(max(88px,
      calc(100% / var(--spalten,8) - var(--r1))),1fr))}
  .rollen.vorlauf .kleber.viel{
    grid-template-columns:repeat(auto-fit,minmax(max(var(--kleber-eng-min),
      calc(100% / var(--spalten,9) - var(--r1))),1fr))}
  /* Ein Vorlauf mit Zuordnung traegt zwei Namen je Karte statt einem -
     „Mecklenburg-Vorpommern" unter „Schwerin". */
  .rollen.vorlauf .kleber:has(.dazu){grid-template-columns:repeat(auto-fit,minmax(max(96px,
    calc(100% / var(--spalten,8) - var(--r1))),1fr))}
  .rollen.vorlauf .aufkleber{padding:var(--r0);gap:0;justify-content:center}
  .rollen.vorlauf .aufkleber svg{min-height:22px}
  .rollen.vorlauf .mitte-satz{font-size:calc(var(--s-klein) * 0.95)}
  .rollen.vorlauf .aufkleber span{font-size:calc(var(--s-klein) * 0.86)}
  .rollen.vorlauf .aufkleber .dazu{font-size:calc(var(--s-klein) * 0.78)}
  .vorlauffuss{padding:var(--r2) var(--r4) var(--r3)}
  /* Die zwei Kachelknoepfe kosten eine Zeile, die es hier nicht gibt:
     mit „anschauen" lief die Ebenenwahl 24 Punkte ueber den Fensterrand.
     Kleiner, statt einen der beiden wegzulassen - beides sind Wege, die
     das Kind sonst nicht hat. */
  .kachelknoepfe{gap:var(--r1)}
  /* Das Auge faellt auf dem Telefon WEG (Q18).
   *
   * Gemessen auf 844 x 390 mit Leiste: die Kachel ist dort 134 x 112,
   * das Auge sitzt unten rechts, und seine Trefferflaeche ist 44 x 44 -
   * sie muss es sein, das ist die Fingergrenze. In eine 112er Kachel
   * passt das nur, indem sie nach OBEN in die Namenszeile reicht. Sie tut
   * es bei allen neun Kacheln: „Mittelamerika" 38 x 15 Punkte, „Bundes-
   * laender" 36 x 15, „Nordamerika" 33 x 15, „Kontinente" 24 x 15 - bei
   * einem 17-Punkt-Wort ist das die ganze Zeilenhoehe und bis zu einem
   * Drittel der Breite. Wer auf das Ende des Wortes tippt, landet in der
   * Vorschau statt in der Ebene.
   *
   * Die drei Auswege sind durchgerechnet und alle teurer: breitere
   * Kacheln kosten eine dritte Reihe (und damit das Bild), niedrigere
   * Kacheln druecken das Bild von 50 auf 19 Punkte, und Name links /
   * Auge rechts laesst „Mittelamerika" auf 90 Punkten umbrechen.
   *
   * Also weg - und nur hier. Auf dem iPad misst dieselbe Kachel 240 x 112
   * und die Ueberschneidung ist 0 x 0; dort bleibt das Auge. Was das
   * Telefon dafuer verliert, ist das ZWEITE Anschauen: der Vorlauf
   * erscheint beim ersten Betreten einer Ebene ohnehin von selbst.
   * Gewonnen ist, dass die Kachel ein einziges sauberes Ziel ist. */
  .wahl.ebenen .kachelpaar .schau{display:none}
  /* Und damit faellt der Platz weg, der fuer das Auge freigehalten war:
     18 Punkte, die der Fortschrittsbalken bekommt. */
  .wahl.ebenen .kachelfuss{padding-right:0}
  /* Die AUFKLEBERZAHL faellt auf dem Telefon weg — fuer das Bild (Q23).
   *
   * Gemessen (Q20): die Kachel ist 112 Punkte hoch, davon nimmt das Bild
   * 48. Der Rest ist Polsterung (16), Name (19), Abstaende (11) und der
   * Kachelfuss (20). Der Fuss ist 20 hoch, weil die Aufkleberzahl es ist -
   * der Balken darin misst 5. In der Breite und in der Hoehe der WAND ist
   * nichts mehr zu holen: 24 beziehungsweise 12 Punkte, und beides ist
   * innerhalb dessen, was zwei Browser verschieden rechnen.
   *
   * Also hier. Der Balken bleibt und sagt weiter, wie weit die Ebene ist -
   * anteilig, was fuer Fiona ohnehin die einzige lesbare Form ist. Die
   * genaue Zahl steht im Forscherbuch, wo die Aufkleber liegen.
   *
   * Der POKAL bleibt: er ist kein Zaehler, sondern eine Auszeichnung, und
   * es gibt ihn erst, wenn die Ebene bestanden ist. Deshalb faellt nicht
   * `.stand` weg, sondern nur die Marke darin. */
  .wahl.ebenen .kachel .stand .klebermarke{display:none}
  .wahl.ebenen .kachel .stand:not(:has(.pokal)){display:none}
  /* Und der Abzug am Bild geht mit: 62 waren Name, Fuss, Rand und
     Abstaende. Der Fuss ist von 20 auf 5 Punkte geschrumpft (nur noch der
     Balken), also 47. Wer die Zahl hier vergisst, hat die fuenfzehn
     Punkte freigeraeumt und laesst sie leer — gemessen, nicht geschaetzt:
     das Bild stand danach unveraendert auf 48. */
  .wahl.ebenen .kachel .silhouette{height:calc(100% - 47px)}
  /* Der Kasten bleibt 16 Punkte hoch, die TREFFERFLAECHE wird 26.
   *
   * Gemessen auf 844 x 390 mit Leiste: ueber dem Knopf liegen 2 Punkte
   * Luft bis zur Kachel, darunter 8 bis zur naechsten Zeile - zehn Punkte,
   * die niemand benutzt. Padding plus gleich grosser negativer Rand holt
   * sie, ohne dass sich am Bild etwas aendert.
   *
   * 44 sind hier NICHT zu erreichen, und das ist gerechnet, nicht
   * geschaetzt: von 390 Punkten bleiben mit Leiste 348, davon gehen Kopf
   * und Frage ab; fuer drei Zeilen aus Kachel (56), Knopfzeile (16) und
   * Abstand (8) bleibt genau nichts uebrig. Ein 44er Knopf je Kachel
   * kostete 84 Punkte, die es nicht gibt. Was ein Fehlgriff kostet, ist
   * dafuer klein: daneben liegt die Kachel, und die startet die Ebene -
   * also genau das, was das Kind ohnehin wollte. */
  .kachelknoepfe .leise.mini{padding:var(--r0) var(--r2) var(--r2);min-height:0;
    margin:calc(-1 * var(--r0)) 0 calc(-1 * var(--r2));
    font-size:calc(var(--s-klein) * 0.9)}
  .wahl{gap:var(--r2)}
  /* Der neue Aufkleber steht NEBEN dem Wort, nicht darueber (Q28).
     Gemessen im Augenblick des Aufklebers, Kontinente, iPhone quer:

         nebeneinander    tiefster Punkt 378 von 390   mit Leiste 369
         uebereinander    tiefster Punkt 385 von 390   mit Leiste 391

     Auf dem Zielgeraet MIT Uhr und Wischstreifen laeuft die Seite
     uebereinander also ueber - um einen Punkt, aber sie laeuft ueber.
     Die erste Fassung dieser Zeile behauptete, die vierte Antwort falle
     aus dem Bild; nachgemessen stimmt das nicht, alle vier Etiketten
     bleiben in beiden Fassungen sichtbar. Was uebersteht, ist die Seite
     selbst. Ohne die Messung waere hier eine Begruendung stehen
     geblieben, die schoener klingt als sie stimmt. */
  .frage .neuerkleber{flex-direction:row;gap:var(--r2);margin-top:var(--r1)}
  .frage .neuerkleber svg{height:40px;max-width:64px}
  .kachelpaar{gap:var(--r0)}
  /* Die letzten fuenfzehn Punkte fuer den sicheren Bereich.
     Auf dem iPhone quer MIT Uhr, Akku und Wischstreifen bleiben von 390
     Punkten noch 348 - und genau dort lag die Ebenenwahl mit dem neuen
     Knopf „anschauen" 15 Punkte drueber. Geholt werden sie an der
     Kachelpolsterung, nicht an der Schrift: lesbar muss sie bleiben. */
  .kachel.bunt{padding:var(--r1) var(--r4)}
  .kachel .name{line-height:1.05}
  .kachel .kachelfuss{flex-direction:row;align-items:center;gap:var(--r2)}
  .kachel .balken{height:5px;flex:1;min-width:40px}
  .kachel .stand{min-height:0;gap:var(--r2);flex:none}
  /* Auf 844x390 bleibt fuer die Karten rund 280 Punkte Hoehe: Kopfzeile
     und Frage nehmen den Rest. Und die Ueberzeile bleibt HIER stehen,
     obwohl sie auf einer Ebenenkachel ausgeblendet ist - dort sind es
     acht Kacheln, hier zwei, und „2 Uebungen" ist das einzige, was sagt,
     wie gross eine Welt ist. */
  /* Die Weltkacheln nehmen sich den Platz, der da ist (Q24).
   *
   * Anders als auf der Ebenenwahl ist hier LUFT: gemessen auf 844 x 390
   * endete die Wand bei 329 von 390 - einundsechzig Punkte standen leer,
   * und darunter kommt nichts mehr. Auf dem kleinsten Geraet (iPhone SE
   * quer, 667 x 375) sind es 33 bis zum sicheren Rand.
   *
   * Es ist EINE Reihe (drei Kacheln bei Fiona, zwei bei Lea), also geht
   * der ganze Zuwachs in die Hoehe der einen Reihe. 200 statt 170: das
   * sind 30, und 33 waren zu haben.
   *
   * Und das Bild waechst mit, ohne dass hier etwas dazu steht: es ist
   * hier kein Kasten neben dem Text, sondern ein Wasserzeichen ueber 80 %
   * der Kachelhoehe. Genau deshalb war auf der Ebenenwahl der Kachelfuss
   * der Hebel und hier die Kachel selbst - dieselbe Frage, zwei
   * verschiedene Antworten, weil zwei verschiedene Aufbauten. */
  .kachel.welt{min-height:200px}
  /* Und dieselbe Zahl fuer die DREI-Kachel-Fassung (Fiona). Die Regel
     oben ist spezifischer (`.wahl.weltwahl:has(> :nth-child(3))`) und
     gewinnt sonst mit ihren 180 - gemessen: Lea wuchs auf 200, Fiona
     blieb auf 180, und dieselbe Luft stand bei ihr weiter leer. Die 180
     dort sind gegen eine zweite REIHE gesetzt, also gegen die Breite; in
     der Hoehe kosten sie nur. */
  .wahl.weltwahl:has(> :nth-child(3)) .kachel.welt{min-height:200px}
  .kachel.welt .ueber{display:block}
  .kachel.welt .name{font-size:var(--s2)}
  .kachel .stand .sterne svg{width:17px;height:17px}
  /* Der Endbildschirm hat mit Balken, Aufkleberzeile und Hinweis drei
     Zeilen mehr bekommen. Auf 844x390 stand die Knopfreihe danach unter
     dem Rand - die Sterne geben den Platz her, nicht die Auskunft. */
  /* Auf 844x390 ist die Rechnung in --s5 (61 px) zu hoch: Kopf, Frage,
     Rechnung, vier Zahlen und der Ausweg passen sonst nicht uebereinander. */
  .rechnung{font-size:var(--s4)}
  .rechenfeld{gap:var(--r4)}
  .zahl{min-height:64px;min-width:76px;font-size:var(--s2);padding:var(--r2) var(--r3)}
  /* Auf 844x390 ist dieselbe Rechnung wie bei `.zahl`: Kopf, Frage, vier
     Karten und der Ausweg muessen uebereinander passen. 104 statt 124, und
     der Fleck geht von 76 auf 64 - beides bleibt weit ueber der
     Fingergrenze von 44. */
  /* Auf 844x390 muessen zwei Saetze, das Feld, „Prüfen" und der Ausweg
     uebereinander passen - dieselbe Rechnung wie bei der Rechnung. */
  .satzdeutsch{font-size:var(--s1)}
  .satzfeld .satz-eingabe{font-size:var(--s0);min-height:48px}
  .freundluecke{font-size:var(--s1);line-height:1.9}
  .freundluecke .luecke{font-size:var(--s1)}
  .engkarte{min-height:104px;min-width:104px;padding:var(--r2)}
  .farbfleck{width:64px;height:64px}
  .ziffernbild{font-size:var(--s3)}
  .tippfeld .eingabe{min-height:64px;font-size:var(--s2);min-width:130px}
  .tippfeld .knopf{min-height:64px}
  .siegsterne svg{width:40px;height:40px}
  .siegwahl{margin-top:var(--r3)}
  .buchstand{font-size:var(--s-klein)}
  .buchstand .klebermarke{font-size:var(--s0)}
  .buchstand .klebermarke svg{width:22px;height:22px}
  /* Auf 667x375 passen acht Kacheln nur ohne die Ueberzeile. Sie traegt
     die Einordnung ("LÄNDER IN"), aber die Farbe tut das auch - und eine
     Ebene, die man nicht erreicht, traegt gar nichts. */
  .kachel .ueber{display:none}
  .kachel .name{font-size:var(--s1)}
  /* 160 statt 170: auf dem Zielgeraet MIT Leiste bleiben von 844 Punkten
     726, und vier Profilkacheln zu 170 brauchen samt Abstand 728. Zwei
     Punkte, und Violeta stand in einer zweiten Reihe im Wischstreifen.
     Seit die Wand ein Fluss ist, dehnen sich die Kacheln nicht mehr auf
     die Reihe - die Breite muss also von sich aus passen. */
  .wahl>*{flex-basis:160px}
  /* Fuenf je Reihe, damit neun Ebenen in ZWEI Reihen stehen - daran haengt
     die Hoehe des Kachelbildes (siehe oben). 134 Punkte, weil bei weniger
     „Mittelamerika" umbricht und bei mehr nur vier je Reihe passen. */
  .wahl.ebenen>*{flex-basis:134px}
  /* Und auf dem Telefon dieselbe Ausweichbewegung, aber NICHT in Punkten:
     ab elf Kacheln ist die Breite ein Sechstel der Wand. Ein fester Wert
     hat hier zweimal danebengelegen - 118 pt geben auf 844 sechs je
     Reihe, auf dem iPhone SE quer (667) nur fuenf, und auf demselben
     iPhone MIT Uhr und Wischstreifen (726 nutzbar) auch nur fuenf. Elf
     Kacheln in drei Reihen laufen auf beiden aus dem Bild. Sechs je Reihe
     sind hier nicht bequem, sondern die Bedingung: elf und zwoelf Ebenen
     in zwei Reihen. Der Name wird dabei eine Stufe kleiner - dieselbe
     Stufe, die das kleinste Geraet ohnehin schon faehrt.
     Fuenf Luecken zwischen sechs Kacheln, deshalb 5 x --r3.
     Nach unten begrenzt: derselbe Block faengt auch das HOCHformat
     (390 breit), und ein Sechstel davon waeren 54 Punkte - eine Kachel,
     auf der weder Bild noch Name etwas taugen. Bei 100 bleibt das
     Hochformat bei drei je Reihe, wo es heute schon steht; 100 ist kein
     runder Wunsch, sondern das Mass, das das kleinste Geraet an dieser
     Stelle ohnehin ausrechnet (iPhone SE quer, 667 breit). */
  .wahl.ebenen:has(> :nth-child(11))>*{
    flex-basis:max(100px, calc((100% - 5 * var(--r3)) / 6))}
  .wahl.ebenen:has(> :nth-child(11)) .kachel .name{font-size:var(--s-klein)}
  /* Und die letzten Punkte fuer die zwei langen Namen (Q31).
   *
   * GEMESSEN an elf Kacheln auf dem iPhone SE quer, dem engsten Fall:
   * von elf Namen brechen genau zwei um, und beide lassen einen Rest
   * von sieben bis neun Punkten in der zweiten Zeile stehen - also
   * einen einzelnen Buchstaben („Mittelamerik/a", „Bundeslände/r").
   *
   *     Kasten 90 pt      Mittelamerika 97   Bundesländer 95
   *                       Nordamerika   90   Hauptstädte  86
   *
   * Es fehlen sieben Punkte, nicht siebzig. Geholt werden sie da, wo sie
   * am wenigsten kosten: am seitlichen Polster der Kachel (das Bild
   * darueber ist ohnehin schmaler) und an einem Hauch Laufweite. Die
   * SCHRIFTGROESSE bleibt - sie ist mit 14 Punkten schon die kleine
   * Stufe, und ein Name, den ein Kind lesen soll, ist der falsche Ort
   * zum Sparen.
   *
   * WAS DAMIT NICHT GEPRUEFT IST: dieses Chromium hat kein deutsches
   * Trennmuster (nachgesehen - „Mittelamerika" bricht in 70 Punkten
   * Breite ohne Trennstrich um). Auf iOS traegt `hyphens:auto` mit
   * `lang="de"`, und dort waere der Umbruch getrennt statt abgehackt.
   * Hier ist kein Gerät; das bleibt unbelegt. Die Punkte unten helfen
   * in BEIDEN Faellen, weil sie den Umbruch ganz vermeiden. */
  .wahl.ebenen:has(> :nth-child(11)) .kachel{padding-left:var(--r0);padding-right:var(--r0)}
  .wahl.ebenen:has(> :nth-child(11)) .kachel .name{letter-spacing:-.02em}
  /* Eine Stufe schmaler fuer das KLEINSTE Geraet (iPhone SE quer, 667):
     dort passen bei 134 nur vier je Reihe, das waeren drei Reihen, und
     drei hohe Kacheln laufen aus dem Bild. Weil „Mittelamerika" bei 118
     umbricht, wird der Name dort eine Stufe kleiner. */
  @media (max-width:700px){
    .wahl.ebenen>*{flex-basis:118px}
    .wahl.ebenen .kachel .name{font-size:var(--s-klein)}
  }
  /* Die letzte Kachelreihe lag 3 Punkte im Streifen des iPhone. Die vier
     Punkte kommen aus dem Abstand ZWISCHEN den Kacheln, nicht aus der
     Auskunft in ihnen. */
  .mitte{gap:var(--r3)}
  .wahl{gap:var(--r2)}
  .kachel .kreis{width:44px;height:44px}
  .kachel .umriss{width:60px;height:60px}
  .unter{max-width:52ch}
  .mikro{width:56px;height:56px}
  /* Auch hier INNEN. Dieselbe Zeile, dieselbe Ursache wie oben - und
     der Grund, warum die erste Reparatur nicht half: die Regel steht
     zweimal, und gepflegt wurde die falsche (Regel 6). */
  .mikro::after{inset:2px;border-width:var(--strich-stark)}
  /* Der Zifferblock der Eltern-PIN in ZWEI Reihen statt drei. */
  .ziffern{grid-template-columns:repeat(6,52px)}
  .zi{min-height:48px}
}

/* Die WELTENWAHL bekommt KEINE hoehere Kachel (Q27, gemessen und verworfen).
 *
 * Der Versuch stand hier: auf dem grossen Schirm ist es eine Reihe mit 244
 * bis 439 Punkten Luft, also die Kachel hoeher machen wie bei der
 * Ebenenwahl. Gemessen sah es gut aus - Kachel 180 → 279, „Bild" 142 →
 * 221. Angesehen war es das Gegenteil: die Karte schwamm in Luft.
 *
 * Gemessen war der SVG-KASTEN, nicht das Gezeichnete. Der Umriss ist hier
 * durch `max-width:76%` in der BREITE gebunden, nicht in der Hoehe:
 *
 *     iPhone quer   Kachel 268x200   Kasten 202x158   gezeichnet 202x110
 *     iPad quer     Kachel 280x279   Kasten 211x221   gezeichnet 211x115
 *
 * Eine hoehere Kachel macht den Kasten hoeher und das Bild keinen Punkt
 * groesser. Regel 5, und diesmal an mir selbst: jede Zahl traegt ihre
 * Messstelle mit, und diese hier trug die falsche - gemessen war der
 * Kasten, gefragt war das Bild.
 *
 * Damit ist auch die Zeile in Q24 falsch, die „Bild 142 → 158" behauptet -
 * gewachsen ist dort der Kasten, das Bild blieb bei 110. Was die hoehere
 * Kachel WIRKLICH gebracht hat, ist Flaeche fuer den Finger und eine
 * Wand, die den Bildschirm fuellt; das ist etwas wert, nur nicht das.
 *
 * Der Hebel fuer das Bild waere `max-width`, nicht die Hoehe - und der
 * gehoert in eine eigene Runde, weil er den Umriss unter den Namen
 * schiebt und `lesbarkeit` darueber zu urteilen hat. */
</style></head>
<body><!-- Der Glanz der Aufkleber (Q28). EIN Verlauf fuer alle: eine
     Verlaufsmarke gilt im Dokument, nicht im einzelnen SVG, und eine
     Kopie je Aufkleber waere bei sechzig Aufklebern sechzig Kopien
     derselben vier Zeilen. `objectBoundingBox` ist die Voreinstellung -
     der Verlauf passt sich damit jedem Rahmen an, und die Rahmen dieser
     App unterscheiden sich um mehr als das Tausendfache. -->
<svg id="kleberdefs" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="glanz" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0" stop-color="var(--glanz-licht)" stop-opacity=".5"/>
    <stop offset=".42" stop-color="var(--glanz-licht)" stop-opacity=".08"/>
    <stop offset=".44" stop-color="var(--glanz-licht)" stop-opacity="0"/>
  </linearGradient>
</defs></svg>
<div id="buehne"></div><div id="fassung"></div>
