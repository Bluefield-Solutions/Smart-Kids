   Entscheidung wie beim Mikrofon im Sprachmodus). */
/* „Ganze Karte" steht nur da, wenn etwas zurueckzustellen ist.
   Die Regel hing am Kartenkasten als VORFAHR - seit Q33 sind die Knoepfe
   seine Geschwister, und der Kasten daneben ist `.feld`. Ohne diesen
   Umbau stuende der dritte Knopf immer da, auch ungezoomt. */
.feld:not(:has(.karte[data-lupe]:not([data-lupe=""]))) .lupenknopf.ganz{display:none}
/* NUR die Gebiete und ihre Trefferkreise nehmen den Finger an. Alles
   andere in der Karte ist Schmuck.
   Ohne diese Regel lag der pulsierende Ring um das gesuchte Gebiet
   (`fill:none`, aber ein bis zu 9 Punkte breiter Strich) UEBER der Flaeche
   und fing den Zug ab: `elementFromPoint` lieferte `path.zielpuls`, das ist
   weder ein Gebiet noch ein Kreis, und `bewerte()` lief gar nicht erst an.
   Die richtige Antwort wurde nicht als falsch gewertet - es passierte
   ueberhaupt nichts. Kein Protokolleintrag, kein Hinweis, keine Bewegung.
   Ausgerechnet die Hervorhebung, die zeigen soll, wohin man ziehen muss,
   hat das Ziel bewacht. */
.karte svg *{pointer-events:none}
.karte svg path.geb,
.karte svg #treffer circle{pointer-events:all}
.karte path.geb{transition:fill var(--d-zustand) var(--k-standard)}
.karte path.ziel{fill:var(--ziel)}
/* Alles ausser dem gesuchten Gebiet tritt zurueck. Bei sieben gleich hellen
   Pastellflaechen ist sonst nicht zu erkennen, welche gemeint ist. */
/* Die Nachbarn treten zurueck - aber nur so weit, dass die Karte noch
   nach Karte aussieht. Bei 0,42 Deckkraft und 0,35 Saettigung war die
   ganze neue Farbigkeit wieder weg; das Ziel traegt seine Auffaelligkeit
   inzwischen selbst (kraeftiges Blau, dunkler Rand, Puls, Zeiger). */
.karte path.geb.ruhig{opacity:.78;filter:saturate(.72)}
/* Was schon sass, bleibt in voller Farbe stehen. Die Karte fuellt sich,
   waehrend gespielt wird - das ist der Fortschritt, den ein Kind sieht,
   ohne eine Zahl lesen zu muessen. */
.karte path.geb.gesessen{opacity:1;filter:none}
/* Was gerade unter dem Finger liegt, leuchtet auf.
   Die Nachsicht beim Ziehen (60 Bildpunkte Umkreis) darf keine Zauberei
   sein: das Kind muss VOR dem Loslassen sehen, was gelten wird. Ohne diese
   Anzeige waere die Nachsicht nur ein Wuerfel, den niemand sieht. Der
   Rahmen liegt aussen an (`paint-order`), damit er die Flaeche nicht
   verkleinert, und er wird NICHT mitskaliert - sonst ist er auf der
   Weltkarte ein Haar und auf Bremen ein Balken. */
.karte path.geb.drueber{fill:var(--drueber);opacity:1;filter:none;
  stroke:var(--drueber-rand);stroke-width:var(--strich-stark);
  vector-effect:non-scaling-stroke;paint-order:stroke fill}
.karte .haken{pointer-events:none;animation:haken-auf var(--d-belohnung) var(--k-standard)}
/* Der Name am Ort. Erscheint erst NACH der richtigen Antwort - vorher waere
   er die Antwort. */
.karte #fahne{pointer-events:none;animation:fahne-auf var(--d-belohnung) var(--k-standard) both}
@keyframes fahne-auf{0%{opacity:0}40%{opacity:0}100%{opacity:1}}
.karte .fahnentext{font-family:var(--f-lesen);font-weight:700;fill:var(--papier)}
.karte .fahnenrand{fill:var(--tinte);stroke:var(--papier);
  stroke-width:var(--strich-stark);vector-effect:non-scaling-stroke;paint-order:stroke fill}
.karte .fahnenlinie{stroke:var(--tinte);stroke-width:var(--strich-kueste);
  vector-effect:non-scaling-stroke;stroke-linecap:round}
.karte .fahnenpunkt{fill:var(--tinte);stroke:var(--papier);
  stroke-width:var(--strich);vector-effect:non-scaling-stroke}
/* Die Nadel: ein Gebiet, das kleiner ist als eine Fingerkuppe, bekommt
   seine Trefferflaeche NEBEN der Karte, mit einem Faden dorthin. Das
   Konzept sagt es seit K3, Kapitel 5.4: „mindestens 44 x 44 Punkte, bei
   Bedarf mit einer duennen Leitlinie zum echten Gebiet." */
/* Faden, Fuss und Kopf sind BILD, nicht Bedienung: `pointer-events:none`.
   Ohne das schluckt der Faden genau den Tipp, fuer den er da ist - er
   beginnt am Anker, liegt dort ueber dem kleinen Trefferkreis, und ein
   Klick auf das Gebiet traf dann weder Kreis noch Flaeche. */
/* Duenn und halb durchsichtig, nicht so kraeftig wie eine Kueste: sieben
   Faeden treffen sich auf der Nordamerikakarte in Mittelamerika, und
   genau dort steht auch die gesuchte Flaeche. Mit 3 px in voller Deckung
   (der ersten Fassung) lag ueber der Landenge ein Gitter. */
.karte .nadelfaden{stroke:var(--tinte);stroke-width:var(--strich);
  vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.55;
  pointer-events:none}
.karte .nadelfuss{fill:var(--tinte);pointer-events:none}
.karte .nadelkopf{stroke:var(--tinte);stroke-width:var(--strich);
  vector-effect:non-scaling-stroke;pointer-events:none}
/* Der Faden des GESUCHTEN Gebiets: er fuehrt vom Zeiger zu der Flaeche,
   auf die man ablegt. Er traegt dieselbe Farbe wie der Zielrand und sagt
   damit nichts, was der nicht schon sagt. */
.karte .nadelfaden.nadelziel{stroke:var(--akzent);opacity:1;
  stroke-width:var(--strich-stark)}
.karte .nadelfuss.nadelziel{fill:var(--akzent)}
.karte .nadelkopf.nadelziel{stroke:var(--akzent);stroke-width:var(--strich-stark)}
@keyframes haken-auf{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
.karte path.treffer{fill:var(--treffer);opacity:1;filter:none}
.karte .zielrand{opacity:.9}
.karte .zielpuls{animation:pulsrand var(--d-puls) ease-in-out infinite}
@keyframes pulsrand{
  0%,100%{stroke-width:3;stroke-opacity:.95}
  50%    {stroke-width:9;stroke-opacity:.15}
}
.karte .zeiger{animation:huepfen var(--d-puls) ease-in-out infinite;pointer-events:none}
@keyframes huepfen{0%,100%{translate:0 0}50%{translate:0 -6px}}
.seite{flex:none;display:flex;flex-direction:column;gap:var(--r2);min-height:0;
  /* "safe center" statt "center": laeuft der Inhalt ueber, rutscht er sonst
     ueber die OBERE Kante hinaus - im Querformat lag das erste Etikett dann
     unter der Kopfleiste, und der Finger traf die Leiste statt das Etikett. */
  justify-content:center;justify-content:safe center}
@media (orientation:landscape){.seite{width:min(38vw,300px)}}
/* Im kurzen Querformat steht das Mikrofon NEBEN der Liste statt darunter.
   Es kostete 68 der 210 Punkte, die den Antworten ueberhaupt blieben -
   deshalb war die vierte abgeschnitten. Die Breite dafuer kommt aus der
   Karte, die dort 44 % ihrer Flaeche ungenutzt liess.

   Seit A4 sind es 38vw statt 46. Gemessen auf 844 x 390, Fionas
   Weltkarte:

       46vw / 392px   Karte 444 x 241
       42vw / 356px   Karte 478 x 259
       38vw / 320px   Karte 512 x 278   <- hier
       34vw / 286px   Karte 539 x 280

   Bei 38vw ist die Karte 278 hoch und damit an ihrer HOEHENgrenze
   angekommen - weitere Breite macht sie nicht mehr groesser, sie liesse
   nur wieder Luft an den Seiten. Genau deshalb steht hier 38 und nicht 34.

   Und deshalb ein BODEN von 307 Punkten. `min(38vw,320px)` allein hat
   `passt` sofort rot gemacht: auf dem iPhone SE quer (667 breit) sind
   38vw nur 253 Punkte, und „Mecklenburg-Vorpommern" stand dann 10 Punkte
   ueber seinen eigenen Knopf hinaus, „Suedamerika" zwei. 307 ist genau
   das, was die Spalte dort vorher hatte - das kleinste Geraet behaelt
   also seine Breite, und nur das groessere gibt etwas an die Karte ab.
   Nicht geschaetzt: 46vw von 667 sind 307.

   Was dieser Schritt NICHT tut: den Laenderkarten helfen. Nordamerika
   bleibt bei jeder Spaltenbreite 352 x 280, weil es schon an der Hoehe
   haengt - und deshalb bleiben dort auch die sieben Nadeln und der Faden
   von 154 Punkten. Die Vermutung, eine schmalere Spalte wuerde die Nadeln
   erledigen, hat die Messung widerlegt. */
@media (orientation:landscape) and (max-height:440px){
  /* Breiter als bis Q14 - und es kostet die Karte NICHTS.
     Gemessen auf 844x390 mit Leiste: die Karte zeichnet 191x246, ob die
     Spalte 320 oder 380 Punkte breit ist. Sie haengt an der HOEHE, nicht
     an der Breite; die zwanzig bis sechzig Punkte, die die Spalte mehr
     nimmt, hat die Karte vorher nicht gebraucht.
     Was es dagegen bringt: die Etiketten sind 242 statt 182 Punkte breit,
     der Text darin hat 210 statt 150. Damit bricht nur noch der eine
     wirklich lange Name um („Mecklenburg-Vorpommern"), und ein paar
     Punkte Unterschied zwischen zwei Browsern koennen keinen zweiten
     Umbruch mehr ausloesen. Genau daran ist die Auslieferung gescheitert:
     auf dem Runner brach ein zweiter Name um, die Spalte wurde 252 statt
     226 Punkte hoch, passte nicht mehr in die 243 des Feldes, bekam einen
     Rollbalken - und der Rollbalken machte die Etiketten noch schmaler.
     Das kleinste Geraet (iPhone SE quer) behaelt seine 307: 45 vw sind
     dort 300 und werden nach oben geklemmt. */
  .seite{width:clamp(307px,45vw,380px);flex-direction:row;align-items:stretch;gap:var(--r2)}
  /* Enger als sonst - und das ist kein Geschmack, sondern eine gemessene
     Notwendigkeit (Q14).
     Auf dem Zielgeraet stand die Antwortspalte 226 Punkte hoch in einem
     Feld von 243. Siebzehn Punkte Luft klingen nach genug; sie sind es
     nicht, weil hier eine SCHLEIFE haengt: wird die Spalte zu hoch,
     erscheint ein Rollbalken, der Rollbalken nimmt Breite, die schmaleren
     Etiketten brechen um, und der Umbruch macht die Spalte noch hoeher.
     Auf dem Runner (Chromium 151) war genau das zu sehen - Etiketten
     176 statt 182 Punkte breit, die Spalte 252 statt 226 hoch, und ihr
     Kopf schob sich 13 Punkte in die Frage hinein.
     Vier Punkte weniger Abstand je Etikett und kein Polster: das sind
     sechzehn Punkte, und damit steht die Spalte auch dann noch frei, wenn
     eine Antwort mehr umbricht als hier. */
  .wahlliste{flex:1;min-width:0;gap:var(--r2);padding:0}
  /* `flex-direction` und `justify-content` stehen seit G16 in der
     Grundregel - sie galten hier schon, gelten jetzt ueberall, und was
     zweimal dasteht, veraltet einmal (Regel 6). Was BLEIBT, ist das
     fehlende Polster: auf 390 Punkten Hoehe zaehlt jeder. */
  .werkzeug{flex:none;padding-top:0}
}
@media (orientation:portrait){.seite{width:100%;flex:0 0 auto;max-height:56vh;overflow:auto}
  /* Sonst wird aus "Berlin" ein 784 Punkte breiter Balken mit einem Wort
     in der Mitte. Gleich breite Antworten sind richtig - beliebig breite
     nicht. */
  .wahlliste{max-width:560px;width:100%;margin-inline:auto}}

.frage{font-family:var(--f-ui);font-size:var(--s1);font-weight:700;text-align:center;
  padding:0 var(--r4) var(--r2)}

.etikett{position:relative;font-family:var(--f-lesen);font-size:var(--s1);font-weight:700;
  color:var(--auf-flaeche);background:var(--primaer);
  border:var(--strich) solid var(--primaer-rand);border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);min-height:56px;display:flex;align-items:center;justify-content:center;
  text-align:center;hyphens:auto;overflow-wrap:break-word;
  box-shadow:0 var(--kante) 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  cursor:grab;touch-action:none;
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard),
             background var(--d-zustand) var(--k-standard),
             border-color var(--d-zustand) var(--k-standard),
             opacity var(--d-zustand) var(--k-standard)}
.etikett:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.etikett:hover{box-shadow:0 var(--kante) 0 var(--primaer-kante),
  inset 0 var(--strich) 0 var(--knopf-licht),0 0 0 var(--ring) var(--akzent-h)}}
/* Beim Ziehen haengt das Etikett am Finger: hoehere Kante, kein Uebergang. */
/* `pointer-events:none` ist hier die halbe Reparatur: das Etikett haengt
   am Finger und stand damit bei JEDEM Treffertest im Weg. Solange es
   anfassbar war, konnte waehrend des Zuges nichts unter dem Finger
   gefunden werden - also gab es auch nichts aufzuleuchten. */
/* Am Finger ist es ein SCHILD, keine Kachel: einzeilig, enger gesetzt,
   kleinere Schrift. Es haengt unter dem Finger, und darueber muss die
   Karte zu sehen bleiben - sonst zieht das Kind blind. */
.etikett.zieht{transform:none;box-shadow:0 var(--kante-hoch) 0 var(--primaer-kante),
  inset 0 var(--strich) 0 var(--knopf-licht);z-index:50;cursor:grabbing;
  transition:none;pointer-events:none;
  white-space:nowrap;font-size:var(--s0);padding:var(--r3) var(--r5);
  min-height:0;width:auto;justify-content:center}
.etikett.weg{visibility:hidden;pointer-events:none}
/* Was nach der Aufgabe stehen bleibt, ruht (G18).
 *
 * Die uebrigen Antwortknoepfe waren im Lob nicht zu unterscheiden von
 * denen, auf die man tippen soll: Deckkraft 1, voller Griff, volle Kante.
 * Ein Griff darauf verschwand still in `if (erledigt) return`.
 *
 * Was hier zurueckgenommen wird, ist genau das, was „druecken" verspricht:
 * die KANTE (ein Knopf ohne Tiefe sieht nicht mehr nach Knopf aus) und
 * ein Teil der Farbe. Der Kasten bleibt, wo er ist - er soll nicht
 * verschwinden, sonst springt die Liste und die Karte darunter wandert
 * mitten im Lob.
 *
 * `pointer-events:none` ist dabei nicht die Reparatur, sondern die
 * Ehrlichkeit: der Griff war schon vorher wirkungslos, jetzt sieht man
 * es. Und der Uebergang laeuft ueber `--d-zustand`, das unter
 * `prefers-reduced-motion` auf 1 ms steht - kein zweiter Schalter, den
 * man vergessen kann. */
/* G18c: ein ABGESCHALTETER Knopf sieht auch abgeschaltet aus.
 *
 * G18 hat `.etikett` und `.zahl` erfasst - die Antwortknöpfe. Der grosse
 * Knopf daneben („Prüfen") wurde nie erfasst, weil `.knopf[disabled]`
 * nirgends stand: nach der Antwort blieb er sattblau und sah aus, als
 * liesse sich noch einmal prüfen. Aufgefallen ist das bei den falschen
 * Freunden (E10), auf einem Bildschirm, dessen Hauptknopf genau dieser
 * ist - vorhanden war es überall.
 *
 * Es haengt am ZUSTAND des Knopfes und nicht an `[data-fertig]`: ein
 * Knopf, der `disabled` traegt, ist verbraucht, egal warum. Das ist
 * dieselbe Ehrlichkeit wie bei G18 - der Griff war schon vorher
 * wirkungslos, jetzt sieht man es. */
.knopf[disabled]{opacity:.42;box-shadow:none;pointer-events:none;
  transform:translateY(var(--kante));animation:none}
[data-fertig] .etikett:not(.weg),
[data-fertig] .zahl{opacity:.42;box-shadow:none;pointer-events:none;
  transform:translateY(var(--kante));
  /* `animation:none` ist hier kein Schoenheitsfehler, sondern der Grund,
     warum die Zeile darueber ueberhaupt wirkt: die Etiketten laufen mit
     `animation: herein ... both` ein, und ein Animationswert schlaegt in
     der Kaskade eine gewoehnliche Deklaration. Ohne diese Zeile blieb die
     Deckkraft auf 1 - gemessen, nicht vermutet: „Griff none, Kante nein,
     Deckkraft 1". Der Griff war weg, das Aussehen nicht. */
  animation:none}
/* Falsch: das Etikett faehrt zurueck und WACKELT. Vorher passierte am
   Etikett gar nichts - es kam nur ein Satz darunter, und das Kind sah
   nicht, dass seine Antwort abgelehnt worden war. */
.etikett.falsch{background:var(--abgelehnt);border-color:var(--warn);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@keyframes wackeln{
  0%,100%{translate:0}
  15%{translate:-7px} 35%{translate:6px} 55%{translate:-4px} 75%{translate:2px}
}
@media (prefers-reduced-motion:reduce){.etikett.falsch{animation:none}}

/* --- Rechnen: die Aufgabe ohne Karte ---------------------------------
   Die Rechnung steht in der Kinderschrift und so gross, wie der Platz es
   hergibt - sie IST der Bildschirm, nicht seine Ueberschrift. Die vier
   Zahlen darunter tragen dieselbe Tiefe wie ein Antwort-Etikett auf der
   Karte: es ist derselbe Griff, nur ohne Ort. */
.rechenfeld{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:safe center;gap:var(--r6);padding:0 var(--r4) var(--r4);min-height:0}
.rechnung{font-family:var(--f-lesen);font-weight:700;font-size:var(--s5);
  line-height:1;color:var(--tinte);display:flex;align-items:center;gap:var(--r3);
  font-variant-numeric:tabular-nums}
.luecke{display:inline-flex;align-items:center;justify-content:center;
  min-width:1.4em;padding:0 var(--r2);border-radius:var(--rund-karte);
  border:var(--strich-stark) dashed var(--primaer-rand);color:var(--tinte-3)}
.luecke.gefuellt{border-style:solid;border-color:var(--gut);
  background:var(--gut-h);color:var(--tinte)}
.zahlen{display:flex;gap:var(--r4);flex-wrap:wrap;justify-content:center}
.zahl{font-family:var(--f-lesen);font-size:var(--s3);font-weight:700;
  color:var(--auf-flaeche);background:var(--primaer);
  border:var(--strich) solid var(--primaer-rand);border-radius:var(--rund-karte);
  min-width:88px;min-height:72px;padding:var(--r3) var(--r4);cursor:pointer;
  font-variant-numeric:tabular-nums;
  box-shadow:0 var(--kante) 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  transition:transform var(--d-tipp) var(--k-standard),
             box-shadow var(--d-tipp) var(--k-standard),
             background var(--d-zustand) var(--k-standard)}
.zahl:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--primaer-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
.zahl[disabled]{opacity:.45;cursor:default}
.zahl.stimmt{background:var(--gut-h);border-color:var(--gut);opacity:1}
.zahl.falsch{background:var(--abgelehnt);border-color:var(--warn);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@media (prefers-reduced-motion:reduce){.zahl.falsch{animation:none}}
/* Wer das Ergebnis SCHREIBT, braucht kein Feld über die ganze Zeile: die
   Antwort ist höchstens dreistellig. Ein breites Feld lädt zu einem Satz
   ein, und die Zahl steht dann verloren darin — deshalb hier `width:auto`
   gegen das `width:100%` des allgemeinen Eingabefelds. */
.tippfeld{display:flex;gap:var(--r4);align-items:stretch;justify-content:center;flex-wrap:wrap}
.tippfeld .eingabe{width:auto;min-width:150px;min-height:72px;font-size:var(--s3);
  font-variant-numeric:tabular-nums}
.tippfeld .knopf{min-height:72px}
/* Dasselbe Wackeln wie bei der falschen Zahl. Eine geschriebene Antwort,
   die nur mit einem Satz abgelehnt wird, sieht aus, als sei sie gar nicht
   angekommen. */
.eingabe.falsch{border-color:var(--warn);background:var(--abgelehnt);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@media (prefers-reduced-motion:reduce){.eingabe.falsch{animation:none}}
/* Der Regler im Elternbereich. Er ist erst dann einer, wenn man ihn mit
   dem Daumen trifft: 44 Punkte hoch, dieselbe Grenze wie bei den
   Trefferflächen auf der Karte. */
.reihe.regler{gap:var(--r4);align-items:center}
.reihe.regler input[type=range]{flex:1;min-width:160px;max-width:280px;height:44px;
  accent-color:var(--akzent);cursor:pointer}
/* Der Aufkleber einer Rechenaufgabe: die Aufgabe selbst, dort wo bei einer
   Karte der Umriss steht. Kein neues Bild, und wiedererkennbar. */
.rechenkleber{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
  font-family:var(--f-lesen);font-weight:700;font-size:var(--s1);
  color:var(--auf-flaeche);background:color-mix(in oklab, var(--ton) 34%, var(--papier));
  border-radius:var(--rund-klein);font-variant-numeric:tabular-nums}
/* Der OFFENE Rechenkleber: dunklere Tinte als `--tinte-3` (Q35).
   Gemessen, seit `lesbarkeit` ein Buch mit Inhalt sieht: „1 + 4" stand mit
   2,22:1 auf dem grauen Kasten, noetig sind 3:1 fuer grosse Schrift - und
   die 72 % Deckung des offenen Aufklebers rechnen da schon mit. Blass
   bleibt er trotzdem: die Deckung macht das Zurueckgenommene, nicht eine
   Tinte, die man nicht mehr lesen kann. */
.aufkleber:not(.da) .rechenkleber{background:color-mix(in oklab, var(--linie) 55%, var(--papier));color:var(--tinte-2)}
/* ---- Englisch: Hoeren und zeigen (E3) ---------------------------------
   Vier Karten, eine richtig - derselbe Griff wie bei den vier Zahlen des
   Rechenblatts. Was anders ist, ist der GRUND, und er steckt in einer
   einzigen Zeile: die Karte ist PAPIERFARBEN, nicht `--primaer`.

   Eine Farbaufgabe auf einem blauen Knopf misst nicht mehr, was sie soll.
   „Ist das blau?" haengt daran, worauf es liegt; zehn Farbflecken auf zehn
   blauen Kaesten sind zehn Mischungen. Der neutrale Grund ist hier keine
   Gestaltung, sondern Teil der Aufgabe - so wie der weisse Rand um einen
   Aufkleber. */
.englischfeld{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:safe center;gap:var(--r6);padding:0 var(--r4) var(--r4);min-height:0}
.engwahl{display:flex;gap:var(--r4);flex-wrap:wrap;justify-content:center}
.engkarte{display:flex;align-items:center;justify-content:center;
  background:var(--papier);border:var(--strich) solid var(--linie);
  border-radius:var(--rund-karte);min-width:124px;min-height:124px;
  padding:var(--r3);cursor:pointer;
  box-shadow:0 var(--kante) 0 var(--linie),inset 0 var(--strich) 0 var(--knopf-licht);
  transition:transform var(--d-tipp) var(--k-standard),
             box-shadow var(--d-tipp) var(--k-standard),
             background var(--d-zustand) var(--k-standard)}
.engkarte:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--linie),inset 0 var(--strich) 0 var(--knopf-licht)}
/* VERBRAUCHT ohne Deckung - und das ist der eine Punkt, an dem diese
   Karte nicht so aussehen darf wie eine Zahl (G18).
   Ueberall sonst heisst „schon benutzt" halbe Deckung: der Knopf tritt
   zurueck und sieht nicht mehr greifbar aus. Hier zerstoert genau das den
   Lerninhalt - ein Farbfleck mit 45 % Deckung ist eine ANDERE Farbe. Am
   Bild gesehen und nicht gerechnet: nach der Antwort war Gruen ein
   Mintton, Rot ein Rosa, und Grau von Weiss nicht mehr zu unterscheiden.
   Ein Kind, das danach noch einmal hinsieht, lernt die falsche Farbe.
   Zurueck tritt deshalb der KASTEN - Rand, Kante und Grund gehen in den
   Bildschirmgrund -, der Fleck behaelt seine Farbe. */
.engkarte[disabled]{cursor:default}
.engkarte[disabled]:not(.stimmt){box-shadow:none;pointer-events:none;
  transform:translateY(var(--kante));
  background:var(--grund);border-color:var(--grund);animation:none}
.engkarte.stimmt{background:var(--gut-h);border-color:var(--gut);opacity:1}
.engkarte.falsch{background:var(--abgelehnt);border-color:var(--warn);
  animation:wackeln var(--d-wackeln) var(--k-standard)}
@media (prefers-reduced-motion:reduce){.engkarte.falsch{animation:none}}
/* Der Farbfleck traegt IMMER einen dunklen Ring - nicht nur `white`.
   Ein Ring nur ums Weisse waere ein zweites Merkmal, an dem man „white"
   erkennt, ohne die Farbe zu kennen. Er ist rund, weil ein Quadrat auf
   einer eckigen Karte mit ihr verschmilzt. */
.farbfleck{display:block;width:76px;height:76px;border-radius:50%;
  background:var(--farbton);border:var(--strich-stark) solid var(--tinte-3)}
.ziffernbild{font-family:var(--f-lesen);font-weight:700;font-size:var(--s4);
  line-height:1;color:var(--tinte);font-variant-numeric:tabular-nums}
/* Der Aufkleber einer englischen Zahl - dieselbe Bauart wie
   `.rechenkleber` und deshalb daran angehaengt statt daneben geschrieben.
   Der Farbfleck braucht das nicht: er ist im Buch dasselbe Bild wie in der
   Aufgabe, nur kleiner. */
.ziffernkleber{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
  font-family:var(--f-lesen);font-weight:700;font-size:var(--s1);
  color:var(--auf-flaeche);background:color-mix(in oklab, var(--ton) 34%, var(--papier));
  border-radius:var(--rund-klein);font-variant-numeric:tabular-nums}
.aufkleber:not(.da) .ziffernkleber{background:color-mix(in oklab, var(--linie) 55%, var(--papier));color:var(--tinte-2)}
/* Im Buch und im Vorlauf ist der Fleck kein Kreis, sondern eine FLAECHE -
   dieselbe Form wie der Rechen- und der Ziffernaufkleber daneben. Der
   Aufkleber IST die Farbe.
   Der erste Anlauf behielt den Kreis und liess ihn ueber `aspect-ratio`
   mitwachsen. Das geht nicht auf: die Hoehe kommt aus dem Flexlauf, die
   Breite aus dem Seitenverhaeltnis, und hochkant wurden daraus 82 Punkte
   in einer 56 Punkte breiten Karte - `passt` meldete „13 px ueber den Rand
   des eigenen Knopfes". Ein `max-width` darauf macht daraus ein Ei.
   Eine Flaeche hat das Problem nicht, und sie ist ausserdem die richtige
   Form: neben fuenfzehn Ziffernkacheln stand ein Kreis wie ein Fremdkoerper. */
.aufkleber .farbfleck{width:100%;height:auto;flex:1 1 0;min-height:0;
  border-radius:var(--rund-klein)}
.aufkleber:not(.da) .farbfleck{opacity:.35}
/* ---- Wendungen (E11) und Hören und schreiben (E12) ---------------------
   Hier ist das breite Feld richtig, anders als bei den falschen Freunden:
   gesucht ist ein GANZER SATZ, und ein schmales Feld lüde zu einem Wort
   ein. `max-width` haelt es trotzdem beisammen - über die volle Breite
   eines iPads gezogen liest sich kein Satz mehr.
   Der deutsche Satz steht darüber und zurückgenommen: er ist die Vorlage,
   gearbeitet wird am englischen. Bei E12 fehlt er ganz — dort IST der Ton
   die Aufgabe. */
.satzfeld{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:safe center;gap:var(--r4);padding:0 var(--r4) var(--r4);min-height:0}
.satzdeutsch{font-size:var(--s2);color:var(--tinte);text-align:center;max-width:32ch}
.satzfeld .satz-eingabe{width:min(100%,34ch);font-size:var(--s1);text-align:left;
  padding:var(--r2) var(--r3);min-height:56px}
/* ---- Falsche Freunde (E10) --------------------------------------------
   Zwei Zeilen uebereinander: der deutsche Satz zurueckgenommen, der
   englische gross. Das ist die Rangfolge der Aufgabe - der deutsche Satz
   ist die Vorlage, der englische das, woran gearbeitet wird.

   Das Eingabefeld sitzt IN der Zeile, nicht darunter: es ist die Luecke.
   `width` waechst deshalb mit dem Inhalt und ist nicht die volle Breite -
   ein Feld ueber die ganze Zeile laedt zu einem Satz ein, gesucht ist ein
   Wort. Die 8 Zeichen sind das laengste erwartete („sensitive" hat neun,
   das Feld waechst mit). */
.freundefeld{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:safe center;gap:var(--r4);padding:0 var(--r4) var(--r4);min-height:0}
.freundsatz{font-size:var(--s1);color:var(--tinte-2);text-align:center;
  max-width:36ch}
/* Der englische Satz ist FLIESSTEXT, kein Flexlauf.
   Der erste Anlauf machte ihn zu `display:flex` mit Umbruch - und weil das
   Eingabefeld von `.eingabe` `width:100%` erbt, sprang es auf eine eigene
   Zeile und zerriss den Satz in drei Teile. Genau das, was diese Aufgabe
   nicht sein darf: die Luecke sitzt IM Satz, sonst ist sie ein Formular.
   `display:block` und ein `inline-block`-Feld halten sie darin. */
.freundluecke{font-family:var(--f-lesen);font-size:var(--s2);color:var(--tinte);
  text-align:center;max-width:34ch;line-height:2;display:block}
/* ZWEI Klassen im Selektor, und das ist noetig: `.eingabe` traegt
   `width:100%` und steht im Stilblatt WEITER UNTEN. Bei gleicher
   Spezifitaet gewinnt die spaetere Regel - der erste Anlauf schrieb
   `.wort-eingabe` allein hin, und das Feld blieb ueber die volle Breite.
   Auf dem Bildschirm sah man den Satz in drei Zeilen zerrissen; im
   Stilblatt sah man gar nichts. */
/* Die Breite ist FEST und fuer alle dreissig gleich - 15 Zeichen, so
   breit wie die laengste Antwort („grammar school", 14). Sie waechst NICHT
   mit dem gesuchten Wort: ein Feld, das so breit ist wie die Loesung,
   verraet ihre Laenge, und bei „set menu" gegen „menu" ist das schon die
   halbe Antwort.
   `width:auto` taugt hier nicht - ein `input` faellt damit auf seine
   Voreinstellung von zwanzig Zeichen zurueck, und das sah aus wie ein
   Feld ueber die ganze Zeile. */
.freundluecke .wort-eingabe{display:inline-block;width:15ch;
  font-size:inherit;text-align:center;padding:0 var(--r2);min-height:44px;
  vertical-align:baseline;border-width:var(--strich)}
.freundluecke .luecke{font-family:var(--f-lesen);font-size:inherit;
  min-width:15ch;vertical-align:baseline}
/* Der Aufkleber eines falschen Freundes: das englische Wort. Dieselbe
   Bauart wie der Rechen- und der Ziffernaufkleber - was hier klebt, ist ein
   Wort und kein Umriss, und drei Formen fuer dieselbe Sache waeren zwei zu
   viel. Kleiner gesetzt, weil „grammar school" hineinpassen muss. */
.wortkleber{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
  font-family:var(--f-lesen);font-weight:700;font-size:var(--s-klein);
  color:var(--auf-flaeche);background:color-mix(in oklab, var(--ton) 34%, var(--papier));
  border-radius:var(--rund-klein);text-align:center;padding:0 var(--r1);
  overflow-wrap:anywhere}
.aufkleber:not(.da) .wortkleber{background:color-mix(in oklab, var(--linie) 55%, var(--papier));color:var(--tinte-2)}
/* ---- Schreiben (N2a) --------------------------------------------------
   Die Schreibflaeche ist QUADRATISCH, und das ist keine Geschmacksfrage:
   der Kasten der Vorlage ist 100 x 100, und der Finger wird ueber
   `getBoundingClientRect` in ihn umgerechnet. Bei einem nicht
   quadratischen Feld muesste dort `preserveAspectRatio` nachgerechnet
   werden - und der Finger laege systematisch daneben, ohne dass man es
   dem Bild ansieht.
   `touch-action:none` ist ebenso Pflicht: sonst scrollt das Telefon die
   Seite, waehrend das Kind schreibt. */
.schreibraum{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--r2)}
.schreibfeld{flex:1;display:flex;align-items:center;justify-content:center;
  min-height:0;padding:0 var(--r4) var(--r2)}
/* Der Rahmen ist ein DIV, nicht das SVG.
   `aspect-ratio` auf einem SVG mit viewBox tut in Chromium nicht, was man
   denkt: gemessen kamen 820 x 180 Punkte heraus statt eines Quadrats - ein
   SVG ohne eigene Breite faellt auf 100 % zurueck, und das Verhaeltnis
   kommt nicht mehr zum Zug. Ein gewoehnlicher Kasten haelt es zuverlaessig,
   und das SVG fuellt ihn. */
/* Ein oder ZWEI Blaetter nebeneinander (N4): die Zahl 14 wird als 1 und 4
   geschrieben, jede Ziffer in ihr eigenes Feld. Damit ist „beide Ziffern,
   richtige Reihenfolge" ein Aufbau und keine Pruefung.
   Die Kaesten teilen sich die Breite und behalten ihr Quadrat; wird es
   eng, gibt die Hoehe nach - `max-height` statt `height`, sonst haelt das
   Verhaeltnis die Breite fest und zwei Kaesten laufen aus dem Bild. */
.blaetter{display:flex;height:100%;gap:var(--r3);justify-content:center;
  align-items:center;min-width:0;width:100%}
.feldkasten{aspect-ratio:1;max-height:100%;max-width:100%;flex:0 1 auto;min-width:0;
  height:100%;touch-action:none;
  background:var(--papier);border:var(--strich) solid var(--linie);
  border-radius:var(--rund-karte);overflow:hidden}
/* `.schreibblatt` und nicht `.feld`.
   Der erste Entwurf hiess `.feld` - und so heisst der Kartenbereich des
   Spielbildschirms auch. `.feld{display:block}` hat dessen `display:flex`
   ueberschrieben: die Antwortliste stand danach UNTER der Karte statt
   neben ihr und lief auf allen vier Querformaten aus dem Bild. Gefunden
   von `passt`, mit 59 Meldungen auf einmal - und keine davon nannte den
   Schreibschirm, weil der Schaden woanders lag. */
.schreibblatt{display:block;width:100%;height:100%;touch-action:none;
  cursor:crosshair;overscroll-behavior:none}
/* Ober- und Grundlinie wie im Schreibheft - sie sagen, wie hoch der
   Buchstabe wird, bevor der erste Strich da ist. */
.schreibblatt .linien line{stroke:var(--linie);stroke-width:.8;stroke-dasharray:2 3}
.vorlage path,.gemalt path,.zug{fill:none;stroke-width:9;
  stroke-linecap:round;stroke-linejoin:round}
.vorlage .spaeter{stroke:var(--linie);opacity:.55}
.vorlage .schon{stroke:var(--linie);opacity:.35}
.vorlage .dran{stroke:var(--linie-2)}
.gemalt path,.zug{stroke:var(--zugstrich)}
/* Der Punkt, an dem der naechste Zug anfaengt. Ohne ihn faengt ein Kind
   unten an und bekommt gesagt, die Richtung stimme nicht - ohne je
   erfahren zu haben, welche gemeint war. */
.anfang{fill:var(--gut)}
/* `hidden` muss hidden BEDEUTEN.
   Gefunden beim Bau des Schreibschirms, aber aelter: die Regel des
   Browsers fuer `[hidden]` ist eine Vorgabe, und JEDE eigene Regel mit
   `display` schlaegt sie. `.zahlen{display:flex}` tat genau das - Lea
   bekam beim Rechnen die vier Antwortknoepfe UND das Tippfeld zu sehen,
   obwohl das Feld ordentlich `hidden` gesetzt war.
   Kein Tor konnte das sehen: `passt` misst Ueberlauf, der Rauchtest tippt
   ins Eingabefeld und kommt damit durch, und die einzige Aufnahme eines
   Rechenbildschirms ist Fionas - sie hat gar kein Tippfeld.
   Deshalb hier, einmal und mit Nachdruck, fuer alles. */
[hidden]{display:none!important}
/* Vormachen: jeder Zug wird gemalt, einer nach dem anderen. `pathLength`
   im Markup macht die Strichlaenge unabhaengig von der echten Laenge -
   sonst liefe der lange Zug eines S genauso schnell wie der Balken eines A.
   Dauer und Versatz kommen aus dem Programm (VORMACHEN_JE_ZUG), damit die
   Wartezeit danach und die Malzeit nicht getrennt veralten. */
.vorlage .malt{stroke:var(--zugstrich);stroke-dasharray:100;stroke-dashoffset:100;
  animation-name:malen;animation-timing-function:var(--k-standard);
  animation-fill-mode:forwards}
@keyframes malen{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .vorlage .malt{animation-name:none;stroke-dashoffset:0}}
/* Der Buchstabe als Aufkleber und im Vorlauf - dieselben Zuege. */
.zeichenbild{display:block}
/* Der Elternvergleich (N1): wer in einer Zeile vorn liegt, wird markiert -
   sonst muesste man zwei Zahlen im Kopf vergleichen, und genau das soll
   die Tabelle einem abnehmen. Die Zeit steht klein darunter; sie
   entscheidet nichts und darf deshalb nicht gleich laut sein. */
#duell .fuehrt{font-weight:700;color:var(--gut)}
#duell .summe td{border-top:var(--strich-stark) solid var(--linie);font-weight:700}
#duell .dazu{display:block;font-family:var(--f-ui);font-size:var(--s-klein);
  font-weight:400;color:var(--tinte-3)}
/* Im kurzen Querformat steht das Werkzeug NEBEN dem Feld statt darunter -
   dieselbe Bewegung wie beim Mikrofon neben der Antwortliste. Gemessen:
   darunter blieben dem Feld 180 Punkte Hoehe, daneben sind es 270. */
@media (orientation:landscape) and (max-height:440px){
  /* Feld und Werkzeug stehen als PAAR in der Mitte, nicht das Feld links
     und die Knoepfe rechts am Rand. Mit `1fr` fuer die Feldspalte lagen
     zwischen beiden bis zu 200 Punkte Leere - der Bildschirm sah aus, als
     fehle etwas. Beide Spalten nehmen sich jetzt, was sie brauchen, und
     das Ganze wird zentriert. */
  .schreibraum{display:grid;grid-template-columns:auto auto;
    grid-template-rows:auto minmax(0,1fr);justify-content:center;
    column-gap:var(--r6);
    grid-template-areas:"frage frage" "feld werkzeug";align-items:center}
  .schreibraum .frage{grid-area:frage}
  /* Unten bleibt mehr Luft als die uebliche kleine: auf dem iPhone quer
     liegen dort Wischstreifen und sicherer Bereich, und ein Feld, das
     `touch-action:none` traegt, faengt genau die Geste ab, mit der man
     die App verlaesst. Gemessen: 9 Punkte Abstand waren zu wenig. */
  .schreibraum .schreibfeld{grid-area:feld;min-height:0;height:100%;
    padding-bottom:var(--r5)}
  .schreibraum .werkzeug{grid-area:werkzeug;flex-direction:column;
    justify-content:center;padding-top:0;padding-right:var(--r4)}
}
.wahlliste{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  gap:var(--r3);justify-content:center;justify-content:safe center;padding:var(--r1)}
/* „Noch einmal hoeren" - derselbe runde Knopf wie das Auge in der Kachel,
   aber in der Betonfarbe: er ist eine HILFE und keine Antwort, und er
   soll neben dem blauen Mikrofon nicht wie ein zweiter Weg aussehen. */
.werkzeug .nochhoeren{color:var(--akzent)}
/* Die Werkzeugspalte ist eine SPALTE - im Querformat, wo sie eine ist.
 *
 * Bis hierher war das hier eine Reihe mit `flex-wrap`, und nur auf dem
 * TELEFON (dem einzigen Format mit `max-height:440px`) eine Spalte. Auf
 * dem Schreibtisch, dem zweiten unterstuetzten Weg, war sie keine -
 * gemessen am gebauten Buendel:
 *
 *   Fenster     Reihen  Achsen   Kasten
 *   844x390        5      1      133 x 272   <- Telefon, eine Spalte
 *   1400x900       3      5      300 x 140   <- Schreibtisch quer
 *   700x850        2      5      668 x  84   <- Hochformat
 *
 * Fuenf Achsen heisst: fuenf Bedienelemente, fuenf verschiedene Mitten,
 * in willkuerlichen Gruppen umgebrochen. Das Grafik-Audit hat es „eine
 * Schublade, keine Spalte" genannt.
 *
 * WARUM NUR IM QUERFORMAT, und das ist gemessen und nicht gewaehlt: die
 * Spalte wird als Spalte 308 statt 84 Punkte hoch. Im Querformat steht
 * sie NEBEN der Karte und hat die Hoehe; im Hochformat steht sie UNTER
 * den Antworten und nimmt sie ihnen weg. `passt` hat genau das gemeldet -
 * „Afrika" 11 Punkte ueber den Rand der Antwortliste auf 390x844, 104 auf
 * 700x850, und dort greift das Wort zu 67 % in „Weiss ich nicht" statt in
 * den eigenen Knopf. Ein Grundriss, der auf einem Format aufgeraeumt
 * aussieht und auf einem anderen die Antworten verdeckt, ist keiner.
 *
 * Was der alte `flex-wrap` verhindern sollte (M4s), verhindert die Spalte
 * besser: der runde Knopf ragte sieben Punkte aus dem Fenster, weil vier
 * Dinge nebeneinander standen. Im Querformat steht jetzt nichts mehr
 * nebeneinander. Im Hochformat bleibt der Umbruch - und mit ihm der
 * Grund, aus dem es ihn gibt. */
.werkzeug{flex:none;display:flex;flex-wrap:wrap;gap:var(--r3);align-items:center;
  justify-content:center;padding-top:var(--r2)}
@media (orientation:landscape){
  .werkzeug{flex-direction:column;flex-wrap:nowrap;
    /* Eine Spalte hat eine Breite. Ohne Deckel war sie 668 Punkte breit -
       so breit wie das Fenster -, und der feine Strich unter „Weiss ich
       nicht" lief quer ueber den Bildschirm. Genau das, wovor der
       Kommentar an `.leise` warnt; ich hatte beim ersten Anlauf behauptet,
       das koenne hier nicht passieren, und die Messung hat mir
       widersprochen. 300 ist keine gewaehlte Zahl: so breit ist die Seite
       im Querformat ohnehin (`.seite{width:min(38vw,300px)}`). */
    max-width:300px;margin-inline:auto}
  /* Gleiche Rolle, gleiche Breite.
   *
   * „Weiss ich nicht" und „Lieber antippen" sind dasselbe Ding - ein
   * leiser Ausweg -, waren aber verschieden breit: 133 und 122 auf dem
   * Telefon, 147 und 137 auf dem Schreibtisch. Sie waren so breit wie ihr
   * Wort. Zwei gleiche Dinge in zwei Groessen sind zwei Dinge.
   *
   * Das ueberschreibt das `align-self:center` weiter unten. Dessen Grund -
   * der Strich soll unter dem WORT stehen und nicht quer ueber den
   * Bildschirm - gilt weiter und ist hier erfuellt: die Spalte ist
   * hoechstens 300 breit. In einer Reihe war sie es nicht, deshalb steht
   * diese Regel im Querformat und nicht in der Grundregel. */
  .werkzeug .leise{align-self:stretch}
}
/* Der leise Ausweg. Er soll erreichbar sein, aber nicht einladen: kein
   Fuellton, kein Rand, nur Text - und trotzdem 44 Punkte hoch, damit ein
   Daumen ihn trifft. */
/* Kachel und ihr „von vorne" gehoeren zusammen - das Raster sieht das Paar
   als EIN Feld, sonst rutscht der kleine Knopf in die naechste Spalte. */
.kachelpaar{display:flex;flex-direction:column;align-items:stretch;gap:var(--r1);min-width:0}
.kachelpaar .kachel{width:100%}
/* Die gewaehlte Stimme traegt denselben Rahmen wie ein aktiver Zustand
   sonst auch - kein neues Zeichen, nur der bekannte Ring. */
.stimmen{flex-wrap:wrap;gap:var(--r2)}
.knopf.gewaehlt{border-color:var(--akzent);
  box-shadow:0 0 0 var(--ring) var(--akzent-h),0 var(--kante-flach) 0 var(--linie-2)}
.leise.mini{min-height:32px;font-size:var(--s-klein);padding:var(--r1) var(--r2);
  align-self:center}
/* Der Ausweg („Weiss ich nicht") und der Umschalter („Lieber antippen").
 *
 * Sie sind mit Absicht KEIN Knopf: sie stehen neben vier Antworten, und
 * eine fuenfte Pille daneben waere eine fuenfte Antwort. Sie sind aber
 * auch kein Link in einem Text - der Unterstrich war das letzte Stueck
 * Netzseite in einer App voller Gegenstaende (Q15).
 *
 * Statt des Unterstrichs eine feine Linie DARUNTER, die zum Rand der
 * leisen Knoepfe passt, und beim Beruehren eine weiche Flaeche im
 * Akzentton. Damit gehoert der Ausweg sichtbar zur Werkzeugspalte, ohne
 * sich zu einer Antwort aufzublasen. */
/* Seit Q34 traegt auch der leise Knopf ein Zeichen (das Fragezeichen an
   „Weiss ich nicht"). Er war bis dahin reiner Text und lag damit auf einer
   Grundlinie; mit einem Zeichen daneben braucht er eine Achse. */
.leise{display:inline-flex;align-items:center;justify-content:center;gap:var(--r1);
  font-family:var(--f-ui);font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);background:none;border:none;
  border-bottom:var(--strich) solid var(--knopf-kante);cursor:pointer;
  min-height:44px;padding:0 var(--r2);border-radius:var(--r1);
  /* Die Linie gehoert unter das WORT, nicht unter die Spalte: in der
     Werkzeugspalte werden die Kinder gestreckt (`align-items:stretch`),
     und dann lief der Strich quer durch den halben Bildschirm. */
  align-self:center;
  transition:color var(--d-tipp) var(--k-standard),
             background var(--d-tipp) var(--k-standard),
             border-color var(--d-tipp) var(--k-standard)}
.leise:active{color:var(--tinte);background:var(--akzent-h);border-color:var(--akzent)}
@media (hover:hover){.leise:hover{color:var(--tinte);border-color:var(--akzent)}}
.frage .richtigText{color:var(--gut)}
/* Das Lob traegt die Zeile, der Name die Sache. Ein Kind liest das erste
   Wort und weiss Bescheid, bevor es den Satz zu Ende gelesen hat. */
.frage .jubel{display:block;font-size:var(--s2);font-weight:800;line-height:1.1}
/* Der Aufkleber bekommt einen eigenen Augenblick - er ist das einzige,
   was ueber diese Aufgabe hinaus bleibt. */
/* Seit Q28 steht hier der Aufkleber SELBST, mit dem Wort darunter. Der
   Kasten ist deshalb eine Spalte und nicht mehr die Pille - die Pille ist
   das `b` darin. */
/* `inline-flex`, nicht `flex`: als Block naehme der Kasten die ganze
   Breite, und seine Kinder staenden links am Rand statt in der Mitte -
   gesehen auf dem Zielgeraet, wo der Aufkleber dann am Bildrand klebte. */
.frage .neuerkleber{display:inline-flex;flex-direction:column;align-items:center;
  gap:var(--r1);margin-top:var(--r2);
  animation:kleber-auf var(--d-belohnung) var(--k-standard) both}
.frage .neuerkleber svg{height:56px;width:auto;max-width:100px}
.frage .neuerkleber .rechenkleber{font-size:var(--s1);padding:var(--r1) var(--r3)}
.frage .neuerkleber b{font-family:var(--f-lesen);font-size:var(--s0);font-weight:800;
  color:var(--auf-flaeche);background:var(--f2);
  border-radius:var(--rund-flaeche);padding:var(--r1) var(--r4)}
@keyframes kleber-auf{from{opacity:0;transform:scale(.4) rotate(-8deg)}
  to{opacity:1;transform:none}}
/* Die Aufkleber der Runde auf dem Endbildschirm - nacheinander, 90 ms
   versetzt. Nacheinander und nicht gleichzeitig, weil man drei Dinge, die
   zugleich erscheinen, als eines sieht. */
.kleberzeile{display:inline-flex;align-items:center;gap:var(--r1)}
.kleberzeile svg{height:34px;width:auto;max-width:46px;display:block}
.kleberzeile .rechenkleber{font-size:var(--s-klein);padding:0 var(--r1)}
.frischerkleber{display:inline-block;
  animation:kleber-auf var(--d-belohnung) var(--k-standard) both;
  /* `--d-staffel` ist dieselbe Marke, in der die Antworten hereinkommen -
     dieselbe Sache, also dieselbe Zahl. Und sie faellt unter
     `prefers-reduced-motion` von selbst auf null. */
  animation-delay:calc(var(--nr) * var(--d-staffel) * 2)}
/* --- Der Lohn (G14) ---------------------------------------------------
 *
 * Bis v358 passierte im wichtigsten Augenblick der App fast nichts: das
 * Lobwort wurde gruen, am Rundenende standen drei Sterne da. Sauber,
 * ruhig, erwachsen - und genau deshalb ohne den Moment, in dem eine
 * Sechsjaehrige merkt, dass sie etwas geschafft hat. Die Vorbilder aus
 * dem Genre setzen dort ihre Mittel ein, und nicht aus Spielerei: die
 * unmittelbare, deutliche Rueckmeldung ist der Teil, der Kinder
 * wiederkommen laesst.
 *
 * NUR FUER DIE KINDERPROFILE. Der Schalter ist `feier` in TON, neben
 * `siegsterne` - dort, wo diese Unterscheidung schon wohnt („kindlich
 * darf jubeln, sachlich schweigt"). Stephan und Violeta bekommen nichts
 * davon; ihre Kachel bleibt, was sie war.
 *
 * Alle Zeiten kommen aus den vorhandenen Marken (`--d-belohnung`,
 * `--d-staffel`) und nicht aus neuen Zahlen (Regel 6). Das hat einen
 * zweiten Nutzen: unter `prefers-reduced-motion` stehen diese Marken auf
 * 1 ms, also faellt die ganze Feier von selbst aus - ohne eine zweite
 * Regel, die man vergessen kann.
 *
 * Bewegt werden nur `transform`, `opacity` und `background-color`. Kein
 * Filter, kein `backdrop`: auf iOS ist das die Falle, die schon einmal
 * ein schwarzes Bild gekostet hat. */
@keyframes jubel-auf{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes lobgrund{
  0%{background-color:transparent}
  30%{background-color:color-mix(in oklch, var(--gut) 15%, transparent)}
  100%{background-color:transparent}}
@keyframes stern-landen{
  from{opacity:0;transform:scale(.35) translateY(-16px)}
  to{opacity:1;transform:none}}
@keyframes buch-winkt{0%,100%{transform:none}45%{transform:scale(1.07)}}

/* Das Farbfeld liegt auf dem Textknoten selbst, nicht auf einem
   Pseudo-Element mit `z-index:-1` - das waere hinter den Seitengrund
   gerutscht. Und es bekommt KEIN Innenmass: ein Zuschlag hier
   verschoebe den Umbruch, und `passt` misst genau das. */
.frage .richtigText.feier{border-radius:var(--r6);
  animation:lobgrund calc(var(--d-belohnung) * 2.4) var(--k-standard) both}
.frage .richtigText.feier .jubel{
  animation:jubel-auf var(--d-belohnung) var(--k-standard) both}

/* Die Sterne landen NACHEINANDER. Drei Sterne, die zugleich erscheinen,
   sieht man als einen - derselbe Grund, aus dem die Aufkleber seit je
   versetzt hereinkommen. */
.siegsterne.feier svg{animation:stern-landen var(--d-belohnung) var(--k-standard) both}
.siegsterne.feier .sterne svg:nth-child(2){animation-delay:calc(var(--d-staffel) * 2)}
.siegsterne.feier .sterne svg:nth-child(3){animation-delay:calc(var(--d-staffel) * 4)}

/* Und wohin der Aufkleber gegangen ist: der Forscherbuch-Knopf winkt
   einmal, nachdem die neuen Aufkleber gelandet sind.
   Nicht ein FLIEGENDER Aufkleber, obwohl das schoener waere: der braeuchte
   die Lage beider Elemente zur Laufzeit und ein Element, das ueber den
   Bildschirm wandert - und `passt` misst, ob etwas ueber den Rand laeuft.
   Ein Knopf, der im richtigen Augenblick winkt, sagt dasselbe und kann
   nichts kaputtmachen. Der Flug steht als eigener Punkt offen. */
.siegwahl.feier #buch{animation:buch-winkt calc(var(--d-belohnung) * 1.6)
  var(--k-standard) both; animation-delay:calc(var(--d-staffel) * 8)}

@media (prefers-reduced-motion:reduce){
  .frage .neuerkleber,.frischerkleber{animation:none}
  .frage .richtigText.feier,.frage .richtigText.feier .jubel,
  .siegsterne.feier svg,.siegwahl.feier #buch{animation:none}
}
.frage .fastText{color:var(--warn)}
.frage .loesung{color:var(--akzent)}
/* Der Nebenbei-Hinweis steht UNTER dem Haken, kleiner und leiser. */
.frage .nebenbei{display:block;font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);margin-top:var(--r1)}
.eingabe{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;background:var(--papier);
  border:var(--strich-stark) solid var(--akzent);border-radius:var(--rund-karte);padding:var(--r3) var(--r4);
  min-height:64px;width:100%;color:var(--auf-flaeche);text-align:center}
.eingabe:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 var(--ring) var(--akzent-h)}
.hinweis{font-family:var(--f-ui);font-size:var(--s0);line-height:1.4;border-radius:var(--rund-karte);
  padding:var(--r3) var(--r4);background:var(--gut-h);color:var(--auf-flaeche)}
.hinweis.nochmal{background:var(--nochmal-h)}
.reihe{display:flex;gap:var(--r2);align-items:center;justify-content:center;flex-wrap:wrap}
/* Der Weg zurueck in den Vorlauf, unter der Vorschau im Buch (Q20).
   Er steht mit Abstand da und nicht in der Ueberschrift: die Ueberschrift
   sagt, WAS als Naechstes kommt, der Knopf bietet an, es anzusehen. */
.mikro{width:76px;height:76px;border-radius:var(--rund-voll);background:var(--akzent);border:none;
  display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;position:relative}
/* Der Ring atmet NUR, waehrend wirklich zugehoert wird (F13).
   Vorher lief er immer. Die App sah damit aus, als hoerte sie zu, waehrend
   sie es nicht tat - und als hoerte sie weiter zu, nachdem sie aufgehoert
   hatte. Ein Zustand, den man sieht und der nicht stimmt, ist schlimmer
   als keiner: der Nutzer wartet auf etwas, das nicht kommt. */
/* Der Ring liegt INNEN, nicht aussen.
 *
 * Er stand auf `inset:-8px` und ragte damit acht Punkte ueber den Knopf
 * hinaus. Aufgefallen ist das erst, als der Sprachmodus ab Werk an war
 * (M4s): vorher hat `passt` den Mikrofonknopf auf keiner einzigen Groesse
 * je gesehen, weil er ohne Sprachmodus gar nicht erst erschien. Der
 * Fehler war die ganze Zeit da - gemessen wurde er nie. */
.mikro::after{content:"";position:absolute;inset:2px;border-radius:var(--rund-voll);
  border:var(--strich-kueste) solid var(--papier);opacity:.28}
.mikro.hoert::after{opacity:.3;animation:atmen var(--d-atmen) ease-in-out infinite}
/* Die beiden Knoepfe der Rueckfrage (F15).
   Sie stehen unter der Sprachzeile und muessen mit dem Daumen zu treffen
   sein wie alles andere - deshalb dieselbe Mindesthoehe wie ein Knopf und
   nicht die Groesse eines Textlinks. `flex-wrap`, weil die Werkzeugspalte
   im schmalen Querformat keine zwei Knoepfe nebeneinander fasst. */
.nachfrage{display:flex;gap:var(--r2);flex-wrap:wrap;justify-content:center;margin-top:var(--r2)}
.nachfrage button{min-height:44px;min-width:64px}
/* Und waehrend des Zuhoerens ist der Knopf ein anderer: er sagt jetzt
   „fertig", nicht mehr „sprich". */
.mikro.hoert{background:var(--gut)}
@media (prefers-reduced-motion:reduce){.mikro.hoert::after{animation:none;opacity:.45}}
@keyframes atmen{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.1}}
.tonaus{background:var(--tinte-3)}
.tonaus::after{display:none}

.gross{font-family:var(--f-ui);font-size:var(--s5);font-weight:800;letter-spacing:-.03em}
.bandhinweis{position:absolute;left:0;right:0;bottom:0;background:var(--tinte);color:var(--papier);
  font-family:var(--f-ui);font-size:var(--s-klein);padding:var(--r2) var(--r4);text-align:center}
/* --- M3 bis M6: Fortschritt, Forscherbuch, Elternbereich --- */
.balken.breit{width:min(340px,70vw)}
.balken{position:relative;width:100%;height:8px;border-radius:var(--rund-voll);
  background:var(--linie);overflow:hidden}
/* `transform:scaleX` statt `width`: eine Animation auf einer
   Layouteigenschaft laesst den Browser bei JEDEM Bild neu umbrechen. Die
   Regel steht im Projekt seit dem Grafik-Audit; hier stand sie trotzdem,
   weil das Tor `marken` nur die Entwuerfe las und nicht die App. */
.balken i{position:absolute;inset:0;display:block;height:100%;width:100%;background:var(--gut);
  border-radius:var(--rund-voll);transform-origin:left center;
  transition:transform var(--d-zustand) var(--k-standard)}
/* Zwei Streifen, zwei Bedeutungen - der helle liegt unten und ist der
   laengere: "unterwegs" schliesst "hat einen Aufkleber" mit ein. */
.balken i.unterwegs{background:color-mix(in oklab, var(--gut) 38%, var(--papier))}
.balken i.fest{background:var(--gut)}
.balken.klein{height:6px;min-width:60px}
/* Die Zeile unter dem Balken auf dem Endbildschirm: Zeichen und Zahl gross
   genug, um sie ohne Lesen zu erfassen. */
.buchstand{display:flex;align-items:center;gap:var(--r2);font-family:var(--f-ui);
  font-size:var(--s0);font-weight:700;color:var(--tinte-2)}
.buchstand .klebermarke{font-size:var(--s1)}
.buchstand .klebermarke svg{width:26px;height:26px}
.leiser{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte-3);max-width:44ch}
.siegwahl{margin-top:var(--r6)}
.fach{font-size:var(--s-klein);color:var(--tinte-3);font-weight:600;margin-left:var(--r2)}

/* Das Wartezeichen. Drei Punkte, die der Reihe nach atmen.
   Kein Wort: es erscheint fuer ein Kind, das nicht liest. */
.warten .mitte{align-items:center;justify-content:center}
.punkte{display:flex;gap:var(--r3)}
.punkte i{width:14px;height:14px;border-radius:var(--rund-voll);background:var(--akzent);
  opacity:.25;animation:atmen var(--d-warten) ease-in-out infinite}
.punkte i:nth-child(2){animation-delay:var(--d-warten-versatz)}
.punkte i:nth-child(3){animation-delay:calc(var(--d-warten-versatz) * 2)}
@keyframes atmen{0%,70%,100%{opacity:.25;transform:scale(.85)}35%{opacity:1;transform:scale(1)}}
/* Wer Bewegung abbestellt hat, bekommt sie nicht - die Punkte stehen dann
   einfach da. Sichtbar bleiben sie trotzdem, darum geht es. */
@media (prefers-reduced-motion:reduce){ .punkte i{animation:none;opacity:.6} }

.rollen{flex:1;min-height:0;overflow:auto;padding:0 var(--r4) var(--r8);
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.rollen.eltern{max-width:760px;margin:0 auto;width:100%;text-align:left}
.rollen.eltern .unter{text-align:left;max-width:62ch}
.rollen.eltern .reihe{justify-content:flex-start}
.gruppe{font-family:var(--f-ui);font-size:var(--s1);font-weight:800;margin:var(--r6) 0 var(--r3);
  letter-spacing:-.01em}
.kleber{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--r3)}
/* Groesser, seit im Buch nur noch steht, was DA ist: es sind weniger
   Stuecke, also darf jedes mehr Platz haben. Bei 104 Punkten war ein
   Umriss ein Fleck. */
.kleber.gross{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--r4)}
.kleber.gross .aufkleber svg{height:96px}
/* Die Vorschau ist kein Vorwurf: drei Stueck, kleiner, und sichtbar
   zurueckgenommen. */
.kleber.vorschau{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.kleber.vorschau .aufkleber svg{height:72px}
/* Auf Weiss traegt der Rand, auch hier (R2).
   Die Karte hatte `background:var(--papier)` und `border:none` - auf dem
   alten hellblauen Grund war sie damit eine Karte, auf Weiss ist sie
   nichts. Zu sehen war nur noch der Schatten an ihrer Unterkante, und die
   Umrisse schwebten frei im Raum. */
.aufkleber{background:var(--papier);border:var(--strich) solid var(--linie);
  border-radius:var(--rund-karte);padding:var(--r2);
  box-shadow:0 var(--kante-flach) 0 var(--tiefe-farbe);display:flex;flex-direction:column;align-items:center;
  gap:var(--r1);cursor:pointer;opacity:.72}
/* 0,45 war auf Weiss zu wenig - und schlimmer: unter 0,5 sieht
   `lesbarkeit` einen Text gar nicht erst an. Die Vorschau war damit die
   einzige Schrift der App, die NIE gemessen wurde (Regel 1). */
.aufkleber.da{opacity:1}
.aufkleber{position:relative}
.aufkleber .siegel{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;
  background:var(--gut);border:var(--strich-stark) solid var(--papier)}
.aufkleber svg{width:100%;height:64px}
/* --- Der Stanzrand (Q28) -----------------------------------------------
   Drei Striche aus EINEM Pfad, alle in Bildschirmpunkten (die Breite steht
   am Pfad selbst, `non-scaling-stroke`). Die Reihenfolge traegt die
   Wirkung: der blasse Strich liegt am weitesten aussen, der weisse
   darueber, die Flaeche zuoberst.

   Elf und acht, nicht dreizehn und zehn: gemessen auf dem Zielgeraet ist
   das Bild einer Ebenenkachel 63 Punkte hoch. Ein Rand von fuenf Punkten
   ist dort ein Sechzehntel des Bildes - sichtbar, ohne die Form zu
   fressen. Bei Bremen frisst jeder Punkt mehr davon die Form. */
.kleberschatten{fill:none;stroke:var(--tinte);stroke-opacity:.14;stroke-width:11;
  stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* `--papier` und nicht Weiss: der Aufkleber ist aus dem BOGEN gestanzt,
   sein Rand hat also die Farbe der Seite. Im dunklen Anstrich ist das
   kein Weiss mehr, und der Rand waere dort ein Leuchtstreifen. */
.kleberrand{fill:var(--papier);stroke:var(--papier);stroke-width:8;
  stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* Der Glanz ist GEBACKEN, nicht gerechnet: ein Verlauf, kein Filter.
   Regel 13 - was auf dem Schreibtisch unauffaellig ist, kann auf iOS ein
   schwarzes Bild sein, und ein `filter` ueber sechzig Aufklebern ist genau
   die Sorte Rechnung, die dort umkippt. */
.kleberglanz{fill:url(#glanz);pointer-events:none}
#kleberdefs{position:absolute;width:0;height:0;overflow:hidden}
/* Ein Aufkleber gibt nach, wenn man ihn drueckt. 120 ms, nur `transform` -
   die eine Eigenschaft, die auf dem Telefon nichts kostet. */
.aufkleber{transition:transform var(--d-tipp) var(--k-standard)}
.aufkleber.da:active{transform:rotate(-2deg) scale(.96)}
@media (prefers-reduced-motion:reduce){ .aufkleber.da:active{transform:none} }
.aufkleber span{font-family:var(--f-lesen);font-size:var(--s-klein);font-weight:700;
  color:var(--auf-flaeche);text-align:center;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
  /* `flex:0 0 auto` UND 1,4 statt 1,15 Zeilenhoehe - die Fusszeile wird
     NICHT gestaucht und nicht angeschnitten.
     Gefunden in Audit A am Forscherbuch: unter jedem Rechen-Aufkleber
     stand „= 6", und davon war die untere Haelfte weg - gemessen 11
     Punkte Kasten fuer 19 Punkte Zeile, also 42 % abgeschnitten. Die
     Ursache ist die Voreinstellung `flex-shrink:1` zusammen mit dem
     `overflow:hidden`, das hier fuer die Ellipse steht: ein Flexkind mit
     verstecktem Ueberlauf hat `min-height:auto` von 0, laesst sich also
     bis auf nichts zusammendruecken - und schneidet dann ab, statt zu
     drueckeln.
     Der Flexanteil allein hat es nicht geloest: danach standen 16
     Punkte gegen 19. Die zweite Haelfte ist die ZEILENHOEHE. 1,15 mal
     14 Punkte sind 16,1 - die Schrift Andika braucht aber 19, ihr
     Inhaltskasten ist 1,36 mal so hoch wie der Schriftgrad. Eine
     Zeilenhoehe unter dem, was die Schrift belegt, schneidet mit
     `overflow:hidden` unten ab. 1,4 gibt ihr, was sie braucht.
     `passt` hat das nie gesehen: es misst, was ueber den BILDSCHIRM
     laeuft, nicht was ein Kasten in sich selbst abschneidet. */
  flex:0 0 auto}

/* --- Die Albumkarte (Q28) ---------------------------------------------
   Ein Knopf, kein Kasten: Fiona liest nicht, sie tippt an und hoert. Und
   ein `div` mit `data-lesen` waere fuer `beruehrung` unsichtbar - das Tor
   misst Trefferflaechen nur an Bedienelementen. */
/* Die Karte gibt die Breite vor, nicht der Bildschirm.
   Der erste Entwurf setzte `width:100%` auf den Kasten und `100%` auf das
   SVG - die Weltkarte lag dann als Briefmarke in der Mitte eines Kastens
   ueber die ganze Seite, mit Leerraum links und rechts. Ein SVG mit
   `viewBox` rechnet seine Breite aus der Hoehe aus, wenn man sie ihm
   laesst; der Kasten legt sich darum. */
.albumkarte{background:var(--papier);border:var(--strich) solid var(--linie);
  border-radius:var(--rund-karte);padding:var(--r2);
  display:block;width:fit-content;max-width:100%;margin:0 auto;
  box-shadow:0 var(--kante-flach) 0 var(--tiefe-farbe);cursor:pointer;
  transition:transform var(--d-tipp) var(--k-standard)}
.albumkarte:active{transform:scale(.99)}
/* Die Albumseite darf den Platz nehmen, den sie hat: auf dem Schreibtisch
   ist das Buch sonst zu zwei Dritteln leer, und eine Weltkarte in
   Briefmarkengroesse ist kein Album. Nach oben begrenzt, damit zwei
   Ebenen nebeneinander noch auf einen Bildschirm passen. */
.albumkarte svg{height:clamp(120px, 42vh, 340px);width:auto;max-width:100%;display:block}
/* Was noch fehlt, ist der SCHATTEN des Aufklebers - kein Fragezeichen und
   kein leerer Kasten. Blass genug, dass die Farbe traegt, und kraeftig
   genug, dass die Form zu sehen ist.
   .55 waren zu blass (G15). Auf der Aufnahme des Forscherbuchs lagen die
   offenen Gebiete so schwach ueber dem Weiss, dass sie wie ein Artefakt
   aussahen statt wie ein freier Platz - und der freie Platz ist der halbe
   Sinn eines Albums: er zeigt, was noch zu holen ist. Jetzt .72 mit
   deutlicherem Umriss. Immer noch klar unter den gesammelten, die Farbe,
   Rand, Schatten und Glanz tragen. */
.albumoffen{fill:var(--linie);fill-opacity:.72;stroke:var(--tinte);stroke-opacity:.28;
  stroke-width:1.2;vector-effect:non-scaling-stroke}
.albumgrund{fill:var(--linie);fill-opacity:.3}
.gruppe small{font-weight:600;font-size:var(--s-klein);color:var(--tinte-3)}
@media (prefers-reduced-motion:reduce){ .albumkarte:active{transform:none} }

/* --- Der Familienschluessel (Q29) --------------------------------------
   Er wird ABGETIPPT, von einem Bildschirm auf ein anderes Geraet. Also
   dieselbe Schrift wie im Ausgabefeld (jede Ziffer gleich breit, Null und
   O unterscheidbar) und Luft zwischen den Zeichen. */
.schluesselschild{margin-bottom:var(--r3)}
.schluesselschild b{font-family:var(--f-mono);letter-spacing:.08em}
.schluesselfeld{max-width:16em;font-family:var(--f-mono);letter-spacing:.06em}

.pin{display:flex;gap:var(--r3);justify-content:center;align-items:center;min-height:34px}
.pin i{width:16px;height:16px;border-radius:var(--rund-voll);border:var(--strich-stark) solid var(--akzent);
  transition:background var(--d-tipp) var(--k-standard)}
.pin i.voll{background:var(--akzent)}
/* Dieselben Punkte, kleiner: im Elternbereich stehen sie in einer Zeile Text. */
.pin.klein{display:inline-flex;gap:var(--r2);min-height:0;vertical-align:middle}
.pin.klein i{width:11px;height:11px}
.ziffern{display:grid;grid-template-columns:repeat(4,64px);gap:var(--r2);justify-content:center}
.zi{justify-content:center;font-size:var(--s1);min-height:56px}
/* Der Ziffernblock im Elternbereich ist kleiner: dort tippt ein
   Erwachsener, nicht ein Kind mit dem Daumen. 44 Punkte bleiben. */
.ziffern.klein{grid-template-columns:repeat(5,48px);gap:var(--r1);justify-content:start;
  margin-top:var(--r2)}
.ziffern.klein .zi{min-height:44px;font-size:var(--s0)}

.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--r3)}
/* Q15: was kein Knopf ist, darf nicht wie einer aussehen.
   Die vier Zahlen im Elternbereich hatten weissen Grund auf weisser Seite
   und darunter eine 2 Punkte hohe Kante - also war von der ganzen Kachel
   genau EINE Linie zu sehen, und die sah aus wie der abgeschnittene
   untere Rand einer Pille. Vier kaputte Knoepfe, die keine sind.
   Jetzt eine ruhige Karte: feine Linie ringsum, kleiner Radius, keine
   Knopfkante. Ein Knopf ist rund und hat eine farbige Kante; eine Karte
   hat einen Strich. */
.wert{background:var(--papier);border:var(--strich-fein) solid var(--linie);
  border-radius:var(--rund-klein);padding:var(--r3) var(--r4)}
.wert b{display:block;font-size:var(--s2);font-weight:800;letter-spacing:-.02em}
.wert span{display:block;font-size:var(--s-klein);color:var(--tinte-3)}

.tab{width:100%;border-collapse:collapse;background:var(--papier);border-radius:var(--rund-karte);
  overflow:hidden;font-size:var(--s-klein)}
.tab th,.tab td{text-align:left;padding:var(--r2) var(--r3);border-bottom:var(--strich-fein) solid var(--linie)}
.tab th{font-weight:700;color:var(--tinte-3);font-size:13px}
.tab tr:last-child td{border-bottom:0}
.tab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ausgabefeld{width:100%;height:180px;font-family:var(--f-mono);font-size:12px;
  border:var(--strich) solid var(--linie);border-radius:var(--rund-klein);padding:var(--r2)}
code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--linie);
  padding:.1em .35em;border-radius:var(--rund-klein)}

@media (prefers-reduced-motion:reduce){
  /* Der `*`-Hammer steht jetzt in marken.css, wo er hingehoert.
     Ohne Bewegung muss der Rand allein tragen - also dauerhaft dick. */
  .karte .zielpuls{stroke-width:7;stroke-opacity:.55}
}
/* --- Kurze Bildschirme (ganz am Ende, siehe unten) ------------------------------------------------
   Das Zielgeraet hat quer 390 Punkte Hoehe fuer ALLES. Vorher stand hier
   eine Handvoll Einzelausnahmen; die haben je einen Bildschirm gerettet
   und die anderen sechs uebersehen. Auf dem iPhone waren zuletzt SECHZEHN
   Elemente nicht erreichbar - die vierte Antwort, die Ebene
   "Landeshauptstaedte", der "Verstanden"-Knopf ihrer Einweisung und drei
   Tasten der Eltern-PIN.

   Deshalb jetzt EIN Hebel: das ganze Raster wird enger, Schrift und
   Abstaende zusammen. Was NICHT mitschrumpft, sind die Trefferflaechen -
   44 Punkte bleiben 44 Punkte, egal wie klein der Bildschirm ist.

   Und der Block steht AM ENDE der Stilvorlage. Beim ersten Anlauf stand er
   in der Mitte, vor `.ziffern` und `.zi` - und war fuer die wirkungslos:
   eine Medienabfrage erhoeht die Spezifitaet nicht, bei gleichem Gewicht
   gewinnt die spaetere Regel. Das Tor meldete daraufhin drei Tasten der
   Eltern-PIN weiter als nicht erreichbar, obwohl die Regel dastand. */
/* Die Maske sitzt auf dem UMRISS, nicht auf der Kachel - seit der
   Umriss in die rechte Haelfte passt, braucht sie nur noch seine linke
   Kante weichzuzeichnen. Bei 58 % fraß sie das halbe Bild. */
.kachel .silhouette{-webkit-mask-image:var(--blende-umriss);
  mask-image:var(--blende-umriss)}
@media (max-height:440px), (max-width:430px){
  :root{
    --s-klein:14px; --s0:17px; --s1:20px; --s2:24px; --s3:28px; --s4:34px; --s5:40px;
    --r3:8px; --r4:12px; --r6:14px; --r8:18px; --r12:28px; --r16:36px; --r24:48px;
  }
  /* Der Kopf gibt auf dem kurzen Querformat Hoehe ab - fuer die Karten.
   *
   * Gemessen auf 844 x 390 an `laender:nordamerika`. Das ganze Fenster:
   * Kopf 68 + Fragesatz 30 + Feld 292 (Karte 280 + 12 Innenabstand). Die
   * Karte haengt also an der HOEHE, nicht an der Breite - sie war auf
   * 352 x 280 zusammengedrueckt, und deshalb wanderten die Nadelkoepfe
   * von Kuba und Panama bis zu 154 Punkte weit vom Land weg.
   *
   * Durchprobiert, jede Zeile ein Bau (erst den Raum ansehen, dann
   * justieren):
   *
   *     Kopf 68 px   Karte 352 x 280   Nadeln 7   laengster Faden 154
   *     Kopf 60 px   Karte 362 x 288   Nadeln 7   laengster Faden 134
   *     Kopf 52 px   Karte 371 x 296   Nadeln 7   laengster Faden 134
   *     Kopf 44 px   Karte 371 x 296   Nadeln 7   laengster Faden 134
   *
   * Zwei Dinge stehen in dieser Tafel, die man auseinanderhalten muss.
   *
   * Erstens hoert der Faden schon bei 60 auf zu fallen: was die 134 dann
   * noch haelt, ist die Breite, nicht die Hoehe. Weiter nachgeben zahlt
   * nur noch in Kartenpunkten, nicht in kuerzeren Faeden.
   *
   * Zweitens sind die Zeilen unter 60 hier gar nicht erreichbar. Die
   * `min-height` loest nur den Boden von 68; was die Hoehe dann wirklich
   * setzt, ist der INHALT - das Kreuz misst 44 Punkte und schrumpft
   * nicht, dazu zweimal 8 Punkte Innenabstand. NACHGEMESSEN im Browser:
   * `.kopf` ist 60 px hoch, `min-height` steht auf 52 und greift nicht.
   * Die 52 steht trotzdem da, weil sie die 68 aufhebt; wer sie streicht,
   * bekommt die 68 zurueck. Auf 52 zu kommen hiesse, das Kreuz unter
   * 44 Punkte zu druecken - dafuer sind acht Kartenpunkte zu wenig. */
  .kopf{padding:var(--r2) var(--r4);min-height:52px}
  /* Das Forscherbuch auf dem kurzen Querformat.
   *
   * Gemessen auf 844 x 390 mit ZWEI Aufklebern und zwei Vorschaukarten:
   * 358 Punkte Inhalt in 322 sichtbaren. Das Buch rollte also schon beim
   * zweiten Aufkleber, und die Vorschau unter „Als Nächstes" stand zur
   * Haelfte unter dem Rand - zwei graue Halbkarten, von denen ein Kind
   * nicht weiss, dass darunter noch etwas ist.
   *
   * Dass ein VOLLES Buch rollt, ist richtig; ein Album waechst. Dass ein
   * fast leeres rollt, ist es nicht. Die Bildhoehen sind hier fuer den
   * Schreibtisch gewaehlt (96 und 72 Punkte) und auf dem Telefon zu gross;
   * `passt` misst den Ueberlauf nicht, weil `.rollen` rollen DARF. */
  .kleber.gross .aufkleber svg{height:64px}
  /* Und die Ueberschrift steht NEBEN ihrer Reihe, nicht darueber (Q35).
   *
   * Gemessen auf 844 x 390 mit fuenf Aufklebern in zwei Ebenen: 404 Punkte
   * Inhalt in 318 sichtbaren - „Als Naechstes" stand als nackte
   * Ueberschrift auf der Unterkante, die blassen Vorschaukleber darunter
   * waren ganz weg. Ein Kind sieht eine Zeile und nichts dahinter.
   *
   * Uebereinander kostet jede Gruppe zweiundzwanzig Punkte allein fuer
   * ihren Namen, und rechts neben der Albumkarte lagen dreihundert Punkte
   * Weiss. Nebeneinander kostet sie nichts und benutzt die Breite, die das
   * Querformat ohnehin hat: 143 + 74 + 74 statt 3 x 22 obendrauf.
   *
   * Das Raster passt, weil im Buch immer eine Ueberschrift und ein Block
   * abwechseln. Der leere Fall („Hier kommen deine Aufkleber hin") ist
   * KEIN Paar und bekommt deshalb beide Spalten. */
  .rollen.buch{display:grid;grid-template-columns:minmax(110px,190px) 1fr;
    align-items:center;column-gap:var(--r4);row-gap:var(--r2);align-content:start;
    /* Der grosse Fuss unter `.rollen` ist fuer eine Liste gedacht, die
       WIRKLICH rollt - er soll die letzte Zeile vom Rand loesen. Im Buch
       auf dem kurzen Querformat sind es die letzten Punkte, die ueber
       „rollt" oder „rollt nicht" entscheiden (gemessen 341 in 318). */
    padding-bottom:var(--r3)}
  /* Die Spalte wird GENANNT, nicht abgezaehlt.
   *
   * Erst stand hier nur das Raster und die Annahme, dass sich Ueberschrift
   * und Block immer abwechseln. Sie stimmt nicht: `.abzkopf` („Deine
   * Abzeichen") ist auf dem kurzen Querformat `display:none`, faellt aus
   * der Platzierung heraus - und ab da lag jeder Block in der SCHMALEN
   * Spalte. Gemessen: die Kleberreihe 190 statt 618 Punkte breit, drei
   * Reihen statt einer, das Buch 794 Punkte statt 318. Sichtbar wurde es
   * erst, als ein Profil mit Abzeichen im Spiel war.
   *
   * Mit ausgeschriebener Spalte ist es gleichgueltig, was dazwischen
   * fehlt. */
  .rollen.buch > .gruppe{margin:0;grid-column:1}
  .rollen.buch > :not(.gruppe){grid-column:2}
  /* Die Zaehlung auf eine eigene Zeile: in der schmalen Spalte brach sonst
     „Bundeslaender 2 / Aufkleber, 1 davon sicher" mitten in der Zahl um. */
  .rollen.buch > .gruppe small{display:block}
  /* Und die Albumkarte an denselben linken Rand wie die Kleberreihen
     darunter - sonst steht sie als einzige Karte mittig und die Spalten
     springen. */
  .rollen.buch > .albumkarte{justify-self:start;margin-inline:0}
  .rollen.buch > .mitte{grid-column:1 / -1}
  /* Das Tierkapitel nimmt BEIDE Spalten (T2).
     Das Raster „Ueberschrift links, Block rechts" ist fuer EIN Paar
     gedacht; das Tierkapitel bringt drei Bloecke hintereinander mit,
     und die lagen alle in der schmalen Spalte. Gemessen auf 390 x 844:
     die Reiterreihe 164 statt 358 Punkte breit, fuenf Reihen statt
     drei, die Aufkleberwand drei Reihen statt einer - zusammen 29
     Punkte unter dem Rand. Dieselbe Falle wie bei `.abzkopf` eine
     Erklaerung weiter oben. */
  .rollen.buch > .raumwahl,
  .rollen.buch > .tierraum{grid-column:1 / -1}
  /* Das Buch ist auf 844 x 390 randvoll - die Karte bekommt hier weniger
     Hoehe als der Platz auf dem Schreibtisch hergibt. Gerechnet: Kopf 60 +
     Abzeichen 60 + zweimal (Ueberschrift 28 + Karte + Polster 16) muessen
     unter 390 bleiben, also hoechstens 96 je Karte. Das Buch DARF rollen
     (`.rollen`), aber wer rollen muss, sieht nicht alles - und genau das
     war der Wunsch. */
  .albumkarte svg{height:96px}
  /* Bei EINER Karte ist das zu klein (Q30).
     Die 96 sind fuer den engsten Fall gerechnet - zwei Karten -, und in
     dem Buch, das die Kinder am Anfang aufschlagen, steht genau eine. Die
     Weltkarte lag dann als Briefmarke in einem halbleeren Bildschirm.
     Gezaehlt wird mit `:has()` am Geschwisterpaar: sind zwei Albumkarten
     da, greift die Regel nicht. Kein Merkmal im Markup - die Zahl der
     Karten ist eine Eigenschaft dieses Bildschirms, keine Auskunft, die
     das Programm mitschicken muesste. Dieselbe Ueberlegung wie bei der
     Weltenwahl, und dieselbe Stelle, an der Chromium sie erst nach dem
     Wiedereinhaengen anwendet (siehe `tor/passt.mjs`).

     125 und nicht 170. Die erste Zahl war am Buch EINES Profils gemessen
     und lief auf dem Zielgeraet 11 Punkte ueber den Rand, mit Uhr und
     Wischstreifen 21, auf dem iPhone SE quer 6 - `passt` hat es an drei
     Groessen gemeldet, nachdem ich es an einer gemessen hatte. Der enge
     Fall ist nicht der, den man vor sich hat. */
  /* Q35: „einzige Karte" heisst NICHTS DAHINTER, nicht „keine zweite
     Albumkarte". Sobald das Buch eine Rechenebene enthaelt, folgen auf die
     Albumkarte noch zwei Kleberreihen samt Ueberschriften - dann ist der
     Bildschirm nicht halbleer, und die 125 kosten genau die Punkte, die
     der Vorschau unten fehlen (gemessen 370 in 318 sichtbaren). */
  /* „Nichts dahinter" heisst: keine weitere GRUPPE dahinter (Q46).
     Der Satz zum Mitnehmen steht seit Q46 unter der Karte und ist damit
     ein Geschwister - `:has(.albumkarte ~ *)` traf ihn, die Regel fiel
     aus, und die Karte schrumpfte von 200 auf 125 zurueck. Zu sehen war
     es sofort auf der Aufnahme; erklaeren liess es sich erst am
     Selektor. Ein Satz ist keine Gruppe, und die Ausnahme muss ihn
     ueberspringen. */
  .rollen.buch:not(:has(.albumkarte ~ *:not(.buchsatz))) .albumkarte svg{height:125px}
  /* Im KAPITELBUCH steht genau eine Karte auf der Seite (Q44).
     Die 125 sind fuer ein Buch gerechnet, in dem darunter noch zwei
     Gruppen standen - hier steht nichts darunter. Gemessen auf 844 x 390:
     der Reiterstreifen kostet 67 Punkte, die Seite hat 251, und die Karte
     nahm davon 145. Mit 200 sind es 220 - dreissig Punkte Luft, dieselbe
     Reserve, die das Buch vorher hatte. */
  /* 165 und nicht 200, seit der Satz zum Mitnehmen darunter steht (Q46).
     Gemessen: mit 200 fiel er auf zwei von sieben Kapitelseiten unter die
     Unterkante - das Kapiteltor hat es gemeldet. Die Seite hat 251
     Punkte, der Satz nimmt zwei Zeilen. */
  /* 165 - UNVERAENDERT, und das ist das Ergebnis von G15, kein Versaeumnis.
     Das Forscherbuch hatte das groesste zusammenhaengende leere Band der
     App (37 % der Bildhoehe). Der naheliegende Schluss war, die Karte
     wachsen zu lassen. Er ist falsch, und zwar gemessen: 190, 185 und 210
     wurden der Reihe nach probiert, und die volle Kette meldete jedes Mal
     „auf 1 bis 2 von 7 Kapitelseiten steht nicht alles im Bild" - derselbe
     Befund wie Q46 bei 200. AUF 844 x 390 IST DIE SEITE BEI 165 SCHON
     VOLL; das leere Band steht auf den GROSSEN Bildschirmen, und dort
     greift der Deckel oben (`clamp(120px, 42vh, 340px)`, vorher 34vh/300).

     Zwei Anlaeufe waren vorher gruen und beide wertlos: `passt` sieht das
     Kapiteltor nicht, und `smoke --nur=spielen --kurz` faehrt den Zweig
     gar nicht erst an. EIN ABGEKUERZTER LAUF IST KEIN NACHWEIS - `--kurz`
     ist zum Durchsehen da, nicht zum Abnehmen einer Zahl. */
    .rollen.buch.kapitel:not(:has(.albumkarte ~ *:not(.buchsatz))) .albumkarte svg{height:165px}
  .kleber.gross.vorschau .aufkleber svg{height:48px}
  /* Auf einer KAPITELSEITE duerfen die Aufkleber groesser sein (G15b).
   *
   * Die 64 und 48 oben sind fuer ein Buch gerechnet, in dem mehrere
   * Gruppen untereinander um dieselbe Hoehe stritten. Auf einer eigenen
   * Seite steht eine Gruppe allein - gemessen nutzten die
   * Aufkleberseiten 42 % („hören") und 29 % („Als Nächstes") ihrer Hoehe.
   * Der freie Platz gehoert dem, was das Kind gesammelt hat.
   *
   * Die Zahlen sind abgetastet, nicht gewaehlt: das Kapiteltor meldet,
   * sobald ein Block unter die Kante faellt. */
  .rollen.buch.kapitel .kleber.gross .aufkleber svg{height:76px}
  .rollen.buch.kapitel .kleber.gross.vorschau .aufkleber svg{height:76px}
  /* Und die Ueberschriften der Aufklebergruppen werden kleiner.
   *
   * Gemessen am Zielgeraet mit Browserleiste (844 x 390, davon 322
   * sichtbar), Fiona mit fuenf Aufklebern: der Abzeichenstreifen kostet
   * 44 Punkte, und danach stand der Inhalt auf 340 - achtzehn zuviel.
   * Vorher waren es genau 322 in 322, das Buch hatte also KEINEN
   * Spielraum; die naechste Zeile, die irgendwer hinzufuegt, haette es
   * genauso gekippt.
   *
   * Zurueckgeholt wird es nicht am Streifen: 44 Punkte sind die
   * Fingergrenze und keine Zahl, die man weiter drueckt. Es kommt von den
   * zwei Gruppenueberschriften, die zusammen 90 Punkte fuer zwei Woerter
   * trugen (je 26 hoch, dazu 14 und 8 Punkte Rand) - auf einem
   * Bildschirm, der 322 hat. Mit `--s0` statt `--s1` und engeren
   * Raendern sind es 68, und die Fusspolsterung gibt sechs weitere her:
   * gemessen 312 in 322, also zehn Punkte Luft statt keiner. */
  .rollen.buch .gruppe{font-size:var(--s0);margin:var(--r3) 0 var(--r1)}
  .rollen.buch{padding-bottom:var(--r4)}
  .frage{padding:0 var(--r4) var(--r1)}
  /* Das Lob steht hier in EINER Zeile, nicht in zweien (Q45).
   *
   * Auf dem Schreibtisch traegt das Lob seine eigene Zeile: „Klasse!"
   * gross, darunter die Sache. Das ist gut - ein Kind liest das erste
   * Wort und weiss Bescheid, bevor es den Satz zu Ende gelesen hat.
   *
   * Auf 390 Punkten kostet dieselbe Zeile 26 Punkte KARTE, und zwar
   * genau im Augenblick des Lobs: gemessen wandert die gezeichnete Karte
   * dabei nach unten und wird kleiner. Nebeneinander bleibt beides
   * lesbar - „Klasse!" ist weiter groesser und farbig -, und der
   * Bildschirm bleibt ruhig. Auf dem grossen Geraet aendert sich nichts;
   * dort ist der Platz da. */
  .frage .jubel{display:inline;font-size:var(--s1)}
  .etikett{min-height:44px}
  .titel{font-size:var(--s2)}
  /* Auf dem kleinsten Geraet (iPhone SE quer, 667x375) zaehlt jeder
     Punkt: die 1,5-Punkt-Raender der neuen Knoepfe haben die fuenfte
     Ebene wieder 4 Punkte unter den Rand geschoben. Statt genau diese 4
     zurueckzuholen, ruecken hier die INNEREN Abstaende enger - das gibt
     rund 30 Punkte Luft, und die naechste Schriftaenderung kippt es nicht
     gleich wieder. */
  /* Der Balken BLEIBT jetzt auch hier stehen.
     Vorher fiel er weg, "weil er dasselbe sagt wie die Zahl darueber" -
     und weil die Zahl da war, kostete das nichts. Seit die Zahl durch
     Sterne und Aufkleber ersetzt ist, war auf dem Zielgeraet - iPhone
     quer, genau dieses Fenster - GAR KEIN Fortschritt mehr zu sehen:
     acht gleich aussehende Kacheln. Er wird schmaler statt unsichtbar. */
  /* Mit den seitlichen Aussparungen des iPhone (je 59 Punkte) bleiben von
     844 nur 726 - dort passen DREI Kacheln nebeneinander, nicht vier, also
     drei Reihen statt zwei. Bei 72 Punkten je Kachel lag die letzte Reihe
     3 Punkte im unteren Streifen. Die Polsterung gibt sie her. */
  .kachel{padding:var(--r2) var(--r4);max-width:300px;gap:var(--r1)}
  /* `.kachel.bunt` setzt die Polsterung mit ZWEI Klassen; die Zeile
     darueber hat sie nie erreicht. Sie stand seit der Einfuehrung dieses
     Fensters da und tat nichts - gemessen, nicht vermutet: die Kachel blieb
     bei 16/24 Punkten, egal was hier stand. */
  .kachel.bunt{padding:var(--r2) var(--r4)}
  /* Sterne, Aufkleber und Balken in EINE Zeile - sonst ist die Kachel um
     zwei Zeilen hoeher als vorher, und acht davon passen nicht mehr in
     390 Punkte. Das Tor `passt` hat genau das gemeldet. */
  /* Der Vorlauf (R3) im kurzen Querformat.
     Gemessen, nicht geschaetzt: `passt` meldete auf dem iPhone SE quer
     (667 x 375) elf bis achtundneunzig Punkte Ueberlauf, auf dem
     Zielgeraet achtundvierzig bei den Hauptstaedten. Die Karten werden
     deshalb hier kleiner - und nur hier. */
  .rollen.vorlauf{gap:var(--r1)}
  /* 88 statt 76 Punkte, und das ist keine Kosmetik.
     Bei 76 brach „Niedersachsen" zu „Niedersachs / en" und
     „Brandenburg" zu „Brandenbur / g" - mitten im Wort, auf einem
     Bildschirm, der genau diese Namen beibringen soll. Bei 88 nimmt der
     Umbruch die Fugen: „Rheinland- / Pfalz". Und es kostet KEINE Reihe:
     sechzehn Karten stehen auf dem Zielgeraet so wie so in zweien. Wie
     breit es sein darf, hat `passt` gesagt, nicht ich. */
