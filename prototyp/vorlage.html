<!doctype html>
<html lang="de"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="description" content="Erdkunde für Fiona und Lea: Kontinente, Länder, Bundesländer, Landeshauptstädte.">
<title>Smart Kids</title>
__KOPF__
<style>
/* === Marken. Hier steht KEINE Kopie mehr. ==============================
   Bis eben stand src/marken/marken.css hier ein zweites Mal, von Hand
   gepflegt - und die beiden waren laengst auseinander: die App fuehrte
   --tinte2, das System --tinte-2; die App --tiefe, das System
   --tiefe-farbe. Vier Marken (--app-gut, --app-warn, --app-linie,
   --f-mono) benutzte die App, ohne dass sie IRGENDWO definiert waren -
   deshalb hat sich kein Fortschrittsbalken je gefuellt und "Richtig -
   Thueringen!" stand nie in Gruen.

   Der Bau setzt die Datei jetzt hier ein. Was zweimal dasteht, veraltet
   einmal (Regel 6). */
__MARKEN__
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(168deg,var(--grund) 0%,var(--grund-2) 100%);
  background-attachment:fixed;
  color:var(--tinte);font-family:var(--f-ui);line-height:1.3;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;
}
/* Der sichere Bereich gehoert an die BUEHNE, nicht an den Rumpf.
   Das Polster stand auf `body` - und hatte keinerlei Wirkung: `#buehne` ist
   `position:absolute`, `body` ist nicht positioniert, also bezieht sich
   `inset:0` auf das FENSTER und nicht auf das Polster. Nachgemessen: mit 44
   Punkten Polster am Rumpf blieb der Schliessen-Knopf exakt dort, wo er
   vorher war, 12 Punkte von der Ecke. Auf dem iPhone sitzt dort die Uhr,
   rechts daneben der Akku - der Knopf war nicht schlecht gebaut, er war
   unter der Statusleiste begraben und nahm den Finger nicht an. */
#buehne{position:absolute;display:flex;flex-direction:column;
  top:var(--sicher-oben); right:var(--sicher-rechts);
  /* Unten steht der Fassungsstempel. Wo das Geraet selbst schon einen
     Streifen belegt, passt er hinein und kostet nichts; sonst nimmt er
     sich seine siebzehn Punkte. */
  bottom:max(var(--sicher-unten), var(--fassung-hoehe));
  left:var(--sicher-links)}
/* Der Fassungsstempel - unten in der Ecke, auf JEDEM Bildschirm.
   Vorher stand er nur auf der Profilwahl. Damit war die Frage „laeuft auf
   diesem iPhone schon die neue Fassung?" nur zu beantworten, wenn man
   vorher bis zum ersten Bildschirm zurueckging - und nach einem
   Neustart der App sieht der Bildschirm gleich aus, ob die Fassung nun
   neu ist oder aus dem Lager des Service Workers kommt.

   Er liegt NEBEN der Buehne, nicht darin: `#buehne` ist der sichere
   Bereich, und ein Kind, das an dieser Ecke zieht, soll den Stempel
   nicht treffen (`pointer-events:none`).

   „Er ueberlagert nur leere Ecken" war der erste Entwurf, und `passt`
   hat ihn im ersten Lauf widerlegt: auf dem Zielgeraet mit Leiste lag er
   ueber der Kachel „Deutschland" und ihrem Vorschau-Knopf (100×17 px),
   auf dem iPhone hochkant ueber „noch einmal hoeren". Die Ebenenwahl
   fuellt dort ihre Wand exakt aus - zehn Kacheln, Platz fuer zehn.

   Also nimmt er Platz, aber nur, wo welcher ist: `max()`. Wo das Telefon
   unten ohnehin einen Streifen fuer sich behaelt (Home-Anzeige, 21 px
   quer), sitzt der Stempel DARIN und kostet nichts. Wo es keinen gibt
   (iPad, Schreibtischfenster), werden 17 Punkte frei gehalten - dort ist
   Platz fuer achtzehn Kacheln, und siebzehn Punkte aendern daran nichts.
   Beides misst `passt` bei jedem Lauf nach. */
:root{--fassung-hoehe:12px}
#fassung{position:fixed;
  right:calc(var(--sicher-rechts) + var(--r2));
  bottom:0;height:var(--fassung-hoehe);line-height:var(--fassung-hoehe);
  font-family:var(--f-ui);font-size:var(--s-winzig);color:var(--tinte-3);
  letter-spacing:.02em;pointer-events:none;user-select:none;z-index:5}
.schirm{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--d-schirm) var(--k-standard)}
.schirm.da{opacity:1;pointer-events:auto}
/* Ein Bildschirm, der geht, darf nichts mehr annehmen - AUCH NICHT ueber
   ein Kind, das sich `pointer-events` selbst setzt.
   Genau das ist passiert: die unsichtbaren Trefferkreise (`pointer-events:
   all`, damit man kleine Gebiete ueberhaupt treffen kann) hoben das `none`
   ihres ausgeblendeten Bildschirms auf und blieben die 340 ms der
   Ueberblendung aktiv. Wer in dieser Zeit ein Etikett losliess, traf einen
   Kreis der VORIGEN Aufgabe - die Antwort war richtig und wurde als falsch
   gewertet. Reproduzierbar bei Fiona, Ebene 4, direkt nach den
   Bundeslaendern. */
.schirm:not(.da) *{pointer-events:none!important}

/* Der Übergang von Aufgabe zu Aufgabe.
   Zwei Bildschirme, die gleichzeitig ineinander blenden, ergeben zwischen
   zwei Aufgaben derselben Ebene ein Blinzeln: die Karte ist identisch,
   also sieht man nur, wie sie kurz dunkler wird. Was sich wirklich
   ändert, sind Frage und Antworten - und die KOMMEN jetzt herein, leicht
   von unten und nacheinander. Der gehende Bildschirm geht dafür schneller
   (halbe Dauer), damit sich die beiden weniger überlagern.
   Bewegt wird nur `opacity` und `transform`: beides kostet kein neues
   Layout, und die Antwortliste steht auch währenddessen schon an ihrem
   endgültigen Platz. */
.schirm{transition-duration:calc(var(--d-schirm) / 2)}
/* Das Neue wartet einen Takt.
   Ohne den Versatz überlagern sich beide Bildschirme halbdurchsichtig:
   auf dem Bild aus der Mitte des Übergangs standen die alte Lobzeile und
   die neue Frage übereinander, und hinter der neuen Karte lag die alte
   mit ihrem grün gefärbten Treffer. Ein Doppelbild ist nicht besser als
   ein Blinzeln. Der gehende Bildschirm braucht `--d-schirm / 2`; genau so
   lange wartet das Neue. */
.schirm.da{transition-duration:var(--d-schirm);
  transition-delay:calc(var(--d-schirm) / 2)}
@keyframes herein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.schirm.da .frage,
.schirm.da .karte,
.schirm.da .etikett,
.schirm.da .eingabe{animation:herein var(--d-schirm) var(--k-standard) both;
  animation-delay:calc(var(--d-schirm) / 2)}
.schirm.da .etikett{animation-delay:calc(var(--d-schirm) / 2
  + var(--rang, 0) * var(--d-staffel))}

/* Drei Felder, festes Raster: die Mitte ist damit WIRKLICH mittig, egal
   wie breit links und rechts sind. `space-between` verteilte nur den
   Zwischenraum - "Fiona" sass bei 844 Punkten Breite auf 366 statt 422.
   Und nichts bricht mehr um: im Hochformat rutschten "Forscherbuch" und
   "Eltern" unter "Zurueck", der Kopf war 112 Punkte hoch und schief. */
/* Das Fortschrittsband.
   Statt „3/8" - eine Zahl, die ein Kind erst lesen und dann verrechnen
   muss - steht dort eine Reihe Punkte: was war, was gerade dran ist, was
   kommt. Und sie sagen zusaetzlich, WIE es lief: glatt beim ersten
   Versuch, geschafft mit Hilfe, oder gezeigt. Das ist derselbe
   Fortschritt, nur ohne Lesen. */
.band{display:flex;gap:var(--r2);align-items:center}
.band i{width:12px;height:12px;border-radius:50%;background:var(--linie-2);
  transition:background var(--d-zustand) var(--k-standard),
             transform var(--d-zustand) var(--k-standard)}
.band i.glatt{background:var(--gut)}
.band i.geschafft{background:var(--treffer);opacity:.75}
.band i.gezeigt{background:var(--warn)}
/* Im Test danebengelegen (B2).
   Dieselbe Farbe wie „vorgemacht bekommen" - und das ist kein Versehen:
   die beiden koennen im selben Band nie zusammen vorkommen. Im Test wird
   nichts vorgemacht, in der Uebung gibt es kein Daneben ohne Aufloesung.
   Zwei Farben fuer zwei Dinge, die sich nie begegnen, waeren eine
   Unterscheidung, die niemand je sieht. */
.band i.daneben{background:var(--warn)}
/* Der Pokal auf der Kachel (B2) - in derselben Zeile wie der
   Aufkleberstand, weil beide dasselbe sagen: was du hier hast. */
.kachel .pokal{display:inline-flex;line-height:0;margin-left:var(--r1)}
.kachel .pokal svg{width:22px;height:22px}
.band i.weiter{background:var(--linie)}
.band i.jetzt{background:var(--ziel);transform:scale(1.5)}
@media (max-width:420px){ .band i{width:9px;height:9px} .band{gap:var(--r1)} }

.kopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:var(--r3);padding:var(--r3) var(--r4);flex:none;min-height:68px}
.kopf-links{justify-self:start;display:flex;gap:var(--r2);min-width:0}
.kopf-mitte{justify-self:center;display:flex;align-items:center;gap:var(--r2);min-width:0}
.kopf-rechts{justify-self:end;display:flex;gap:var(--r2);min-width:0}
.marke{font-family:var(--f-ui);font-size:var(--s0);font-weight:700;color:var(--tinte-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Der Zaehler ist eine Zahl, kein Satz: gross, mit Ziffern gleicher Breite. */
.zaehler{font-family:var(--f-ui);font-size:var(--s1);font-weight:800;color:var(--tinte);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.zaehler i{font-style:normal;color:var(--tinte-2);margin:0 .1em;font-weight:600}
/* Zeichenknoepfe: rund, genau 44 Punkte - die Untergrenze fuer einen Daumen. */
.knopf.rund{width:44px;height:44px;padding:0;justify-content:center;flex:none}
@media (max-width:520px){ .knopf .wort{display:none} .knopf{padding:var(--r2)} }
/* --- Die drei Knopfklassen ------------------------------------------
   Vorher war JEDER Knopf dieselbe weisse Pille: die Antwort, die
   Ebenenkachel, "Zurueck", "Eltern". Deshalb wirkte nichts gestaltet - es
   gab keine Rangfolge. Jetzt drei Gewichte:

     .knopf    LEISE      Werkzeug am Rand. Kein Fuellton, keine Tiefe.
     .kachel   MITTEL     Etwas zum Aussuchen. Papier mit Kante.
     .etikett  LAUT       Die Antwort. Der wichtigste Knopf der App.

   Die Tiefe ist bei allen dieselbe Mechanik: helle Linie oben INNEN,
   dunklere Kante unten. Beim Druecken faehrt der Knopf um genau die
   Kantenhoehe nach unten - dann sieht es aus, als gaebe er nach. */
/* Q15: der leise Knopf war gar keiner.
 *
 * Der Absatz darueber verspricht „die Tiefe ist bei allen dieselbe
 * Mechanik". Nachgezaehlt stimmte das nicht: von acht Knopfarten hatten
 * VIER keine Kante, und es gab vier verschiedene Druckwege - 0, 1 und
 * 3 Punkte, und `warnend` fuhr 3 Punkte nach unten, ohne eine Kante zu
 * haben, in die es haette fahren koennen. Der leise Knopf war
 * durchsichtig mit einem Rand bei 0,885 auf weissem Grund: ein Umriss,
 * kein Gegenstand. Auf dem Endbildschirm standen so zwei davon neben dem
 * lauten und sahen aus wie etwas, das noch nicht fertig geladen ist.
 *
 * Jetzt hat JEDE Knopfart dieselben drei Teile - Flaeche, helle Linie
 * oben innen, Kante unten - und faehrt beim Druecken um genau ihre
 * Kantenhoehe. Der Rang steckt in der Hoehe der Kante, nicht in ihrer
 * An- oder Abwesenheit:
 *
 *   leise   `--kante-flach` (2 px)   Werkzeug am Rand
 *   laut    `--kante`       (3 px)   Antwort, Kachel, Hauptknopf
 *
 * Der Rand ist eine Stufe dunkler (`--knopf-kante` statt `--knopf-rand`):
 * auf reinem Weiss trug 0,885 zu wenig, um eine Form zu zeichnen. */
.knopf{font-family:var(--f-ui);font-size:var(--s0);font-weight:700;color:var(--tinte-2);
  background:var(--papier);border:var(--strich) solid var(--knopf-kante);
  border-radius:var(--rund-voll);
  box-shadow:0 var(--kante-flach) 0 var(--knopf-kante),
             inset 0 var(--strich) 0 var(--knopf-licht);
  padding:var(--r2) var(--r4);min-height:44px;display:flex;align-items:center;gap:var(--r2);
  cursor:pointer;transition:transform var(--d-tipp) var(--k-standard),
    box-shadow var(--d-tipp) var(--k-standard),
    border-color var(--d-tipp) var(--k-standard),color var(--d-tipp) var(--k-standard)}
/* Zeichen werden nicht gestaucht (Q34). In einer engen Knopfreihe ist der
   Text das, was umbrechen darf - ein zusammengedruecktes Zeichen ist keines
   mehr. */
.knopf svg,.leise svg{flex:none}
.knopf:active{transform:translateY(var(--kante-flach));color:var(--tinte);
  border-color:var(--tinte-3);
  box-shadow:0 0 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.knopf:hover{border-color:var(--primaer-rand);color:var(--tinte)}}
/* Genau EIN lauter Knopf je Bildschirm - dieselbe Tiefe wie am Etikett.
   Auf dem Endbildschirm standen drei gleich leise Knoepfe nebeneinander:
   "Noch einmal", "Forscherbuch", "Etwas anderes". Was als naechstes
   passieren soll, war daran nicht zu sehen - und wer nicht liest, sieht
   nur drei graue Kapseln. */
/* Q15: GEFUELLT, nicht nur eine Spur blauer.
 *
 * Bis hierher trug der Hauptknopf `--primaer` - dieselbe Flaeche, denselben
 * Rand und dieselbe Kante wie ein Antwort-Etikett. Auf dem Endbildschirm
 * war er damit „einer von dreien in einer anderen Schattierung", und das
 * ist genau das Gegenteil von dem, wofuer es ihn gibt.
 *
 * Der volle Akzentton ist keine neue Sprache: das Mikrofon traegt ihn seit
 * M4s als runde, gefuellte Flaeche mit weissem Zeichen. Der laute Knopf ist
 * dieselbe Sache in Pillenform. Und er kollidiert mit nichts - ein
 * Etikett und ein Hauptknopf stehen nie auf demselben Bildschirm.
 *
 * Die Schrift ist `--papier` auf `--akzent`. Das ist grosse Schrift
 * (25 px, fett), also gilt 3:1; gemessen wird es von `lesbarkeit` bei
 * jedem Lauf, nicht hier behauptet. */
.knopf.haupt{color:var(--papier);background:var(--akzent);
  border-color:var(--akzent);
  box-shadow:0 var(--kante) 0 var(--akzent-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  padding:var(--r3) var(--r8);min-height:56px;font-size:var(--s1)}
.knopf.haupt:active{transform:translateY(var(--kante));background:var(--akzent);
  color:var(--papier);border-color:var(--akzent);
  box-shadow:0 0 0 var(--akzent-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.knopf.haupt:hover{background:var(--akzent);
  color:var(--papier);border-color:var(--akzent-kante)}}
/* Der eine Knopf, der etwas WEGNIMMT (R1).
   Kein voller Warnton als Fläche - das wäre ein Alarm, und der Knopf ist
   keiner: er steht neben zwei harmlosen und soll nur nicht mit ihnen
   verwechselt werden. Also die Schrift und der Rand in `--warn`, die
   Fläche hell. */
/* Die SCHRIFT ist dunkler als der Rand. `--warn` pur auf `--warn-h` kam
   auf 2,92:1 - das Tor `lesbarkeit` hat den Knopf gemeldet, sowie es ihn
   das erste Mal zu sehen bekam. Der Rand darf den vollen Warnton tragen,
   er ist keine Schrift. */
/* Q15: er fuhr drei Punkte nach unten und hatte keine Kante, in die er
   haette fahren koennen - der Knopf sprang, statt nachzugeben. Jetzt
   dieselbe flache Kante wie jeder andere leise Knopf, nur in seinem Ton. */
.knopf.warnend{color:color-mix(in oklab, var(--warn) 72%, var(--tinte));
  border-color:var(--warn);background:var(--warn-h);
  box-shadow:0 var(--kante-flach) 0 var(--warn),
             inset 0 var(--strich) 0 var(--knopf-licht)}
.knopf.warnend:active{transform:translateY(var(--kante-flach));
  color:color-mix(in oklab, var(--warn) 72%, var(--tinte));
  border-color:var(--warn);background:var(--warn-h);
  box-shadow:0 0 0 var(--warn),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.knopf.warnend:hover{
  color:color-mix(in oklab, var(--warn) 72%, var(--tinte));
  border-color:var(--warn);background:var(--warn-h)}}
/* Der Vorlauf (R3).

   Er borgt sich das Gitter des Forscherbuchs, aber nicht dessen Groesse:
   dort stehen die paar Stuecke, die schon gesammelt sind, hier ALLE
   sechzehn eines Bundeslandes auf einmal. Bei 148 Punkten je Karte
   scrollte das auf dem kleinsten Geraet (iPhone SE quer, 667 x 375) - und
   `passt` sagt zu Recht, dass ein Kind nicht in einer Liste scrollt, von
   der es nicht weiss, dass sie weitergeht.

   Also kleiner, aber nicht beliebig klein: 84 Punkte ist die Breite, bei
   der 16 Stuecke auf dem kleinsten Geraet in drei Reihen stehen. */
/* `safe center`, nicht `center`.
   Zentriert man den Inhalt eines Behaelters, der ueberlaeuft, wird er an
   BEIDEN Enden abgeschnitten - und nach oben kann man nicht scrollen. Der
   Stadtstaaten-Satz stand bei den Hauptstaedten halb ueber dem oberen
   Rand. `safe` faellt in dem Fall auf `flex-start` zurueck. */
.rollen.vorlauf{display:flex;flex-direction:column;gap:var(--r3);
  align-items:center;justify-content:safe center;
  /* Die Hoechstmasse EINER Beispielkarte - ungefaehr quadratisch, die Form
     eines Aufklebers. Das Gitter rechnet daraus seine eigenen
     Hoechstmasse; gedeckelt wird also das Gitter, nicht die Karte. Der
     Versuch, die Karte selbst zu deckeln, hat sie zum Einsturz gebracht:
     mit `max-height` und `align-self:center` bemisst sich ein
     Gitterkind an seinem Inhalt, und der Inhalt darf hier auf null
     schrumpfen (`flex:1 1 0`). Uebrig blieben sechs flache Striche mit
     uebereinanderliegender Schrift. */
  --kleber-breit:180px;--kleber-hoch:168px;
  /* Fuer Gitter mit mehr als acht Spalten - siehe `.kleber.viel`. */
  --kleber-breit-eng:120px;
  /* Die Untergrenze einer engen Spalte - EINMAL, weil die Regel darueber
     zweimal dasteht (im Grundsatz und im kurzen Querformat). Genau das
     ist schiefgegangen: gepflegt wurde die obere, gegolten hat auf dem
     Zielgeraet die untere. */
  --kleber-eng-min:56px}
.rollen.vorlauf .mitte-satz{text-align:center;max-width:52ch}
/* Wieviele Karten NEBENEINANDER, und wie hoch sie werden.
 *
 * Vorher stand hier eine feste kleinste Spaltenbreite und `auto-fill`. Das
 * ist fuer sechzehn Bundeslaender richtig - sie fuellen die Breite in zwei
 * Reihen - und fuer die sechs Beispielaufgaben einer Rechenebene falsch,
 * gleich doppelt: `auto-fill` legt acht Spuren an, sechs davon werden
 * belegt, und die Reihe stand LINKS mit einem Loch von vierhundert Punkten
 * rechts. Darueber und darunter noch einmal je ein Drittel des Bandes leer.
 * Es sah nicht nach Auswahl aus, sondern nach vergessenem Inhalt.
 *
 * Jetzt kommen beide Zahlen aus der Zahl der Karten:
 *   `--spalten`  setzt der Bildschirm, abgeleitet aus `stuecke.length`
 *                (zwei Reihen, hoechstens acht nebeneinander)
 *   die Hoehe    teilt sich das Gitter selbst: `1fr` je Reihe, und das
 *                Gitter nimmt sich den Rest des Bandes
 *
 * `max(88px, …)` ist die Notbremse fuer schmale Fenster: passen die
 * gewuenschten Spalten nicht, legt `auto-fit` weniger an, statt
 * ueberzulaufen. Was am Ende wirklich passt, sagt `passt`, nicht diese
 * Rechnung. */
.rollen.vorlauf .kleber{
  grid-template-columns:repeat(auto-fit,minmax(max(88px,
    calc(100% / var(--spalten,8) - var(--r2))),1fr));
  /* `minmax(min-content,1fr)` und nicht `1fr`.
     Die Spaltenzahl ist ein WUNSCH - auf einem schmalen Geraet legt
     `auto-fit` weniger an, und dann gibt es mehr Reihen als `--reihen`
     sagt. Mit nacktem `1fr` teilen sich diese Reihen trotzdem die Hoehe
     fuer zwei: auf dem iPhone SE quer standen die dreizehn
     Hauptstadtkarten in drei gequetschten Reihen, und der Name lag zwei
     Punkte ausserhalb seiner Karte - `passt` hat es gemeldet. Mit
     `min-content` als Untergrenze wird eine Reihe nie kleiner als ihr
     Inhalt; uebrige Hoehe teilen sie sich weiterhin. */
  grid-auto-rows:minmax(min-content,1fr);justify-content:center;
  gap:var(--r2);width:100%;flex:1 1 auto;min-height:0;
  max-width:min(900px, calc(var(--spalten,8) * var(--kleber-breit)));
  max-height:calc(var(--reihen,2) * var(--kleber-hoch)
                + (var(--reihen,2) - 1) * var(--r2))}
/* Mehr als acht in einer Reihe: dann muss das Mindestmass kleiner werden.
 *
 * Die 88 Punkte oben sind fuer sechzehn Bundeslaender gemessen - acht in
 * einer Reihe. Beim Abc sind es sechsundzwanzig Karten; sie SOLLEN in drei
 * Reihen zu neun stehen, aber `auto-fit` legte weiter nur sieben Spalten
 * an, weil 88 Punkte nicht neunmal in die Breite passen. Ergebnis waren
 * wieder vier Reihen, und die letzte lag im Streifen des iPhone.
 * Gemessen auf 844 x 390 MIT Leiste: nutzbar bleiben 756 Punkte, neun
 * Karten brauchen also hoechstens 76. Die 72 sind die naechste runde Zahl
 * darunter - und ein Wort wie „Xylofon" traegt sie noch. */
/* Die Untergrenze darf den WUNSCH nicht aufheben (S3).
 *
 * Hier standen 72px. Gemessen auf dem Zielgeraet: das Gitter ist dort rund
 * 644 Punkte breit, `calc(100% / 9 - 4)` ergibt 68 - und `max(72px, 68px)`
 * nimmt die 72. Neun Spalten zu 72 brauchen aber 680 Punkte. `auto-fit`
 * legte deshalb ACHT an, die 26 Karten fielen in VIER Reihen statt drei,
 * und jede Karte war 77 x 42 statt 88 x 62 - unter der 44-Punkt-Grenze,
 * ausgerechnet bei den Karten, die Fiona antippt, um „A wie Affe" zu
 * hoeren.
 *
 * Die Untergrenze ist ein Notnagel fuer sehr schmale Geraete, kein
 * Sollwert. Sie gehoert deshalb UNTER den gerechneten Wert, sonst
 * ueberstimmt der Notnagel die Rechnung. 56 Punkte greifen erst unterhalb
 * von rund 540 Punkten Gitterbreite - dort ist ohnehin nichts mehr in
 * neun Spalten unterzubringen.
 *
 * Das Muster ist dasselbe wie bei Regel 2: eine absolute Grenze neben
 * einer gerechneten macht die Rechnung still bedeutungslos. Und es fiel
 * nicht auf, weil `passt` zu kleine Flaechen nur als HINWEIS fuehrte. */
.rollen.vorlauf .kleber.viel{
  grid-template-columns:repeat(auto-fit,minmax(max(var(--kleber-eng-min),
    calc(100% / var(--spalten,9) - var(--r2))),1fr));
  max-width:min(900px, calc(var(--spalten,9) * var(--kleber-breit-eng)))}
/* Der Umriss nimmt sich den Platz, der uebrig ist.
 *
 * Die Zeilenhoehe des Gitters richtet sich nach der HOECHSTEN Karte -
 * „Mecklenburg-Vorpommern" braucht zwei Zeilen, also sind alle so hoch.
 * Bei fester Bildhoehe stand unter „Sachsen" ein Drittel leere Flaeche,
 * und der Umriss war oben ein Fleck. Jetzt waechst er in den Rest hinein,
 * und der Inhalt sitzt mittig statt oben. */
/* Mittig, aber mit FESTER Bildhoehe.
 *
 * Die Zeilenhoehe des Gitters richtet sich nach der hoechsten Karte -
 * „Mecklenburg-Vorpommern" braucht zwei Zeilen, also sind alle so hoch,
 * und unter „Sachsen" stand ein Drittel leere Flaeche.
 *
 * Der Versuch, den Umriss mit `flex:1` in diesen Rest wachsen zu lassen,
 * war der falsche Schluss: dann wachsen die KARTEN, und die zweite Reihe
 * fiel unten heraus. Das Loch war nie zu wenig Bild, sondern schlecht
 * verteilter Platz - und dagegen hilft Zentrieren, nicht Wachsen. */
/* Die Karte fuellt ihre Zeile, der Umriss fuellt die Karte.
 *
 * `min-height:0` an beiden: ohne das ist ein Flex-Kind mindestens so hoch
 * wie sein Inhalt, und die zweite Reihe faellt unten heraus - genau der
 * Fehlschlag, an dem der erste Versuch mit `flex:1` gescheitert ist. Der
 * Unterschied ist, dass die Hoehe jetzt vom GITTER kommt (`1fr` je Reihe)
 * und nicht vom Inhalt: sie kann das Band nicht ueberschreiten. */
/* `min-height:0`, aber KEIN `overflow:hidden`.
   Der Umriss darf mit der Zeile wachsen, dafuer ist `min-height:0` da.
   Beschnitten werden darf hier aber nichts: „Sachsen-Anhalt" ist zwei
   Punkte breiter als seine Karte und stand mit `overflow:hidden` als
   „Sachsen-Anhal" da - auf einem Bildschirm, der genau diese Namen
   beibringen soll. Der Name darf ueber den Rand ragen; abgeschnitten
   lernt ihn niemand. */
.rollen.vorlauf .aufkleber{padding:var(--r1);justify-content:center;
  min-height:0}
.rollen.vorlauf .aufkleber svg{flex:1 1 0;min-height:22px;height:auto}
.rollen.vorlauf .aufkleber .rechenkleber{font-size:var(--s1);flex:1 1 0;min-height:0}
/* Der Name wird hier UMGEBROCHEN, nicht abgeschnitten.
   Im Forscherbuch sind drei Punkte in Ordnung: dort steht, was man schon
   kennt. Hier soll das Kind den Namen LERNEN, und „Sachsen…" neben einem
   echten „Sachsen" ist schlimmer als kein Name. */
.rollen.vorlauf .aufkleber span{white-space:normal;overflow:visible;
  text-overflow:clip;hyphens:auto;overflow-wrap:break-word;line-height:1.1}
/* `break-word` und nicht `anywhere`.
   `anywhere` trennt, sobald es eng wird, und schrieb „Brandenbur / g" -
   ein einzelner Buchstabe auf einer Zeile. Auf einem Bildschirm, der
   Namen BEIBRINGEN soll, ist das schlimmer als eng. `break-word` trennt
   erst, wenn das Wort allein nicht auf eine Zeile passt, und nimmt
   vorher jede Fuge - „Mecklenburg-" vor „Vorpommern".
   Damit diese Fuge ueberhaupt in die Karte passt, ist die zweite Zeile
   kleiner und die Karte im Querformat etwas breiter. */
.rollen.vorlauf .aufkleber .dazu{font-size:calc(var(--s-klein) * 0.86)}
/* Das Bundesland unter der Hauptstadt: die ZUORDNUNG ist der Lernstoff
   dieser Ebene, nicht der Stadtname allein. */
.aufkleber .dazu{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);text-align:center;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.vorlauffuss{padding:var(--r3) var(--r4) var(--r4)}
/* Die zwei kleinen Knoepfe unter einer Kachel. Nebeneinander, damit sie
   die naechste Reihe nicht nach unten schieben. */
.kachelknoepfe{display:flex;gap:var(--r2);justify-content:center;flex-wrap:wrap}
/* Leer heisst weg. „anschauen" sitzt seit P16 als Auge IN der Kachel;
   uebrig bleiben „von vorne" und „Test", und die gibt es meistens nicht.
   Eine leere Zeile kostete auf dem kurzen Querformat 26 Punkte je Reihe. */
.kachelknoepfe:empty{display:none}
/* Das Auge in der Ecke der Kachel: volle 44 Punkte, ohne der Kachel viel
   zu nehmen (die misst 229 x 56). Es liegt DARUEBER, nicht darin - ein
   Knopf im Knopf waere kein gueltiges Markup. */
.kachelpaar{position:relative}
.kachelpaar .schau{position:absolute;top:var(--r0);right:var(--r0);z-index:2}
.sterne{display:flex;gap:var(--r1)}
.fortschritt{font-family:var(--f-ui);font-size:var(--s0);font-weight:600;color:var(--tinte-2);
  font-variant-numeric:tabular-nums}

/* `safe center` statt `center`, aus demselben Grund wie bei .seite: bei
   Ueberlauf schiebt zentrierter Inhalt nach OBEN UND UNTEN gleichzeitig
   hinaus. Auf dem iPhone hochkant lag die Ueberschrift deshalb ueber
   "Zurueck" und "Eltern" - beide sichtbar, beide nicht zu treffen. Die
   Regel stand seit v109 bei .seite und war hier nie nachgezogen: was
   zweimal dasteht, veraltet einmal. */
.mitte{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;
  gap:var(--r4);padding:var(--r4);min-height:0}
.titel{font-family:var(--f-ui);font-size:var(--s3);font-weight:800;letter-spacing:-.02em;text-align:center}
.unter{font-family:var(--f-ui);font-size:var(--s0);color:var(--tinte-2);text-align:center;max-width:34ch}
/* Raster statt umbrechender Reihe. Als Reihe stapelten sich die fuenf
   Ebenen auf dem iPhone hochkant untereinander - 734 Punkte in einem
   Kasten von 724, die letzte Ebene war nicht erreichbar. `auto-fit` legt
   so viele Spalten an, wie hineinpassen: zwei auf dem Telefon hochkant,
   fuenf auf dem Telefon quer. */
/* Die Untergrenze der Spalte ist die BREITE DES LAENGSTEN NAMENS, nicht
   eine runde Zahl. Bei 140 Punkten passten fuenf Ebenen nebeneinander -
   und "Bundeslaender" brach als "Bundeslaend/e/r" um, mit einem einzelnen
   r in der zweiten Zeile. Bei 240 waehlt das Raster lieber drei Spalten
   und zwei Reihen; dann steht jeder Name auf einer Zeile.
   `auto-fit` rechnet das je Bildschirm selbst aus - auf dem Telefon
   hochkant wird daraus eine Spalte. */
/* Jede Kachelwand bricht ZENTRIERT um (Q9).
 *
 * Ein Raster fuellt seine Reihen von links; bleibt die letzte halb leer,
 * klebt sie am linken Rand. Gemessen stand die letzte Reihe auf fuenf von
 * sieben Groessen 138 bis 278 Punkte aus der Mitte - und die Profilwahl
 * setzte im schmalen Fenster ihre vierte Kachel 228 Punkte weit nach
 * aussen, ganz allein. Das sieht aus wie ein Fehler und nicht wie das Ende
 * einer Liste. Ein Raster kann das nicht: seine Spuren stehen fest, auch
 * die leeren. Ein umbrechender Fluss zentriert jede Reihe, auch die letzte.
 *
 * Bezahlt wird es damit, dass die Kacheln eine feste Breite haben statt
 * sich zu dehnen: an den Reihenenden bleibt Luft. Die ist hier richtig -
 * gleich breite Kacheln lesen sich besser als drei gedehnte und eine
 * schmale. `max-width:100%` haelt sie auf dem Telefon hochkant im Bild. */
.wahl{display:flex;flex-wrap:wrap;gap:var(--r4);justify-content:center;
  align-content:flex-start;width:100%;max-width:1100px}
.wahl>*{flex:0 1 240px;max-width:100%}
/* Kurze Namen brauchen keine 240 Punkte. Die drei Stadtstaaten heissen
   "Berlin", "Hamburg", "Bremen" - mit dem grossen Mass rutschten sie in
   zwei Reihen und schoben den "Verstanden"-Knopf aus dem Bild. Ein Mass
   fuer alle waere hier das Bequeme, nicht das Richtige. */
.wahl.eng>*{flex-basis:150px}
/* Ein Fenster, das fuer DREI 240er-Spalten zu schmal ist (Q5).
 *
 * Gemessen, indem Kacheln dazugelegt wurden, bis es aus dem Bild lief:
 *
 *   iPhone quer  844x390    16 Kacheln passen (4 Reihen, 17 px frei)
 *   Fenster breit 1400x900  16 Kacheln passen (4 Reihen, 108 px frei)
 *   Fenster schmal 700x850  ELF laufen heraus (6 Reihen, -132 px)
 *
 * Auf dem Zielgeraet ist also nichts eng - dort stehen vier Kacheln je
 * Reihe. Eng ist allein das schmale Schreibtischfenster, und zwar aus
 * einem Grund: 700 Punkte reichen nicht fuer drei 240er-Spalten, also
 * werden es zwei, und aus zehn Kacheln werden fuenf Reihen.
 *
 * Drei schmale sind hier besser als zwei breite. Die Namen werden dabei
 * eine Stufe kleiner und die Ueberzeile faellt weg - genau wie im kurzen
 * Querformat, und aus demselben Grund: bei 200 Punkten Kachelbreite und
 * dem GROSSEN Namen laeuft er ins Wasserzeichen, und `lesbarkeit` hat das
 * schon einmal zerlegt (fuenf Namen von 4,7 auf 2,33:1).
 *
 * `min-height:441px` haelt es aus dem kurzen Querformat heraus - dort
 * gilt der eigene, kleinere Satz, und zwei Regeln, die sich um dieselbe
 * Zahl streiten, veralten getrennt. */
@media (min-height:441px) and (max-width:780px){
  .wahl>*{flex-basis:200px}
  .wahl.ebenen>*{flex-basis:200px}
  .kachel .ueber{display:none}
  .kachel .name{font-size:var(--s1)}
}
/* Die Ebenenwahl ist die einzige Kachelwand, die WAECHST.
 *
 * Profile sind vier, Welten sind drei - die Ebenen waren neun und sind
 * mit dem Ausschnitt Mittelamerika (A6) zehn geworden. Auf einem 700
 * Punkte breiten Fenster stehen sie in zwei Spalten, also fuenf Reihen zu
 * 125 Punkten, und die letzte Reihe stand drei Punkte unter dem
 * Fensterrand. Gemessen von `passt`, auf der Groesse „Fenster schmal".
 *
 * Die drei Punkte kommen aus dem Abstand ZWISCHEN den Reihen: vier
 * Luecken zu 16 Punkten. Auf 12 gesetzt sind es sechzehn Punkte weniger,
 * und die Wand passt wieder.
 *
 * Was hier NICHT steht, und warum: ein engeres Spaltenmass. Mit 200 statt
 * 240 werden daraus drei Spalten und vier Reihen - das passt auch, und
 * `passt` meldete gruen. `lesbarkeit` hat es zerlegt: bei 200 Punkten
 * Kachelbreite laeuft der Name in das Wasserzeichen, und fuenf
 * Kachelnamen fielen von ihren 4,7 auf 2,33:1. Zwei Tore, zwei Seiten
 * derselben Kachel - und das schmalere Mass war die schlechtere Antwort,
 * obwohl es die naheliegende war. */
/* Die Ebenenwahl bricht ZENTRIERT um, nicht linksbuendig (Q9).
 *
 * Ein Raster fuellt seine Reihen von links; bleibt die letzte halb leer,
 * klebt sie am linken Rand. Gemessen war die letzte Reihe auf fuenf von
 * sieben Groessen 138 bis 278 Punkte aus der Mitte - auf dem iPad hoch und
 * im schmalen Fenster stand dort eine EINZELNE Kachel ganz aussen, und das
 * sieht aus wie ein Fehler und nicht wie das Ende einer Liste.
 *
 * Ein Raster kann das nicht: seine Spuren stehen fest, auch die leeren.
 * Ein umbrechender Fluss kann es - er zentriert jede Reihe, auch die
 * letzte. Bezahlt wird es damit, dass die Kacheln eine feste Breite haben
 * statt sich zu dehnen; auf breiten Schirmen bleibt an den Reihenenden
 * Luft, und die ist hier richtig: zwoelf gleich breite Kacheln lesen sich
 * besser als acht gedehnte und vier schmale.
 *
 * Die Breiten sind dieselben wie vorher, nur als Flussmass statt als
 * Spurenmass. */
.wahl.ebenen{gap:var(--r3);display:flex;flex-wrap:wrap;
  justify-content:center;align-content:flex-start}
.wahl.ebenen>*{flex:0 0 240px;max-width:100%}
/* AB ELF EBENEN wird die Kachel schmaler (Q27).
 *
 * `passt` meldet seit Fassungen als Hinweis: „die Wand ist voll - 10
 * Kacheln stehen da, 10 passen. Die 11. laeuft hier aus dem Bild." Das
 * galt fuer das schmale Schreibtischfenster (700 x 850), wo zwei Kacheln
 * je Reihe stehen und fuenf Reihen die Hoehe fuellen. Die elfte Ebene
 * haette also nicht die Kachelwand gesprengt, sondern die Auslieferung.
 *
 * Schmaler statt niedriger: die Hoehe traegt das Bild, die Breite traegt
 * nur den Namen. Bei 200 statt 240 stehen im schmalen Fenster drei je
 * Reihe, und zwoelf Kacheln brauchen vier Reihen statt sechs.
 *
 * `:has()` statt eines Merkmals im Markup - dieselbe Ueberlegung wie bei
 * der Weltenwahl mit ihren drei Karten: die Zahl der Kacheln ist eine
 * Eigenschaft dieses Bildschirms, keine Auskunft, die das Programm
 * mitschicken muesste.
 *
 * Und es ist HEUTE zu messen, obwohl es die elfte Ebene noch nicht gibt:
 * `passt` klont Kacheln, um die Kapazitaet zu bestimmen - die Regel
 * greift dabei mit. */
.wahl.ebenen:has(> :nth-child(11))>*{flex-basis:200px}
/* ---- Die Kachelsprache (R2, Fassung „B · Bild" auf Weiss) -------------
   Auf weissem Grund traegt nicht mehr die Flaeche, sondern der RAND: 26 %
   Fuellung aus dem eigenen Ton, 52 % Rand daraus. Und jede Kachel zeigt
   IHREN Umriss als Wasserzeichen - ein Kind, das noch nicht liest,
   erkennt Afrika am Bild und nicht am Wort.
   Der Umriss sitzt rechts und wird nach links ausgeblendet; ohne diese
   Maske lief er im Entwurf mitten durch das Wort „Bundeslaender". */
.kachel.bunt,.kachel.welt,.kachel.wer{
  /* Der Grund steht als MARKE da, nicht nur als Wert: die kleine Zeile
     auf der Profilkachel braucht ihn noch einmal (siehe `.rolle`), und
     zweimal derselbe `color-mix` waeren zwei, die getrennt veralten. */
  --kachelgrund:color-mix(in oklab, var(--ton) 26%, var(--papier));
  background:var(--kachelgrund);
  border:var(--strich) solid color-mix(in oklab, var(--ton) 52%, var(--papier))}
/* Das Wasserzeichen liegt GANZ in der Kachel. Bei 150 % Hoehe lief es
   oben und unten heraus: Afrika war ein Fleck, Deutschland ein Schmier -
   erkennbar war keins von beiden. Die Hoehe steht hier und nur hier, je
   Kachelart einmal; am Aufruf steht keine Zahl mehr. */
.kachel .silhouette{position:absolute;right:0;top:50%;translate:0 -50%;
  height:86%;max-width:52%;opacity:.34;pointer-events:none;color:var(--ton)}
/* Die Ebenenwahl: das BILD OBEN, der Name darunter (Q8).
 *
 * Bis Q7 war das Bild ein Wasserzeichen HINTER dem Namen. Gemessen lagen
 * davon bei Nordamerika 78 % unter den eigenen Buchstaben, bei
 * Mittelamerika 66 %, bei den Bundeslaendern 59 %. Fuer Fiona IST das Bild
 * der Name - sie liest nicht -, und ein Name unter Buchstaben ist keiner.
 *
 * DIE RECHNUNG, an der es zweimal gescheitert ist. Die Wand hat auf dem
 * Zielgeraet (iPhone quer MIT Leiste) 266 Punkte Hoehe. Verteilt auf VIER
 * Reihen sind das 66 je Reihe - eine 56er-Kachel mit einem 46er
 * Wasserzeichen. Verteilt auf ZWEI Reihen sind es 133, also eine
 * 123er-Kachel mit 59 Punkten fuer das Bild. Die Hoehe ist da; sie steckt
 * in der Zahl der Reihen.
 *
 * Deshalb ist die Kachel schmal: FUENF je Reihe statt drei, damit neun
 * Ebenen in zwei Reihen stehen. Wer hier die Spalten wieder breiter macht,
 * bekommt drei Reihen und damit ein kleineres Bild als vorher.
 *
 * Der Vorschau-Knopf sitzt unten rechts und traegt hier keinen Ring: oben
 * beruehrte er die Ecke des Bildes (bei „Kontinente" lag er auf
 * Groenland), mit Ring stiess er an die Enden der langen Namen. Seine
 * Trefferflaeche bleibt 44 Punkte - `passt` misst sie, nicht den Ring. */
.wahl.ebenen .kachel{min-height:112px;justify-content:flex-end;
  padding:var(--r2) var(--r1)}
/* Die Hoehe des Bildes haengt an der Kachel, nicht an einer festen Zahl:
   auf dem iPad ist die Kachel hoeher, und eine feste Zahl haette das Bild
   dort KLEINER gemacht als das alte Wasserzeichen (gemessen: Asien 69
   statt 125). `height:auto` mit `top` und `bottom` geht bei einem SVG
   nicht - ein ersetztes Element nimmt dann seine eigene Hoehe, und
   Suedamerika wurde 109 Punkte hoch. Die 62 sind Namenszeile plus
   Fortschrittszeile plus Rand. */
.wahl.ebenen .kachel .silhouette{left:50%;right:auto;top:var(--r1);bottom:auto;
  height:calc(100% - 62px);translate:-50% 0;max-width:82%;opacity:.9}
/* Die Ueberzeile („LÄNDER IN", „DEUTSCHLAND") faellt hier weg. Sie stand
   bisher OBEN in der Kachel - dort liegt jetzt das Bild, und `lesbarkeit`
   hat sofort gemeldet, was das kostet: 4,34:1 statt 4,5 am Tag, 3,35:1 am
   Abend. Auf dem Telefon war sie ohnehin schon ausgeblendet, mit der
   Begruendung, dass die Farbe die Einordnung mittraegt; jetzt gilt das
   ueberall, statt auf dem grossen Schirm etwas anderes zu zeigen. */
.wahl.ebenen .kachel .ueber{display:none}
.wahl.ebenen .kachel .name{font-size:var(--s0);text-align:center;width:100%}
/* Platz fuer das Auge unten rechts - eine Trefferflaeche breit. */
.wahl.ebenen .kachelfuss{padding-right:var(--r8)}
/* Das Auge bleibt nackt - als einzige Bedienstelle der App, und mit
   Grund (Q16 nachgemessen).
   Seit Q15 hat jeder Knopf Flaeche und Kante. Dem Auge dieselbe zu geben
   war ein Versuch und ein Fehlschlag: auf dem Zielgeraet ist die Kachel
   112 Punkte hoch, der Knopf 44 - eine gefuellte Scheibe dort ist ein
   Viertel der Kachel, sie legt sich ueber den Namen und ragt ueber die
   Kante hinaus. Angesehen und verworfen. Was bleibt, ist ein Zeichen auf
   der Kachel; dass es zu druecken ist, traegt seine Trefferflaeche, nicht
   sein Aussehen. */
.wahl.ebenen .kachelpaar .schau{top:auto;bottom:var(--r0);right:var(--r0);
  background:transparent;border-color:transparent;box-shadow:none}
.kachel.welt .silhouette{height:80%;max-width:76%}
/* Auf dem GROSSEN Schirm darf die Ebenenkachel hoeher sein (Q26).
 *
 * Nachgemessen mit denselben Zahlen wie auf dem Telefon, und das Ergebnis
 * ist verkehrt herum: auf dem iPad ist die Kachel 240 breit und trotzdem
 * nur 112 hoch, das Bild misst 48 Punkte - WENIGER als die 63 auf dem
 * Telefon. Mehr Platz, kleineres Bild.
 *
 * Der Platz steht dabei leer: auf 1180 x 820 endet die Wand bei 657, das
 * sind 163 Punkte. Bei drei Reihen sind 48 je Reihe zu haben; genommen
 * werden sie, und das Bild waechst von 48 auf 98 mit, weil sein Abzug
 * (62) an der Kachelhoehe haengt und nicht an einer festen Zahl.
 *
 * Die Grenze ist NICHT der iPad, sondern das schmale Schreibtischfenster
 * (700 x 850): dort stehen zwei Kacheln je Reihe, also fuenf Reihen, und
 * die Wand endet bei 800 von 850 - zehn Punkte je Reihe waeren zu haben,
 * mehr nicht. Deshalb greift die Regel erst ab 900 Punkten Breite UND 700
 * Punkten Hoehe. Ohne diese zweite Bedingung waere aus einer Wohltat fuer
 * das iPad ein Ueberlauf im Fenster geworden.
 *
 * 760 und nicht 900: mit 900 fiel das iPad HOCHKANT (820 breit) durch die
 * Schwelle, obwohl dort 279 Punkte leer stehen und vier Reihen sie
 * verteilen. Das schmale Fenster hat 700 und bleibt draussen. */
@media (min-width:760px) and (min-height:700px){
  .wahl.ebenen .kachel{min-height:160px}
}
.kachel .silhouette path{fill:currentColor}
/* Die Rechenzeichen werden gezogen, nicht gefuellt. */
.kachel .silhouette.gezeichnet path{fill:none}
.kachel .silhouette.gezeichnet{opacity:.26;max-width:44%}
.kachel.welt .silhouette.gezeichnet{max-width:56%}
.kachel.bunt,.kachel.welt,.kachel.wer{position:relative;overflow:hidden}
/* Der Inhalt liegt UEBER dem Wasserzeichen — aber das Wasserzeichen ist
   selbst ein Kind und darf nicht mitgenommen werden. Ohne `:not()` hat
   diese Zeile es aus der absoluten Lage geholt (hoehere Spezifitaet als
   `.kachel .silhouette`), es wurde zum Flex-Element in seiner
   Eigengroesse, und die Kacheln wuchsen auf das Vierfache. */
.kachel.bunt>*:not(.silhouette),.kachel.welt>*:not(.silhouette),
.kachel.wer>*:not(.silhouette,.streu){position:relative}
/* ---- Der Streu auf den Profilkacheln (G12) ---------------------------
   `.streu` muss in `:not()` stehen, genau wie `.silhouette` darueber -
   diese Zeile hat drei Klassen und schlaegt `.kachel .streu` mit zweien.
   Anders als beim Wasserzeichen waechst die Kachel dann NICHT: die
   Motive liegen selbst absolut, also faellt der Streukasten auf 0 x 0
   zusammen und nimmt sie mit. Gemessen: die grosse Muschel sass 24
   Punkte ueber dem oberen Rand der Kachel.

   Die Deckung: 0,58. Bei 0,42 war der Streu blass - Leuchtgelb leuchtete
   nicht mehr, und danach war ausdruecklich gefragt.

   Hier stand: „und kein Tor sieht das". Falsch. `lesbarkeit` sucht sehr
   wohl nach absolut liegenden GESCHWISTERN hinter dem Text - es tut das
   seit R2 wegen des Wasserzeichens. Es hat den Streu gefunden und sechs
   Texte rot gemeldet; sein Modell passte nur nicht (siehe dort). Der
   Kontrast ist jetzt gemessen und gruen, nicht behauptet. */
.kachel .streu{position:absolute;inset:0;pointer-events:none;opacity:.58;
  overflow:hidden;border-radius:inherit}
.kachel .streu i{position:absolute;line-height:0;display:block;
  transform:translate(-50%,-50%) rotate(var(--dreh,0deg))}
.kachel .streu i>svg{width:100%;height:100%;display:block;overflow:visible}
.kachel .streu .k{width:26px;height:26px}
.kachel .streu .m{width:38px;height:38px}
.kachel .streu .g{width:78px;height:78px}
/* Der Verlauf fuer die Augen wird abgelegt, nicht gezeigt. `display:none`
   ginge nicht: ein Verlauf in einem ausgeblendeten SVG wird in Safari
   nicht aufgeloest, und die Augen waeren schwarz. */
.streu-defs{position:absolute;width:0;height:0}
/* Auf dem Telefon quer ist die Kachel rund 190 x 125 Punkte gross. Die
   grosse Muschel mit 78 Punkten waere dort mehr als die halbe Hoehe -
   sie ueberdeckte den Namen, statt hinter ihm zu liegen. */
@media (max-height:440px){
  .kachel .streu .k{width:21px;height:21px}
  .kachel .streu .m{width:29px;height:29px}
  .kachel .streu .g{width:58px;height:58px}
}
/* Die Fachwelten (D4). Zwei grosse Karten statt neun Kacheln: das Kind
   waehlt erst das Fach. Sie duerfen breiter sein als eine Ebenenkachel -
   es sind zwei, und sie sollen unverwechselbar sein. */
/* Die WELTENWAHL bleibt ein Raster.
   Sie traegt zwei bis drei grosse Kacheln, die sich ueber die Breite
   dehnen und eine Mindesthoehe haben - im Fluss stehen sie in ihrer
   Eigenbreite, brechen auf dem Telefon in zwei Reihen um und laufen unten
   heraus (gemessen: 104 Punkte). Und das Problem, das der Fluss loest,
   hat sie gar nicht: bei drei Kacheln in einer Reihe gibt es keine halb
   leere letzte. */
.wahl.weltwahl{display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));
  max-width:760px}
/* Seit der dritten Welt (N2a) sind es bei Fiona DREI Karten, bei Lea und
   den Eltern zwei. Mit 260 Punkten Mindestbreite passten drei nicht mehr
   nebeneinander: die dritte rutschte in eine zweite Reihe und stand halb
   unter dem Bildrand - gesehen auf der Aufnahme, nicht gemessen.
   Ab drei Karten wird die Mindestbreite deshalb kleiner und die Kachel
   flacher. `:has()` statt eines Merkmals im Markup: die Zahl der Karten
   ist eine Eigenschaft dieses Bildschirms, keine Auskunft, die das
   Programm mitschicken muesste. */
.wahl.weltwahl:has(> :nth-child(3)){
  grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));max-width:1000px}
.wahl.weltwahl:has(> :nth-child(3)) .kachel.welt{min-height:180px}
/* Und ab der VIERTEN Welt noch eine Stufe (Q30).
 *
 * Gemessen, bevor es sie gibt - `passt` klont Kacheln und meldet die
 * Kapazitaet. Mit 200 Punkten Mindestbreite passen auf dem Zielgeraet
 * drei nebeneinander; die vierte bricht um, und die zweite Reihe endet
 * bei 519 von 390 Punkten. Mit Uhr und Wischstreifen bei 540. Eine
 * vierte Welt waere also nicht knapp, sondern unsichtbar.
 *
 * 150 statt 200: vier mal 150 plus drei Luecken sind 624 Punkte, und
 * nutzbar sind auf dem Zielgeraet 816, mit Leiste 711, auf dem kleinsten
 * Geraet (iPhone SE quer) 651. Es passt also ueberall in EINE Reihe, und
 * am knappsten dort, wo es immer am knappsten ist.
 *
 * Der Preis: das Weltbild schrumpft auf dem kleinsten Geraet von 159 auf
 * 117 Punkte. Das ist der Preis fuer eine vierte Welt und faellig, wenn
 * sie kommt - heute kostet die Regel nichts, weil `:has()` erst ab der
 * vierten Kachel greift. */
.wahl.weltwahl:has(> :nth-child(4)){
  grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));max-width:1200px}
/* Eine Welt ist keine Zeile.
   Der erste Entwurf gab den beiden Karten dieselbe Hoehe wie einer
   Ebenenkachel - auf dem Zielgeraet standen dann zwei breite Balken unter
   einer halbleeren Flaeche. `passt` war gruen; gesehen hat es erst der
   Blick auf die Aufnahme (Regel 4). Sie bekommen deshalb eine Mindesthoehe
   und ein grosses Bild: der Umriss ist das einzige, was ein Kind, das
   nicht liest, auf diesem Bildschirm unterscheiden kann. Das kleine
   Eckzeichen stand daneben und sagte dasselbe noch einmal, nur kleiner -
   es ist mit R2 weggefallen. */
.kachel.welt{gap:var(--r2);align-items:flex-start;justify-content:flex-end;
  min-height:210px}
.kachel.welt .name{font-size:var(--s3)}
/* `min-width:0` ist hier kein Schoenheitsfehler, sondern noetig: ein
   Rasterfeld ist von sich aus mindestens so breit wie sein laengstes Wort,
   und "Landeshauptstaedte" sprengte damit die Spalte - auf vier von sechs
   Groessen stand die Kachel bis zu 36 Punkte ausserhalb des Fensters.
   Die Untergrenze kommt jetzt von der Spalte (minmax), nicht vom Wort;
   `hyphens:auto` trennt es sauber, statt es abzuschneiden.
   `max-width` haelt die Kacheln auf grossen Schirmen beisammen - ohne das
   werden aus zwei Profilen zwei 550 Punkte breite Balken. */
.kachel{background:var(--papier);border:var(--strich) solid var(--knopf-rand);
  border-radius:var(--rund-flaeche);
  box-shadow:0 var(--kante) 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht);
  padding:var(--r6) var(--r8);
  min-width:0;width:100%;max-width:280px;justify-self:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:var(--r2);
  transition:transform var(--d-tipp) var(--k-standard),box-shadow var(--d-tipp) var(--k-standard),
    border-color var(--d-tipp) var(--k-standard)}
.kachel:active{transform:translateY(3px);
  box-shadow:0 0 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
@media (hover:hover){.kachel:hover{border-color:var(--primaer-rand);
  box-shadow:0 var(--kante) 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht),0 0 0 var(--ring) var(--akzent-h)}}
/* Ohne `min-width:0` ist ein Flex-Kind mindestens so breit wie sein
   laengstes Wort - "Landeshauptstaedte" stand dann quer ueber den Rand
   der eigenen Kachel hinaus. Die Kachel selbst sass richtig, ihr Inhalt
   nicht: das Tor `passt` mass Kaesten und hat es durchgelassen. Es misst
   jetzt auch, ob der Text in seinen Knopf passt. */
.kachel>*{min-width:0;max-width:100%}
.kachel .name{font-family:var(--f-lesen);font-size:var(--s2);font-weight:700;
  color:var(--auf-flaeche);hyphens:auto;overflow-wrap:break-word;text-align:center;
  line-height:1.15}
.kachel .rolle{font-family:var(--f-ui);font-size:var(--s-klein);color:var(--tinte-2)}
/* „heute schon geübt" (A4h) - eine RUHIGE Zeile.
   Kein Abzeichen, keine Farbe, kein Ausrufezeichen: sie soll gesehen
   werden und niemanden treiben. Wer gestern geuebt hat und heute nicht,
   sieht hier nichts - und das ist kein Vorwurf, sondern eine leere
   Stelle. */
.kachel .heute{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:600;
  color:var(--gut)}
/* Auf einer Kachel MIT Streu ist der Grund nicht mehr ruhig, und die
   kleine Zeile stand mit 4,46:1 knapp unter der Grenze - gemessen, nicht
   geschaetzt. Repariert wird die Ursache, nicht das Symptom: nicht der
   Streu wird blasser (die Leuchtfarben waren ausdruecklich gewuenscht),
   sondern der Text auf dem unruhigen Grund dunkler. `:has()` fragt die
   Kachel selbst - das Programm muss nichts mitschicken.

   Das reichte nicht (Q14). Dunkler hilft nur, solange unter dem Text
   etwas HELLES liegt; liegt dort der blaue Fisch, sind es 4,32:1 statt
   4,5 - und WELCHES Motiv gerade darunter liegt, entscheidet der
   Zeilenumbruch. Auf dem Runner brach die Zeile eine Stelle anders um
   als hier, und die Auslieferung war rot, waehrend hier alles gruen war.

   Eine Zahl, die vom Zeilenumbruch abhaengt, ist keine Zusage. Die Zeile
   bekommt deshalb ihren eigenen Grund - genau den der Kachel. Sichtbar
   ist das kaum (dieselbe Farbe), aber der Streu liegt jetzt HINTER dem
   Text und nicht mehr unter ihm, und der Kontrast ist wieder eine feste
   Zahl statt eines Wuerfels. */
.kachel:has(.streu) .rolle{color:var(--tinte);
  background:var(--kachelgrund);border-radius:var(--r2);
  padding:var(--r0) var(--r2)}
/* Statt "0 von 4": drei Sterne und die Zahl der Aufkleber.
   Fiona liest keine Zahlen - aber sie sieht, ob ein Stern voll ist. */
.kachel .kachelfuss{display:flex;flex-direction:column;align-items:stretch;
  gap:var(--r1);width:100%}
.kachel .stand{display:flex;align-items:center;gap:var(--r3);min-height:22px}
/* Das „/60" steht KLEINER als die eigene Zahl (S2): was das Kind
   gesammelt hat, ist die Nachricht; wovon, ist der Massstab.
   Kleiner und leichter, aber NICHT blasser: mit `--tinte-3` kam es im
   Abendanstrich auf 3,1:1 gegen den Kachelgrund - noetig sind 4,5. Das
   Tor `lesbarkeit` hat es an fuenf Kacheln gemeldet, bevor es jemand
   sehen konnte. Ein Unterschied, den man nur mit hellerer Farbe
   hinbekommt, ist auf einer bunten Kachel keiner. */
/* Die Luecke des Flex-Kastens wieder heraus: sie sitzt zwischen Zeichen,
   Zahl UND Nenner, und aus „2/54" wurde „2 /54". Mit derselben Marke
   zurueckgenommen, mit der sie entsteht: was zweimal dasteht, veraltet
   einmal (Regel 6) - hier waere es dieselbe Zahl zum zweiten Mal. */
.klebermarke small{font-size:.78em;font-weight:600;
  margin-inline-start:calc(var(--r1) * -1)}
.klebermarke{display:inline-flex;align-items:center;gap:var(--r1);font-family:var(--f-ui);
  font-size:var(--s-klein);font-weight:700;color:var(--tinte-2)}
/* Der leere Aufkleber muss noch zu SEHEN sein - mit --stern-aus war er auf
   der Kachel praktisch unsichtbar, und damit stand da eine nackte Null. */
/* Auf einer Kachel steht die Zahl auf dem Wasserzeichen, nicht auf der
   nackten Fuellung - `--tinte-2` reichte dort nicht mehr. */
.kachel .klebermarke{color:var(--tinte)}
.klebermarke svg{stroke:var(--tinte-3);fill:none}
.klebermarke:not([data-leer]) svg{stroke:var(--tinte);
  fill:color-mix(in oklab, var(--stern-an) 80%, var(--papier))}
/* Die Null steht in --tinte-2 wie jede andere Zahl auch. Mit --tinte-3
   kam sie auf 3,8:1 gegen die bunten Kacheln - das Tor `lesbarkeit` hat
   sie sechzehnmal gemeldet, in Tag und Abend. Der Unterschied zwischen
   „schon welche" und „noch keine" steckt im Zeichen, nicht in der
   Lesbarkeit der Zahl. */
/* Jede Ebene traegt ihre eigene Farbe. Acht weisse Karten nebeneinander
   sehen aus wie eine Tabelle; acht farbige sehen aus wie ein Spiel.
   Der Ton kommt als `--ton` aus dem Markup und wird hier nur GEMISCHT -
   damit steht kein Farbwert ausserhalb von marken.css.

   Gemischt wird in **oklab**, nicht in oklch. In oklch hat Weiss den
   Farbton 0 (Rot), und der wird mitgemischt: aus 26 % Gruen in Weiss wurde
   ein Pfirsichton. Alle acht Kacheln sahen rosa aus, waehrend die
   Ueberzeile daneben ihre richtige Farbe trug. oklab hat keinen
   Farbtonkanal und mischt deshalb das, was man meint. */
.kachel.bunt{padding:var(--r4) var(--r6);
  background:color-mix(in oklab, var(--ton) 26%, var(--papier));
  border-color:color-mix(in oklab, var(--ton) 55%, var(--papier));
  box-shadow:0 var(--kante) 0 color-mix(in oklab, var(--ton) 62%, var(--tinte-3)),
             inset 0 var(--strich) 0 var(--knopf-licht);
  align-items:flex-start;text-align:left;gap:var(--r1)}
.kachel.bunt:active{box-shadow:0 0 0 color-mix(in oklab, var(--ton) 62%, var(--tinte-3)),
             inset 0 var(--strich) 0 var(--knopf-licht)}
.kachel .ueber{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in oklab, var(--ton) 28%, var(--tinte))}
.kachel.bunt .name{text-align:left;line-height:1.1;font-size:var(--s1)}
.kachel.bunt .balken{background:color-mix(in oklab, var(--ton) 45%, var(--papier))}
.kachel.bunt .balken i{background:color-mix(in oklab, var(--ton) 75%, var(--tinte))}
/* ---- Abzeichen (D2) --------------------------------------------------
   Ein Abzeichen ist ein SATZ mit einem Bild davor, keine Kachel mit einer
   Zahl. Deshalb liegt der Text neben dem Zeichen und nicht darunter: er
   ist die Belohnung, das Bild ist nur die Marke dafuer.
   Die Mindestbreite ist grosszuegig - „Du kennst alle Nachbarn von
   Deutschland" braucht Platz, und zwei Zeilen sind besser als ein
   Abschneiden. */
/* Flex statt Raster: bei EINEM Abzeichen zog `auto-fit` den einen Kasten
   ueber die ganze Breite - ein Satz von vier Woertern in einem Band von
   1600 Punkten. Gesehen auf der Aufnahme, nicht gemessen. */
/* --- Die Kapitelreiter im Forscherbuch (Q44) --------------------------
 *
 * Ein Streifen ueber dem Buch, in dem JEDE Gruppe steht - Zahl gross in
 * ihrer Farbe, Name klein darunter. Er rollt waagerecht, wenn es viele
 * werden; die ersten sechs stehen auf 844 Punkten nebeneinander.
 *
 * `flex:0 0 auto` an beiden Enden: der Streifen darf NICHT schrumpfen,
 * sonst nimmt ihm ein volles Buch genau die Hoehe, wegen der es ihn
 * gibt. Und `min-height` statt einer festen Hoehe, weil der Name auf
 * schmalen Geraeten umbricht. */
.buchreiter{flex:0 0 auto;display:flex;gap:var(--r2);overflow-x:auto;overflow-y:hidden;
  padding:0 var(--r4) var(--r2);-webkit-overflow-scrolling:touch;touch-action:pan-x;
  scrollbar-width:none}
.buchreiter::-webkit-scrollbar{display:none}
/* `flex:1 1 auto` und nicht `0 0 auto`: die Reiter TEILEN sich die Breite.
   Gemessen auf 844 Punkten: sieben Kapitel mit fester Breite waren 78 %
   des letzten - der stand halb im Streifen, und genau das soll er nicht.
   Mit `min-width` als Boden bleibt jeder mit dem Daumen zu treffen; wird
   es noch enger, rollt der Streifen (`overflow-x`) statt zu quetschen. */
.reiter{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  gap:0;min-width:66px;max-width:170px;min-height:44px;padding:var(--r2) var(--r3);
  border:var(--strich) solid var(--linie);border-radius:var(--rund-karte);
  background:var(--papier);color:var(--tinte-2);cursor:pointer;
  font-family:var(--f-ui);line-height:1.1}
/* `.reiterzahl` und nicht `.zahl`: die gibt es schon, sie ist eine TASTE
   auf dem Rechenfeld (Kasten, Rand, Druckwirkung). Der erste Anlauf hiess
   `.zahl`, und die Kapitelzahl sass prompt in einem blauen Tastenkasten -
   zu sehen war es sofort, zu erklaeren erst nach dem Blick ins
   Stilblatt. */
.reiter .reiterzahl{font-size:var(--s2);font-weight:800;line-height:1.05}
/* `min(13ch, 100%)` und nicht nur `13ch`: in einer Spalte mit
   `align-items:center` nimmt das Wort seine eigene Breite und schert
   sich nicht um den Reiter. Gemessen auf 390 x 844 mit fuenf Kapiteln -
   das ist der Stand, den ein Kind mit Tieren hat: „Bundesländer" stand
   13 Punkte ueber seinem Knopf und griff mit 8 % in den Nachbarn.
   Sichtbar wurde es erst, als `passt` das Buch zum ersten Mal mit fuenf
   Kapiteln gesehen hat. Rollen waere hier keine Loesung - ein Reiter,
   der aus dem Streifen gerollt ist, ist fuer dieses Tor genauso weg wie
   einer unter dem Rand. */
.reiter .was{font-size:var(--s-klein);font-weight:700;white-space:nowrap;
  max-width:min(13ch, 100%);overflow:hidden;text-overflow:ellipsis}
/* SCHMAL wird UMGEBROCHEN statt abgeschnitten.
   Auf 390 Punkten teilen sich fuenf Kapitel die Breite und jeder Reiter
   ist 66 Punkte breit - „Bundesländer" braucht 95. Das Auslassungs-
   zeichen versteckt das nur: gemessen griff das Wort mit 8 % in den
   Nachbarn, weil die Schrift ueber ihre Zelle hinausreicht, auch wo sie
   beschnitten wird. Zwei kurze Zeilen sind haesslicher und richtig. */
@media (max-width:430px){
  .reiter .was{white-space:normal;overflow-wrap:anywhere;max-width:100%;
    font-size:calc(var(--s-klein) * .84);line-height:1.05}
}
/* Offen und zu sprechen dieselbe Sprache wie alle Knoepfe hier: das
   geschlossene Kapitel liegt flach, das offene steht auf seiner Kante und
   traegt volle Tinte. Die FARBE traegt schon die Zahl - ein zweiter
   Farbtraeger daneben waere keine Auskunft mehr, sondern Laerm. */
.reiter{box-shadow:0 0 0 var(--knopf-kante)}
.reiter.da{color:var(--tinte);border-color:var(--knopf-kante);
  box-shadow:0 var(--kante-flach) 0 var(--knopf-kante),
             inset 0 var(--strich) 0 var(--knopf-licht)}
/* Der Satz zum Mitnehmen im Buch (Q46).
   Leiser als eine Ueberschrift und ohne Kasten: er ist eine Zugabe, keine
   Aufgabe. `cursor:default` - getippt wird die KARTE, nicht der Satz; ein
   Text, der wie ein Knopf aussieht und keiner ist, ist eine Luege. */
.buchsatz{font-family:var(--f-lesen);font-size:var(--s-klein);font-weight:600;
  color:var(--tinte-2);margin:var(--r2) 0 0;max-width:52ch;cursor:default}
.abzeichen{display:flex;flex-wrap:wrap;gap:var(--r3);width:100%}
.abz{flex:1 1 300px;max-width:520px}
.abz{display:flex;align-items:center;gap:var(--r3);text-align:left;
  padding:var(--r3);border-radius:var(--rund-karte);min-height:56px;
  background:var(--papier);border:var(--strich) solid var(--linie);
  font-family:var(--f-lesen);font-size:var(--s0);color:var(--tinte);
  cursor:pointer}
.abz svg{flex:0 0 auto}
.abz .was{line-height:1.15}
/* Das offene traegt die Farbe des Hinweises, nicht die des Fehlers: es ist
   der naechste Schritt, keine Mahnung. */
.abz.offen{background:var(--nochmal-h);border-color:var(--achtung);color:var(--tinte-2)}
.abz.offen small{display:block;font-family:var(--f-ui);font-size:var(--s-klein);
  color:var(--tinte-2)}
.abz.da{background:var(--gut-h);border-color:var(--gut)}
/* Auf dem Endbildschirm, wenn eines DAZUGEKOMMEN ist. Eine Zeile, mittig,
   in derselben Sprache wie der Rest des Bildschirms. */
/* --- Fionas Tiere (T1) ---------------------------------------------
 *
 * Das Tier auf dem Endbildschirm und die Wand im Buch. Zwei Groessen,
 * eine Form: `.tierbild` ist immer quadratisch, weil der Rahmen aller
 * Tiere `0 0 48 48` ist - der Elefant soll nicht groesser sein als die
 * Maus, nur weil er breiter gezeichnet ist.
 */
.tierbild{width:100%;height:auto;aspect-ratio:1;display:block}
.tierneu{display:flex;align-items:center;justify-content:center;gap:var(--r3);
  margin:var(--r2) 0;padding:var(--r1) var(--r4) var(--r1) var(--r2);
  border-radius:var(--rund-voll);
  background:var(--gut-h);border:var(--strich) solid var(--gut);
  font-family:var(--f-lesen);font-size:var(--s0);color:var(--tinte);
  max-width:100%}
/* Der Gorilla kommt nach einer Runde, die nicht geklappt hat - also im
   ruhigen Ton und nicht im gruenen. Kein Rot: er ist kein Fehler, er ist
   der, der wiederkommt. */
.tierneu.hilft{background:var(--grund-2);border-color:var(--linie)}
.tierneu .tierbild{width:44px;flex:none}
/* Ein Lebensraum ist die Einheit: Ueberschrift und drei Tiere darunter.
   Die Reihe steht fuer sich, damit man sieht, was zusammengehoert. */
.tierraum{width:100%;margin-bottom:var(--r2)}
.tierraum h4{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:700;
  color:var(--tinte-2);margin:0 0 var(--r1)}
/* FESTE Breite, kein `1fr`: bei drei Tieren in einer `auto-fit`-Spur
   zieht jede Kachel ein Drittel des Bildschirms an sich, und der Wal war
   gemessen 400 Punkte breit. Ein Aufkleber ist so gross wie ein
   Aufkleber. */
.tierwand{display:flex;flex-wrap:wrap;gap:var(--r2);width:100%}
/* EIN AUFKLEBER, kein Kasten.
 *
 * Drei Dinge machen den Unterschied, und alle drei stehen hier:
 *   der weisse RAND ringsum   - so ist ein Aufkleber gestanzt
 *   zwei Lagen SCHATTEN       - eine enge Kante, eine weite Schwebe
 *   ein GLANZ von links oben  - Papier im Licht
 *
 * Der Grund ist pastellfarben und kommt je Tier aus den DATEN (`ton`):
 * der Fuchs klebt auf Warm, der Pinguin auf Kalt. Ein Aufkleber, der auf
 * Weiss klebt, sieht aus wie ein Kaestchen mit einem Bild darin.
 *
 * KEIN `filter`, kein `blur` - nur `box-shadow` und ein Verlauf. Auf iOS
 * schwaerzt ein Filter ueber einem gezeichneten Bild nach etwa einer
 * Sekunde den ganzen Kasten (Regel 13: Safari-Falle, kein Filter, wo ein
 * gebackener Verlauf reicht). Das Verblassen der fehlenden Tiere ist die
 * einzige Ausnahme - es trifft NUR das SVG, nicht den Aufkleber, und es
 * steht auf einem Bild, das sich nicht bewegt. */
.tierfeld{width:92px;flex:none;display:flex;flex-direction:column;align-items:center;
  gap:var(--r0);padding:var(--r1) var(--r1) var(--r0);
  border-radius:var(--r4);border:var(--kante-flach) solid var(--papier);
  background:var(--ton,var(--grund-2));box-shadow:var(--schatten-kleber);
  cursor:pointer;font:inherit;min-height:44px;position:relative;isolation:isolate}
/* Der Glanz: eine Ecke Licht, nicht die halbe Flaeche. Der erste Anlauf
   ging bis 34 % mit 55 % Deckung und hat jedes Tier ausgewaschen. */
.tierfeld::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--kleber-glanz);
  pointer-events:none}
/* `hyphens:auto` VOR `overflow-wrap`: sonst wird „Kängu|ru" mitten im
   Wort zerschnitten, ohne Strich - gesehen im Buch. Mit Trennung bricht
   der Browser dort, wo man ein Wort trennt, und setzt einen Bindestrich.
   `overflow-wrap` bleibt als Rueckfall fuer das eine lange Wort, das
   sich nicht trennen laesst. */
.tierfeld span{font-family:var(--f-lesen);font-size:calc(var(--s-klein) * .8);
  color:var(--tinte);text-align:center;line-height:1.15;
  max-width:100%;hyphens:auto;overflow-wrap:break-word;position:relative;z-index:1}
/* Die fehlenden: der Aufkleber bleibt ein Aufkleber, nur ohne Bild und
   ohne Farbe. Ein weggelassenes Kaestchen sagt nichts, ein leeres sagt
   „hier kommt noch etwas". */
.tierfeld:not(.da){background:var(--grund-2);box-shadow:var(--schatten-auf)}
.tierfeld:not(.da) span{color:var(--tinte-3)}
/* Die fehlenden bleiben SICHTBAR und werden nur blass - ein leeres
   Kaestchen sagt „hier kommt noch etwas", ein weggelassenes sagt nichts.
   Kein `opacity` auf dem ganzen Feld: der Rahmen soll seine Farbe
   behalten, damit die Wand ein Raster bleibt (dieselbe Lehre wie bei den
   Farbflecken in G18). */
.tierfeld:not(.da) .tierbild{opacity:.18;filter:grayscale(1)}
.tierneu .tierbild{filter:none}

/* ---------- Die Landschaft (T2) ---------------------------------------
   Ein voller Raum wird zur TUER: die Ueberschrift traegt die Kulisse als
   Streifen. Ein Kind, das nicht liest, sieht am Bild, wohin es geht. */
/* Die Raumreiter. Gemessen auf dem Zielgeraet: zehn Chips à 104 Punkte
   passen in zwei Reihen von je 44 - zusammen 96 Punkte. Ein Raum
   UNTEREINANDER kostet 160; fuenf davon lagen 689 Punkte unter dem
   Rand. */
.raumwahl{display:flex;flex-wrap:wrap;gap:var(--r1);width:100%;
  margin-bottom:var(--r2)}
.raumchip{display:flex;align-items:center;gap:var(--r1);
  padding:var(--r0) var(--r1) var(--r0) var(--r0);
  border:var(--kante-flach) solid var(--linie);border-radius:var(--r4);
  background:var(--grund-2);cursor:pointer;font:inherit;min-height:44px;
  color:var(--tinte-3)}
/* Das Tier auf dem Reiter: quadratisch wie auf dem Aufkleber, nur
   kleiner. Kein eigener Grund darunter - der Reiter hat schon einen,
   und zwei Kaesten ineinander sind bei 30 Punkten nur noch Rand. */
.raumchip .raumzeichen{width:30px;height:30px;flex:none;display:block}
.raumchip.leer .raumzeichen{opacity:.3;filter:grayscale(1)}
/* KEIN NAME auf dem Reiter. Zehn Reiter mit Namen brauchten auf dem
   Zielgeraet drei Reihen, und das Kapitel lag 92 Punkte unter dem Rand.
   Der Streifen ist die Auskunft - er zeigt die Landschaft selbst -, der
   Name steht darunter an der Tuer und wird beim Tippen gesprochen. */
.raumchip span{display:none}
.raumchip small{font-family:var(--f-ui);font-size:calc(var(--s-klein) * .74);
  color:var(--tinte-3)}
.raumchip.da{background:var(--papier);border-color:var(--tinte-3);color:var(--tinte)}
.raumchip.da small{color:var(--tinte-2)}
.raumauf{display:flex;align-items:center;gap:var(--r2);width:100%;
  margin:0 0 var(--r1);padding:var(--r0) var(--r2) var(--r0) var(--r0);
  border:var(--kante-flach) solid var(--linie);border-radius:var(--r4);
  background:var(--grund-2);cursor:pointer;font:inherit;min-height:44px;
  text-align:left;color:var(--tinte-2)}
.raumauf span{font-family:var(--f-ui);font-size:var(--s-klein);font-weight:700;
  flex:1 1 auto;min-width:0}
.raumauf svg.raumstreifen{width:64px;height:36px;flex:none;
  border-radius:var(--r2);display:block}
.raumauf:hover{border-color:var(--tinte-3)}

/* QUER IST DAS ZIELGERAET, und quer ist die Hoehe knapp: auf 844 x 390
   bleiben nach dem Kopf rund 318 Punkte. Ein Bild ueber die volle
   Breite waere bei 16:9 461 Punkte hoch - anderthalb Bildschirme fuer
   das eine, was man hier ansehen will.
   Deshalb steht das Bild LINKS und nimmt 58 % der Breite, die Bank
   rechts daneben. Der erste Anlauf liess das Bild von der HOEHE
   bestimmen: auf dem iPad war es dann 1146 x 726 gross, und die Bank
   daneben lag mit dreissig Tieren 2091 Punkte unter dem Rand. Ein
   Bildschirm, der auf dem kleinsten Geraet passt und auf dem groessten
   nicht, ist nicht geprueft, sondern geraten. */
.rollen.landschaft{display:flex;align-items:stretch;gap:var(--r2);
  overflow:hidden;padding-bottom:var(--r3)}
.szene{width:58%;max-width:58%;flex:0 0 auto;height:auto;aspect-ratio:16/9;
  align-self:flex-start;position:relative;border-radius:var(--r4);overflow:hidden;
  background:var(--ton,var(--grund-2));
  border:var(--strich) solid var(--papier);box-shadow:var(--schatten-kleber)}
.szene>svg.kulisse{position:absolute;inset:0;width:100%;height:100%;display:block}
/* `minmax(0,1fr)` und nicht `1fr`: eine Prozenthoehe im Platz misst sich
   an der Zeile, und eine `1fr`-Zeile misst sich am Inhalt. Gemessen: die
   Zeilen wurden 114 Punkte hoch in einem 156 Punkte hohen Band, und die
   vorderste Reihe stand halb unter dem Bildrand. */
/* DREI GLEICH HOHE REIHEN, und die Tiefe kommt aus der Bildgroesse.
   Der erste Anlauf gab der hintersten Reihe weniger Hoehe (1 : 1,3 :
   1,6) - das sah besser aus und machte die hinteren Plaetze auf dem
   kleinsten Geraet 33 Punkte hoch, also unter das Fingermass. Ein
   Bildschirm, auf dem ein Drittel der Ziele zu klein ist, ist keine
   Frage des Geschmacks. Jetzt sind die KAESTEN gleich und die TIERE
   verschieden gross; dieselbe Tiefe, dieselbe Trefferflaeche. */
.szeneinhalt{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:2% 0 1%}
.plaetze{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr))}
.platz{display:flex;align-items:flex-end;justify-content:center;
  padding:0 4% 2%;border:0;background:none;position:relative;
  min-height:0;min-width:0;cursor:pointer}
/* Der freie Platz zeigt sich nur als leiser Ring. Neun Ringe sind ein
   Angebot; neun Kaesten waeren ein Formular. */
.platz.frei::after{content:"";height:50%;aspect-ratio:1;border-radius:50%;
  border:var(--strich) dashed var(--szene-ring);background:var(--szene-ringfeld)}
/* Der Schatten ist eine ELLIPSE und kein gefilterter Schlagschatten: auf
   iOS ist ein Filter auf einem Pfad die Falle aus Regel 13, und das Tor
   `marken` haelt sie fest. (Es liest die Datei als TEXT - der verbotene
   Ausdruck darf hier also auch nicht als Beispiel stehen, sonst meldet
   das Tor den Kommentar statt des Fehlers. Neunmal passiert.)
   Sie setzt das Tier ausserdem besser auf den Boden als ein Schatten,
   der in jede Richtung gleich faellt. */
.platz.voll::before{content:"";position:absolute;left:50%;bottom:4%;
  width:46%;height:8%;border-radius:50%;background:var(--szene-schatten);
  transform:translateX(-50%)}
.platz .tierbild{height:94%;max-height:94%;width:auto;max-width:88%;
  position:relative}
.platz.r0 .tierbild{height:68%;max-height:68%;max-width:64%}
.platz.r1 .tierbild{height:82%;max-height:82%;max-width:76%}
/* Die Zeile liegt IM Bild, oben im Himmel: dort ist kein Platz, und als
   eigene Zeile darunter kostete sie die Hoehe, die der Bank fehlte. */
/* Die Zeile ist die ERSTE Zeile der Spalte, nicht ein Ueberzug: so kann
   sie keinen Platz verdecken. `min-height` haelt die Hoehe der Plaetze
   ruhig, wenn ein laengerer Satz kommt - „Das Streifenhörnchen geht
   wieder weg." ist der laengste und passt bei 320 Punkten Bildbreite in
   eine Zeile. */
.szenesatz{flex:none;align-self:center;max-width:94%;margin:0 0 1%;
  min-height:2.1em;display:flex;align-items:center;text-align:center;
  padding:var(--r0) var(--r2);border-radius:var(--rund-voll);
  background:var(--szene-zettel);font-size:calc(var(--s-klein) * .88)}

/* Die Bank: alles, was dem Kind gehoert - OHNE Namen. Wer schon im Bild
   steht, wird blass; derselbe Griff wie bei den fehlenden Aufklebern. */
.tierbank{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-wrap:wrap;
  align-content:flex-start;justify-content:center;gap:var(--r1)}
.bankstueck{width:56px;height:56px;flex:none;display:flex;align-items:center;
  justify-content:center;padding:var(--r0);
  border-radius:var(--r4);border:var(--kante-flach) solid var(--papier);
  background:var(--ton,var(--grund-2));box-shadow:var(--schatten-kleber);
  cursor:pointer;font:inherit}
.bankstueck .tierbild{width:100%;height:auto}
.bankstueck.gewaehlt{border-color:var(--gut);
  box-shadow:0 0 0 var(--strich) var(--gut), var(--schatten-kleber)}
.bankstueck.weg{background:var(--grund-2);box-shadow:var(--schatten-auf)}
.bankstueck.weg .tierbild{opacity:.22;filter:grayscale(1)}
/* HOCH wird gestapelt: dort ist die Breite knapp und die Hoehe da - genau
   umgekehrt. Die Grenze steht bei 560, weil das schmalste Geraet, das
   `passt` faehrt, 390 Punkte breit ist und das naechste 667. */
@media (max-width:560px){
  .rollen.landschaft{flex-direction:column;overflow:auto;align-items:center}
  /* Das Bild behaelt sein Verhaeltnis - auch hoch.
     Der erste Anlauf machte es hier 4:3, weil die hinterste Reihe bei
     16:9 nur 38 Punkte hoch war. Das lag aber nicht am Format, sondern
     an den ungleichen Zeilen; seit die Kaesten gleich hoch sind, misst
     die hinterste Reihe hier 58. Und 4:3 kostete etwas: die Kulisse ist
     16:9 und lag mit hellen Baendern ueber und unter dem Bild. */
  .szene{width:100%;max-width:100%;height:auto;flex:none}
  .tierbank{flex:none;width:100%}
}
/* KURZ UND QUER - das Zielgeraet und das kleinste. Dreissig Tiere sind
   dreissig Kaesten, und die muessen ohne Rollen in die Bank passen:
   bei 44 Punkten sind es auf 844 x 390 sechs je Reihe in fuenf Reihen
   (240 von 318 Punkten), auf 667 x 375 sechs in fuenf (240 von 303).
   Bei 56 waren es dort acht Reihen und 416 Punkte. */
@media (max-height:440px){
  .raumauf svg.raumstreifen{width:52px;height:30px}
  .raumwahl{gap:var(--r0);margin-bottom:var(--r1)}
  .raumchip{padding:var(--r0);gap:var(--r0)}
  .raumchip .raumzeichen{width:26px;height:26px}
  /* Die letzten fuenfzehn Punkte auf dem KLEINSTEN Geraet (667 x 375):
     die eigenen Abstaende der drei Bloecke fallen weg - das Raster des
     Buches setzt seine Zeilen ohnehin auseinander -, und der Aufkleber
     geht von 72 auf 66 (unten, wo er schon steht - zweimal derselbe
     Wert waere Regel 6). Gemessen 247 in 236, danach 225. */
  .raumwahl{margin-bottom:0}
  .tierraum{margin-bottom:0}
  /* Und die letzten fuenf: das Tierkapitel bringt vier Zeilen mit, wo
     die anderen zwei haben - vier Zeilenabstaende statt zwei. */
  .rollen.buch:has(.tierraum){row-gap:var(--r1)}
  /* Die Ueberschrift faellt weg - der KAPITELREITER traegt sie schon,
     samt Zahl („Meine Tiere · 15"). Gemessen auf 667 x 375: sichtbar
     sind 236 Punkte, und Ueberschrift, Reiterreihe, Tuer, Aufkleberwand
     und Gorillazeile waren zusammen 297. Ohne sie sind es 215. Zweimal
     dieselbe Auskunft kostet hier genau die Zeile, die fehlt. */
  .tierkopf{display:none}
  .bankstueck{width:44px;height:44px}
  .szenesatz{font-size:calc(var(--s-klein) * .8)}
}
/* Auf dem kleinsten Geraet (667 x 375) stand das Bild einmal auf 50 %
   Breite: 320 x 179, und die neun Plaetze wurden 42 Punkte hoch - unter
   dem Fingermass. Bei 58 % sind es 371 x 209 und 52 Punkte, und die
   Bank daneben braucht mit dreissig Kaesten zu 44 sechs Reihen von 288
   in 303 Punkten. Beides gemessen, keines gerechnet. */
}
}
.abzneu{display:flex;align-items:center;justify-content:center;gap:var(--r3);
  margin:var(--r3) 0;padding:var(--r2) var(--r4);border-radius:var(--rund-voll);
  background:var(--gut-h);border:var(--strich) solid var(--gut);
  font-family:var(--f-lesen);font-size:var(--s0);color:var(--tinte);
  max-width:100%}
/* Auf dem Telefon quer ist der Bildschirm 390 Punkte hoch, und das
   Forscherbuch war vorher randvoll. Die Abzeichenzeile hat die untere
   Aufkleberreihe 19 Punkte ueber den Rand geschoben - `passt` hat es
   gemeldet, nicht das Auge.
   Zurueckgeholt wird das an drei Stellen: kleineres Zeichen (28 statt
   34), knappere Polsterung, und die Mindesthoehe geht auf 44 - das ist
   die Fingergrenze und damit die Untergrenze, nicht eine Zahl, die man
   weiter druecken darf. */
@media (max-height:440px){
  .abzeichen{gap:var(--r2)}
  .abz{flex:1 1 260px;padding:var(--r1) var(--r2);gap:var(--r2);
    font-size:var(--s-klein);min-height:44px}
  .abz svg{width:28px;height:28px}
  /* Die Zahl rutscht in die ZEILE, statt eine eigene zu bekommen. Das
     spart die eine Zeile, die auf dem kuerzesten Bildschirm (mit Leiste
     sind es 340 Punkte) noch fehlte - gemessen: 5 Punkte, eine Zeile sind
     15. Auf dem grossen Bildschirm bleibt sie darunter, dort ist Platz. */
  .abz.offen small{display:inline;font-size:calc(var(--s-klein) * 0.9)}
  .tierneu{font-size:var(--s-klein);margin:var(--r0) 0;padding:var(--r0) var(--r3) var(--r0) var(--r1)}
  .tierneu .tierbild{width:34px}
  .tierraum{margin-bottom:var(--r1)}
  .tierraum h4{margin-bottom:var(--r0)}
  .tierwand{gap:var(--r1)}
  .tierfeld{width:66px}
  /* Gemessen auf 390 Punkten: „Schmetterling" ist der laengste Name eines
     gemalten Tieres und braucht bei .8 noch 68 Punkte - zwei zuviel fuer
     die 66, die im Aufkleber Platz haben. Bei .72 sind es 62. */
  .tierfeld span{font-size:calc(var(--s-klein) * .72)}
  .tierfeld{padding:var(--r0)}
  .abzneu{font-size:var(--s-klein);margin:var(--r1) 0;padding:var(--r1) var(--r3)}
  .abzneu svg{width:30px;height:30px}
  /* Und die Ueberschrift faellt weg. Auf 390 Punkten Hoehe ist sie der
     teuerste Posten des Blocks (30 Punkte samt Abstand) und der
     entbehrlichste: die Abzeichen sagen selbst, was sie sind - „Du kennst
     die drei Stadtstaaten" braucht kein Wort darueber. Fiona liest sie
     ohnehin nicht. */
  .abzkopf{display:none}
}
.kachel .umriss{width:96px;height:96px}
.kachel .kreis{width:64px;height:64px;border-radius:var(--rund-voll);display:flex;
  align-items:center;justify-content:center;font-family:var(--f-lesen);font-size:var(--s2);
  font-weight:700;color:var(--auf-flaeche)}

/* --- Spielfeld --- */
.feld{flex:1;display:flex;gap:var(--r4);padding:0 var(--r4) var(--r4);min-height:0;
  align-items:center;justify-content:center}
@media (orientation:portrait){.feld{flex-direction:column}}
/* Die Karte nimmt genau den Platz, den sie BRAUCHT - nicht den, den ein
   `flex:1` ihr zuteilt.
   Gemessen vorher: der Kasten war auf dem iPhone quer 420 Punkte breit,
   gezeichnet wurden 213. Deutschland ist hochformatig (Verhaeltnis 0,74),
   die Weltkarte querformatig (1,67) - ein Kasten fuer beide verschenkt
   immer bei einer von beiden. `--karte-ar` kommt aus der viewBox der
   gerade gezeigten Karte, wird also je Ebene richtig gesetzt.
   Der frei werdende Platz geht an die Antworten und an den Rand, statt
   als Loch neben der Karte zu stehen. */
/* Breite und Hoehe setzt `kartenGroesse()` in spiel.js - siehe dort, warum
   es in CSS nicht geht. Hier stehen nur die Grenzen, damit vor der ersten
   Messung nichts ueberlaeuft. */
.karte{flex:0 0 auto;min-width:0;min-height:0;max-width:100%;max-height:100%;
  aspect-ratio:var(--karte-ar,1);position:relative;
  display:flex;align-items:center;justify-content:center;touch-action:none}
/* `overflow:hidden`, seit es die Lupe gibt (M4z).
   Ohne das schiebt sich die vergroesserte Karte ueber die Antwortliste
   und ueber den Fragesatz - `overflow:visible` stand hier, damit ein
   Nadelkopf am Rand nicht abgeschnitten wird. Der Kasten ist aber
   grosszuegig genug, dass eine Nadel nie ganz aussen sitzt, und eine
   Karte, die halb ueber den Etiketten liegt, ist der schlimmere Fall. */
/* Geklemmt wird NUR, wenn die Lupe an ist.
 *
 * `overflow:visible` steht hier seit jeher, damit ein Nadelkopf am Rand
 * nicht abgeschnitten wird - und der Treffertest arbeitet mit
 * `elementFromPoint`, sieht also nur, was gezeichnet ist. Ein
 * `overflow:hidden` fuer alle Faelle hat prompt das Ziehen VON OBEN
 * kaputtgemacht: `ziehen` meldete „getroffen bis 30 px" statt 40.
 *
 * Vergroessert muss aber geklemmt werden, sonst schiebt sich die Karte
 * ueber die Antwortliste. Also genau dann - und keinen Fall frueher. */
.karte svg{width:100%;height:100%;overflow:visible}
.karte[data-lupe]:not([data-lupe=""]) svg{overflow:hidden}
/* Die Lupenknoepfe. Rechts unten in der Karte, uebereinander.
   44 Punkte, wie jeder Knopf, den ein Daumen treffen soll - `beruehrung`
   rechnet das nach. Halbdurchsichtiger Grund, damit man die Karte
   darunter noch sieht, aber ein voller Rand, damit sie nicht im Meer
   verschwinden. */
/* Seit Q33 stehen sie NEBEN der Karte, in der Werkzeugspalte - nicht mehr
   absolut auf ihr. Warum, steht in spiel.js an der Stelle, die sie
   anhaengt: sie verdeckten auf dem Zielgeraet 70,4 % von Australien.
   Nebeneinander und nicht uebereinander: die Werkzeugspalte ist auf dem
   kurzen Querformat hoch bemessen, aber nicht hoch genug fuer drei
   Knoepfe untereinander PLUS Mikrofon und Hoerknopf. */
.lupenknoepfe{display:flex;flex-wrap:wrap;gap:var(--r2);justify-content:center}
/* Q15: dieselbe Mechanik wie jeder andere leise Knopf.
   Er hatte einen Schlagschatten statt einer Kante und fuhr einen Punkt
   statt zwei - drittes Material und dritter Druckweg auf demselben
   Bildschirm. Durchsichtig bleibt er: er liegt auf der Karte, und was
   darunter liegt, soll man noch ahnen. */
.lupenknopf{width:44px;height:44px;border-radius:var(--rund-voll);
  border:var(--strich) solid var(--knopf-kante);background:color-mix(in oklch,var(--papier) 88%,transparent);
  color:var(--tinte);font-family:var(--f-ui);font-size:var(--s2);font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 var(--kante-flach) 0 var(--knopf-kante),
             inset 0 var(--strich) 0 var(--knopf-licht);
  transition:transform var(--d-tipp) var(--k-standard),
             box-shadow var(--d-tipp) var(--k-standard),
             border-color var(--d-tipp) var(--k-standard)}
.lupenknopf:active{transform:translateY(var(--kante-flach));
  box-shadow:0 0 0 var(--knopf-kante),inset 0 var(--strich) 0 var(--knopf-licht)}
/* Waehrend ein Etikett gezogen wird, nehmen sie nichts an - sonst faengt
   ein Knopf die Antwort ab, die auf das Land darunter gehoert. */
body[data-zieht] .lupenknoepfe{pointer-events:none}
@media (hover:hover){.lupenknopf:hover{border-color:var(--primaer-rand)}}
/* „Ganze Karte" steht nur da, wenn es etwas zurueckzusetzen gibt.
   Ein Knopf, der immer nichts tut, ist ein Hindernis (dieselbe
